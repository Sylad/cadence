<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1650 810" width="1650" height="810" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1f2328">
<title>Workflow of the lead skill in three lanes: the human, the lead session, and the orchestrate program with its agents</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
<marker id="arrw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker></defs>
<rect width="1650" height="810" fill="#ffffff"/>
<text x="825" y="34" text-anchor="middle" font-size="18" font-weight="600">The lead workflow: decide at the top, work in fresh sessions</text>
<rect x="10" y="70" width="1630" height="200" fill="#f6f8fa" stroke="#d0d7de"/>
<line x1="150" y1="70" x2="150" y2="270" stroke="#d0d7de"/>
<text x="24" y="146" font-weight="700" font-size="15" fill="#bf8700">Human</text>
<text x="24" y="166" font-size="11.5" fill="#57606a">chooses, answers,</text>
<text x="24" y="181" font-size="11.5" fill="#57606a">gives the UX verdict</text>
<rect x="10" y="270" width="1630" height="200" fill="#ffffff" stroke="#d0d7de"/>
<line x1="150" y1="270" x2="150" y2="470" stroke="#d0d7de"/>
<text x="24" y="339" font-weight="700" font-size="15" fill="#0969da">Lead session</text>
<text x="24" y="359" font-size="11.5" fill="#57606a">stays small:</text>
<text x="24" y="374" font-size="11.5" fill="#57606a">reads, decides, checks,</text>
<text x="24" y="389" font-size="11.5" fill="#57606a">delivers</text>
<rect x="10" y="470" width="1630" height="320" fill="#f6f8fa" stroke="#d0d7de"/>
<line x1="150" y1="470" x2="150" y2="790" stroke="#d0d7de"/>
<text x="24" y="606" font-weight="700" font-size="15" fill="#1a7f37">orchestrate</text>
<text x="24" y="626" font-size="11.5" fill="#57606a">program and agents</text>
<text x="24" y="641" font-size="11.5" fill="#57606a">(fresh short sessions)</text>
<text x="240" y="88" text-anchor="middle" font-size="11.5" font-weight="600" fill="#57606a">1 Tour</text>
<text x="420" y="88" text-anchor="middle" font-size="11.5" font-weight="600" fill="#57606a">2 Wave</text>
<text x="600" y="88" text-anchor="middle" font-size="11.5" font-weight="600" fill="#57606a">3 Relay</text>
<text x="780" y="88" text-anchor="middle" font-size="11.5" font-weight="600" fill="#57606a">4 Review</text>
<text x="960" y="88" text-anchor="middle" font-size="11.5" font-weight="600" fill="#57606a">5 Re-check</text>
<text x="1140" y="88" text-anchor="middle" font-size="11.5" font-weight="600" fill="#57606a">6 Delivery</text>
<text x="1320" y="88" text-anchor="middle" font-size="11.5" font-weight="600" fill="#57606a">7 Threshold</text>
<text x="1500" y="88" text-anchor="middle" font-size="11.5" font-weight="600" fill="#57606a">8 Close</text>
<g id="tour"><rect x="161" y="337" width="158" height="66" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="240" y="358.5" text-anchor="middle" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5">cadence lead tour</text>
<text x="240" y="374.5" text-anchor="middle">one line per project</text>
<text x="240" y="390.5" text-anchor="middle">+ three proposals</text>
</g>
<g id="choose"><rect x="161" y="137" width="158" height="66" rx="8" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/>
<text x="240" y="158.5" text-anchor="middle" font-weight="600">Picks the lots</text>
<text x="240" y="174.5" text-anchor="middle">and the order</text>
<text x="240" y="190.5" text-anchor="middle">(the priority)</text>
</g>
<g id="launch"><rect x="341" y="337" width="158" height="66" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="420" y="358.5" text-anchor="middle" font-weight="600">Starts the wave</text>
<text x="420" y="374.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5">orchestrate … --wave</text>
<text x="420" y="390.5" text-anchor="middle">in the background</text>
</g>
<g id="precheck"><rect x="161" y="508" width="158" height="82" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="240" y="529.5" text-anchor="middle" font-weight="600">Precheck</text>
<text x="240" y="545.5" text-anchor="middle">local model or Sonnet:</text>
<text x="240" y="561.5" text-anchor="middle">already delivered?</text>
<text x="240" y="577.5" text-anchor="middle">yes → back to lead</text>
</g>
<g id="spec"><rect x="341" y="480" width="158" height="66" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="420" y="501.5" text-anchor="middle" font-weight="600">Spec (screen: page)</text>
<text x="420" y="517.5" text-anchor="middle">spec-writer: mockup</text>
<text x="420" y="533.5" text-anchor="middle">+ sheet, 1440 / 390</text>
</g>
<g id="mockup"><rect x="521" y="480" width="158" height="66" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="600" y="501.5" text-anchor="middle" font-weight="600">Mockup review</text>
<text x="600" y="517.5" text-anchor="middle">ux-reviewer, 2 passes</text>
<text x="600" y="533.5" text-anchor="middle">max, then handed back</text>
</g>
<g id="backspec"><rect x="341" y="552" width="158" height="66" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="420" y="573.5" text-anchor="middle" font-weight="600">Back-end spec</text>
<text x="420" y="589.5" text-anchor="middle">spec: true: cases,</text>
<text x="420" y="605.5" text-anchor="middle">rules, contracts</text>
</g>
<g id="sheetreview"><rect x="521" y="552" width="158" height="66" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="600" y="573.5" text-anchor="middle" font-weight="600">Sheet review</text>
<text x="600" y="589.5" text-anchor="middle">code-reviewer, 2</text>
<text x="600" y="605.5" text-anchor="middle">passes max</text>
</g>
<g id="accept"><rect x="701" y="480" width="158" height="138" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="780" y="543" text-anchor="middle" font-weight="600">Accept</text>
<text x="780" y="559" text-anchor="middle">red tests + lock</text>
<text x="780" y="575" text-anchor="middle">if accept declared</text>
</g>
<g id="implement"><rect x="341" y="650" width="158" height="66" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
<text x="420" y="671.5" text-anchor="middle" font-weight="600">Implementation</text>
<text x="420" y="687.5" text-anchor="middle">test first, commits</text>
<text x="420" y="703.5" text-anchor="middle">cite the lot</text>
</g>
<g id="relay"><rect x="521" y="337" width="158" height="66" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="600" y="358.5" text-anchor="middle" font-weight="600">Relays the journal</text>
<text x="600" y="374.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5">tail -F journal.log</text>
<text x="600" y="390.5" text-anchor="middle">one sentence per line</text>
</g>
<g id="answer"><rect x="521" y="137" width="158" height="66" rx="8" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/>
<text x="600" y="158.5" text-anchor="middle" font-weight="600">Answers a question</text>
<text x="600" y="174.5" text-anchor="middle">the lead never</text>
<text x="600" y="190.5" text-anchor="middle">answers for them</text>
</g>
<g id="uxpass"><rect x="521" y="650" width="158" height="66" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="600" y="671.5" text-anchor="middle" font-weight="600">UX pass</text>
<text x="600" y="687.5" text-anchor="middle">visible lot + app</text>
<text x="600" y="703.5" text-anchor="middle">declared; vs mockup</text>
</g>
<g id="codereview"><rect x="701" y="650" width="158" height="66" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
<text x="780" y="671.5" text-anchor="middle" font-weight="600">Code review</text>
<text x="780" y="687.5" text-anchor="middle">Opus (Sonnet ≤ 0.25 d)</text>
<text x="780" y="703.5" text-anchor="middle">records raf review</text>
</g>
<g id="fix"><rect x="881" y="650" width="158" height="66" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="960" y="671.5" text-anchor="middle" font-weight="600">Correction</text>
<text x="960" y="687.5" text-anchor="middle">new session, 2 passes</text>
<text x="960" y="703.5" text-anchor="middle">3rd if it converges</text>
</g>
<g id="table"><rect x="701" y="337" width="158" height="66" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="780" y="358.5" text-anchor="middle" font-weight="600">Final table</text>
<text x="780" y="374.5" text-anchor="middle">ready · handed back</text>
<text x="780" y="390.5" text-anchor="middle">· « livrable jusqu'à »</text>
</g>
<g id="recheck"><rect x="881" y="337" width="158" height="66" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="960" y="358.5" text-anchor="middle" font-weight="600">Re-verifies itself</text>
<text x="960" y="374.5" text-anchor="middle">git log · tests · build</text>
<text x="960" y="390.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5">raf check</text>
</g>
<g id="uxverdict"><rect x="881" y="137" width="158" height="66" rx="8" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/>
<text x="960" y="158.5" text-anchor="middle" font-weight="600">Looks at the captures</text>
<text x="960" y="174.5" text-anchor="middle">UX verdict →</text>
<text x="960" y="190.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5">raf ux (visible lot)</text>
</g>
<g id="done"><rect x="1061" y="337" width="158" height="66" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="1140" y="358.5" text-anchor="middle" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5">raf done</text>
<text x="1140" y="374.5" text-anchor="middle">then push</text>
<text x="1140" y="390.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5">cadence deliver</text>
</g>
<g id="qa"><rect x="1061" y="650" width="158" height="66" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="1140" y="671.5" text-anchor="middle" font-weight="600">qa-reviewer</text>
<text x="1140" y="687.5" text-anchor="middle">reads only; blocking</text>
<text x="1140" y="703.5" text-anchor="middle">findings → the human</text>
</g>
<g id="ctx"><rect x="1241" y="337" width="158" height="66" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="1320" y="358.5" text-anchor="middle" font-weight="600">Context under limit?</text>
<text x="1320" y="374.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5">session context</text>
<text x="1320" y="390.5" text-anchor="middle">error = at threshold</text>
</g>
<g id="next"><rect x="1241" y="650" width="158" height="66" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
<text x="1320" y="671.5" text-anchor="middle" font-weight="600">Next wave</text>
<text x="1320" y="687.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5">… --continue</text>
<text x="1320" y="703.5" text-anchor="middle">draws the next ready lot</text>
</g>
<g id="close"><rect x="1421" y="337" width="158" height="66" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="1500" y="358.5" text-anchor="middle" font-weight="600">Close</text>
<text x="1500" y="374.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5">session-close</text>
<text x="1500" y="390.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5">session next ×3</text>
</g>
<g id="report"><rect x="1421" y="137" width="158" height="66" rx="8" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/>
<text x="1500" y="158.5" text-anchor="middle" font-weight="600">One line per project</text>
<text x="1500" y="174.5" text-anchor="middle">delivered · in progress</text>
<text x="1500" y="190.5" text-anchor="middle">· blocked (and why)</text>
</g>
<polyline points="240,337 240,203" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="248" y="236" text-anchor="start" font-size="11" fill="#57606a" class="lbl">proposals</text>
<polyline points="319,170 420,170 420,337" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="414" y="164" text-anchor="end" font-size="11" fill="#57606a" class="lbl">choice</text>
<polyline points="499,683 521,683" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arr)"/>
<polyline points="679,683 701,683" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arr)"/>
<polyline points="859,683 881,683" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arr)"/>
<polyline points="960,650 960,632 820,632 820,650" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="968" y="626" text-anchor="start" font-size="11" fill="#57606a" class="lbl">then review again</text>
<polyline points="870,683 870,430 780,430 780,403" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="876" y="446" text-anchor="start" font-size="11" fill="#57606a" class="lbl">wave ends</text>
<polyline points="510,683 510,430 600,430 600,403" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="516" y="646" text-anchor="start" font-size="11" fill="#57606a" class="lbl">journal</text>
<polyline points="630,337 630,203" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="636" y="236" text-anchor="start" font-size="11" fill="#57606a" class="lbl">question</text>
<polyline points="570,203 570,337" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="564" y="236" text-anchor="end" font-size="11" class="lbl" fill="#57606a">--resume --answer</text>
<polyline points="859,370 881,370" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arr)"/>
<polyline points="960,203 960,337" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="968" y="236" text-anchor="start" font-size="11" fill="#57606a" class="lbl">on the human's verdict,</text>
<text x="968" y="251" text-anchor="start" font-size="11" fill="#57606a" class="lbl">or the lead's (lead.ux: lead)</text>
<polyline points="1039,370 1061,370" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arr)"/>
<polyline points="1140,403 1140,650" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arr)"/>
<polyline points="1320,403 1320,650" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="1326" y="440" text-anchor="start" font-size="11" fill="#57606a" class="lbl">yes: chain</text>
<polyline points="1399,370 1421,370" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="1410" y="329" text-anchor="middle" font-size="11" fill="#57606a" class="lbl">limit reached: close</text>
<polyline points="1500,337 1500,203" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arr)"/>
<polyline points="1320,716 1320,746 420,746 420,716" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="870" y="740" text-anchor="middle" font-size="11" fill="#57606a" class="lbl">next wave: back to step 2, the limits still apply</text>
<rect x="170" y="760" width="22" height="14" rx="3" fill="none" stroke="#57606a" stroke-dasharray="5 3"/>
<text x="200" y="771" font-size="11.5" fill="#57606a">conditional step</text>
<text x="340" y="771" font-size="11.5" fill="#57606a">The lead never commits where a wave runs, and never delivers two projects at once. At most as many sessions or subagents as the cap the human sets (CADENCE_MAX_SESSIONS, 2 by default).</text>
<polyline points="420,403 420,440 240,440 240,508" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arr)"/>
<polyline points="319,549 330,549 330,513 341,513" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arr)"/>
<polyline points="330,549 330,585 341,585" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arr)"/>
<polyline points="499,513 521,513" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arr)"/>
<polyline points="679,513 701,513" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arr)"/>
<polyline points="499,585 521,585" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arr)"/>
<polyline points="679,585 701,585" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arr)"/>
<polyline points="240,590 240,683 341,683" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arr)"/>
<polyline points="780,618 780,634 420,634 420,650" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="232" y="640" text-anchor="end" font-size="11" fill="#57606a" class="lbl">other lots</text>
<text x="232" y="655" text-anchor="end" font-size="11" fill="#57606a" class="lbl">go straight on</text>
<text x="890" y="508" text-anchor="start" font-size="11" fill="#57606a" class="lbl">lots with screen: page</text>
<text x="890" y="523" text-anchor="start" font-size="11" fill="#57606a" class="lbl">spec, mockup, accept</text>
<text x="890" y="568" text-anchor="start" font-size="11" fill="#57606a" class="lbl">lots with spec: true</text>
<text x="890" y="583" text-anchor="start" font-size="11" fill="#57606a" class="lbl">spec, sheet review, accept</text>
</svg>
