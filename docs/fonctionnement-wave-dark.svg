<text x="958" y="230.5" text-anchor="middle" font-size="11.5" fill="#8b949e">Opus, Sonnet if ≤ 0.25 d</text>
<polyline points="860,219 886,219" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr2)"/>
<rect x="1050" y="193" width="140" height="52" rx="6" fill="#0d1117" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="1120" y="215.5" text-anchor="middle" font-weight="600" font-size="13.5" fill="#e6edf3">UX pass</text>
<text x="1120" y="230.5" text-anchor="middle" font-size="11.5" fill="#8b949e">visible lot · once, last</text>
<polyline points="1028,219 1048,219" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr2)"/>
