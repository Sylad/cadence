# Fiche d'écran — EXEMPLE ILLUSTRATIF (L166), pas un écran réel : il montre le format.
# Écran imaginaire « Prochain match » d'une app de club ; les appels API sont ceux de l'exemple du README (qa).
ecran:
  id: prochain-match
  titre: Prochain match
  route: /prochain-match
  lot: L0                      # le lot d'implémentation
  largeurs: [1440, 390]
  maquette: docs/specs/prochain-match/maquette.html
etats: [vide, chargement, erreur, charge]

champs:
  - { id: equipe-domicile, libelle: Équipe à domicile, type: texte, source: "GET /api/fixtures/next → home.name", obligatoire: true }
  - { id: equipe-exterieur, libelle: Équipe à l'extérieur, type: texte, source: "GET /api/fixtures/next → away.name", obligatoire: true }
  - { id: date-match, libelle: Date et heure, type: date-heure, source: "GET /api/fixtures/next → kickoff", obligatoire: true }
  - { id: score, libelle: Score, type: texte, source: "GET /api/fixtures/next → score", obligatoire: false }
  - { id: bouton-rappel, libelle: Me rappeler le match, type: bouton, source: "action A1", obligatoire: false }
  - { id: message-vide, libelle: Message d'état vide, type: texte, source: statique, obligatoire: true }

regles:
  - id: R1
    enonce: Le score n'est affiché qu'une fois le match joué ; avant, le champ score est absent.
    message: ~
    champs: [score]
    statut: sourcee
    source: "docs/qa/expectations.md, /fixtures/:id : « le score une fois le match joué »"
    tests: ["R1 — le score est absent avant le coup d'envoi", "R1 — le score s'affiche après le match"]
  - id: R2
    enonce: Sans match programmé, l'écran affiche le message d'état vide et aucun autre champ.
    message: "Aucun match programmé pour le moment."
    champs: [message-vide, equipe-domicile]
    statut: sourcee
    source: "demande du lot : « un état vide qui dit quoi faire »"
    tests: ["R2 — état vide : le message s'affiche, pas d'équipe"]
  - id: R3
    enonce: Si l'appel échoue, l'écran affiche l'erreur et un bouton « Réessayer » qui rappelle l'API.
    message: "Impossible de charger le prochain match."
    champs: []
    statut: hypothese
    si_faux: Si le club veut un affichage du dernier résultat connu à la place, seul ce bloc change (aucune donnée en jeu).
    tests: ["R3 — erreur : message et bouton Réessayer", "R3 — Réessayer relance l'appel"]
  - id: R4
    enonce: Le rappel ne peut être demandé qu'une fois par match ; le bouton devient inactif après.
    message: "Rappel enregistré."
    champs: [bouton-rappel]
    statut: hypothese
    si_faux: Si plusieurs rappels sont voulus, la clé (utilisateur, match) du stockage change — coûteux à défaire une fois des rappels créés (question ciblée au lead).
    tests: ["R4 — un second clic ne crée pas de rappel", "R4 — le bouton est inactif après le rappel"]

actions:
  - { id: A1, declencheur: bouton-rappel, appel: "POST /api/fixtures/next/reminder", regles: [R4] }
  - { id: A2, declencheur: ~, appel: "GET /api/fixtures/next", regles: [R1, R2, R3] }
