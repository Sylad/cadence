    goal: "Un panneau Pane du mod plugins/cadence-hud (charger la skill plugin-authoring, prendre la bande existante comme modèle) qui montre, pour chaque projet du dossier parent, l'arbre de ses lots non clos (parent → sous-lots) avec leur état et les liens after:, lu par cadence lead tour --json ou le même code ; lecture seule, rafraîchi quand un plan ou une vague change ; test du rendu (claude plugin test) et doc. Décision du lead (28-10, après la 2e revue de la fiche) : dans un plan natif, les sous-tâches (lot.tasks, id <lot>/<n>) sont les sous-lots du panneau — elles entrent dans le champ lots de lead tour --json avec parent: <lot> et leur état ; les sous-tâches closes sont exclues comme les lots clos ; dans un plan tenu par un autre outil, Lot.parent reste la source. La maquette est validée par Sylvain."
