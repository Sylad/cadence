# Documentation qui suit le code (docs.sync, L143) : un lot dont les commits touchent le code,
# les gabarits, les agents ou les skills doit aussi toucher le README ou une page docs/ (le contenu du README y est parti, L232).
docs:
  sync:
    - paths: [src/**, bin/*.js, templates/**, agents/**, skills/**, '!**/*.test.ts']
      docs: [README.md, 'docs/*.md']
  since: 2026-10-09

# Porte « code modifié sans test » (L287) : le code du paquet sans fichier de test touché part en correction avant la revue.
orchestrate:
  # Escalade (L340, cadence L337 / 1.12.0) : avant de rendre un lot encore non conforme après ses passes, la vague joue
  # une correction et une revue neuve en Fable (règle du lead depuis le 17-10, oubliée deux fois à la main).
  escalation: { model: fable }
  # Porte de tests (L324, 25-10) : la vague lance la suite et le typecheck après chaque écriture ; un rouge part en correction au lieu d'arriver dans main.
  test: npx vitest run
  # Rejeu seul d'un rouge avant qu'il compte (L354) : mise-en-service.test.ts rouge puis vert à la relance sous charge le 26-10 (intégration de L364).
  testReplay: npx vitest run --minWorkers=1 --maxWorkers=$CADENCE_TEST_WORKERS {files}
  # Garde-fous de qualité (L462) : le cliquet (ESLint, sonarjs, knip, jscpd contre qualite-baseline.json) fait partie de la porte, après le typecheck ; un code mort ou un fichier qui grossit repart en correction, et la base du lot ne peut pas dépasser celle de main (--contre).
  build: npx tsc --noEmit && node scripts/qualite.mjs --contre main
  # Sonde de cas limites (L497, essai) : une session Sonnet neuve cherche à casser le diff du lot par des tests aux bornes avant la revue Opus ; un test rouge repart en correction. À garder ou retirer sur les chiffres de cadence corrections et cadence perf (L430).
  probe: true
  # Mode worktree (L279) : un worktree par lot ; activé par défaut le 25-10 (L320, décision Sylvain après les essais L310 et L316 : −45 % et −22 % de mur, 3 intégrations automatiques).
  worktrees: true
  # Précheck sur Sonnet (L328, 25-10) : le local (claude-local) plantait sur ~1 lot sur 3 et disait « oui » à tort ; Sonnet tranche en ~16 s.
  precheck: true
  # Porte déportée (L403, L617, activée par L618) : build et tests joués par ssh sur le WSL de mini-blue, au sha poussé, avec cache de dépendances (docs/remote-gate.md).
  # « mini-blue-wsl » est un alias du ~/.ssh/config de la machine qui lance cadence : sans lui (un clone), l'hôte ne répond pas et la porte retombe sur la porte locale, en le disant.
  gate:
    host: mini-blue-wsl
    install: npm ci
    refs: [main, origin/main]
  testGate:
    code: [src/**, 'bin/*.js', '!**/*.test.ts']
    tests: ['test/**']

# Lecteurs de l'ancien emplacement du plan (l'ancien dossier du plan) que « raf migrate » laisse tels quels (L284) : ils décrivent ou testent le repli sur l'ancien emplacement
# (les autres projets n'ont pas tous migré), ou datent d'avant le déplacement (fiches, conceptions, mesures).
migrate:
  keep:
    - src/**
    - scripts/mise-en-service.mjs
    - scripts/qualite.mjs                       # L586 : le plan d'un lot de config se cherche aussi à l'ancien emplacement
    - docs/qualite.md
    - templates/**
    - agents/**
    - skills/**
    - README.md
    - docs/overview.md
    - docs/raf.md
    - docs/fonctionnement.md
    - docs/stabilite.md
    - docs/orchestrate.md
    - docs/lead.md
    - docs/session.md
    - docs/specs/**
    - docs/superpowers/**
    - docs/mesures/**
    - docs/perf/**
    - docs/etudes/**
    - test/migrate.test.ts
    - test/plan-dossier-cache.test.ts
    - test/orchestrate-precheck-l322.test.ts
    - test/check.test.ts
    - test/lead-tour-perf.test.ts
    - test/ventilation-plan.test.ts
    - test/mise-en-service.test.ts
    - test/orchestrate-command.test.ts          # le plan d'un autre outil, taches.yaml (plan: path)
    - test/orchestrate-worktree-harness.ts
    - test/orchestrate-worktree-plan-writes.test.ts
    - test/import-l472.test.ts                  # le plan d'un autre outil, taches.yaml (plan: path)
    - test/import-journal-l582.test.ts          # le plan et le journal d'un autre outil (plan: path, plan.journal)

# Bornes de fichiers (L626) : le brief d'écriture donne les limites des fichiers que le lot cite, le hook « cadence claude-hook bornes » mesure le fichier après chaque écriture,
# et la porte ciblée joue les tests déclarés (faute de lien d'import, vitest related ne les trouve pas) dès qu'un lot touche l'un des fichiers. Lignes comptées comme le split('\\n') des tests (ligne vide finale comprise), colonnes et tailles en caractères (concepts.md : 15 Ko = 15 * 1024).
bounds:
  - paths: [README.md]
    lines: 64
    columns: 160
    tests: [test/readme-accueil.test.ts]
  - paths: [docs/concepts.md]
    chars: 15360
    tests: [test/concepts-doc.test.ts, test/pret-tirable-l601.test.ts]
  - paths: [CHANGELOG.md]
    tests: [test/changelog.test.ts, test/changelog-unreleased-titres-l568.test.ts]
  - paths: [package.json, 'docs/*.md']
    tests: [test/avec-vos-outils.test.ts]
