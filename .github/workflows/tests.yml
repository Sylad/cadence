# Diagnostic de la suite sur le runner GitHub, sans rien publier : même image, même Node 24, même identité git
# et même npm ci que le job de publish.yml. Lancement à la main (workflow_dispatch) ou par un push sur une branche diag/**.
name: tests

on:
  workflow_dispatch:
  push:
    branches: ['diag/**']

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # Tout l'historique et les tags (L336) : test/changelog.test.ts cherche les commits de chaque lot cité sous le dernier tag.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Comme publish.yml, pour que npm soit le même.
      - run: npm install -g npm@^11.5.1

      # Les tests créent des dépôts git jetables : il leur faut une identité (comme publish.yml).
      - run: |
          git config --global user.name "cadence-ci"
          git config --global user.email "cadence-ci@users.noreply.github.com"

      # cadence ref appelle poppler et tesseract (ses tests rendent de vrais PDF et lisent leur texte par OCR) ; ImageMagick y est remplacé par un faux (ref measure décode les PNG lui-même).
      - run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr

      # Les tests de rendu réel de cadence ref corpus (R16, R17, R18, R20) rendent le corpus avec Playwright et son Chromium, que le dépôt ne porte pas
      # (sans CADENCE_PLAYWRIGHT ils sont ignorés). Playwright est installé hors du dépôt, à la version qui sert à la maison (maritime-atlas/qa),
      # avec les polices système que Chromium attend (fonts-liberation pour Arial, d'où les zones de R20).
      - name: Playwright et Chromium (rendu réel du corpus)
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-audit --no-fund playwright@1.61.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "CADENCE_PLAYWRIGHT=$RUNNER_TEMP/pw/node_modules/playwright" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Environnement vu par la suite
        run: |
          git --version
          node --version
          npm --version
          git config --global --list || true
          env | grep '^GIT_' || echo "aucune variable GIT_*"

      # Le README est une page d'accueil (L232) : aucun lien relatif ni ancre cassé dans lui et dans les pages docs/.
      - name: Liens du README et des pages docs/
        run: node scripts/check-links.mjs

      # prepublishOnly de publish.yml : typecheck puis tests.
      - run: npm run typecheck
      - run: npm test

      # Le run rouge de publish.yml faisait tourner la suite DANS `npm publish` (prepublishOnly), pas à côté : ici de même,
      # sans --provenance ni jeton, le dry-run ne publie rien. `npm run env` est un script interne de npm : l'environnement donné aux scripts.
      - name: Environnement que npm donne à ses scripts
        run: npm run env | grep -E '^(npm_config_(tmp|cache|prefix|git|ignore_scripts)|TMPDIR|INIT_CWD|HOME|GIT_)' || true

      - name: Suite sous npm publish --dry-run
        continue-on-error: false
        run: npm publish --dry-run --access public
