# Publication sur npm par la publication de confiance (Trusted Publishing, OIDC) :
# aucun jeton stocké, npm vérifie que la publication vient de ce workflow de Sylad/cadence.
# Déclenchée par un tag v<version> qui doit correspondre à la version de package.json,
# de .claude-plugin/plugin.json et de .claude-plugin/marketplace.json, et CHANGELOG.md doit avoir
# une section « ## [x.y.z] » pour cette version : elle devient le texte de la release GitHub.
name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # crée la release GitHub avec la section du CHANGELOG
  id-token: write   # jeton d'identité GitHub, échangé contre un droit de publication par npm

# Un seul run à la fois par ref : un doublon (vécu sur v0.10.0, deux runs à 2 s d'écart) attend le premier
# au lieu de publier en parallèle, sans jamais annuler celui qui publie.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Le jeton en écriture ne reste pas dans .git/config, où npm ci et les scripts de build pourraient le lire ;
      # gh lit GH_TOKEN.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # La publication de confiance demande npm ≥ 11.5.1 ; épinglé sur la majeure 11 pour ne pas subir une 12.
      - run: npm install -g npm@^11.5.1

      - name: Le tag correspond à package.json et aux fichiers du plugin
        run: |
          for f in package.json .claude-plugin/plugin.json; do
            test "v$(node -p "require('./$f').version")" = "$GITHUB_REF_NAME" \
              || { echo "tag $GITHUB_REF_NAME ≠ version de $f"; exit 1; }
          done
          test "v$(node -p "require('./.claude-plugin/marketplace.json').plugins[0].version")" = "$GITHUB_REF_NAME" \
            || { echo "tag $GITHUB_REF_NAME ≠ version de .claude-plugin/marketplace.json"; exit 1; }

      # Pas de tag sans notes de version : la section « ## [x.y.z] » est extraite, elle servira de texte à la release.
      - name: Le CHANGELOG a une section pour le tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '/^## \[/ { on = (index($0, "## [" v "]") == 1); if (on) next } on' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md" \
            || { echo "CHANGELOG.md n'a pas de section « ## [$v] » non vide"; exit 1; }

      # Les tests créent des dépôts git jetables : il leur faut une identité.
      - run: |
          git config --global user.name "cadence-ci"
          git config --global user.email "cadence-ci@users.noreply.github.com"

      - run: npm ci
      # prepublishOnly relance typecheck + tests, prepare construit dist/ : une suite rouge arrête tout.
      # Version déjà au registre (run en double, ou relance après une publication réussie) : on saute npm publish
      # au lieu de finir en 409. Seul E404 veut dire « absente » ; toute autre erreur de npm view est fatale.
      - name: La version est-elle déjà au registre
        id: registry
        run: |
          v="${GITHUB_REF_NAME#v}"
          name="$(node -p "require('./package.json').name")"
          if out="$(npm view "$name@$v" version 2>&1)"; then
            echo "$v est déjà publiée sur npm : npm publish est sauté, ce run n'a rien à faire de plus."
            echo "published=true" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$out" | grep -q E404; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "$out"; exit 1
          fi

      - if: steps.registry.outputs.published != 'true'
        run: npm publish --access public --provenance

      # Après la publication seulement : pas de release pour une version qui n'est pas sur npm.
      - name: Release GitHub avec la section du CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "La release $GITHUB_REF_NAME existe déjà : rien à créer."
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag
          fi
