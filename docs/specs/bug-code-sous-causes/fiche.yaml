# L447 — suite de L428 (docs/mesures/bug-code-2026-10-29.md) : le goulot « bug de code » pèse 69 % des passes classées (74 sur 107, 24→30-10).
# L428 a lu 75 passes à la main et posé un bloc dans le brief implement. L447 rend cette lecture mesurable par la commande
# (sous-causes), désigne le maillon dominant par une règle écrite, et pose UN seul mécanisme à ce maillon.
sujet:
  id: bug-code-sous-causes
  titre: "cadence corrections et perf : sous-causes des passes « bug de code », maillon dominant, un mécanisme posé à ce maillon"
  lot: L447
  perimetre:
    modules: [src/corrections.ts, src/perf.ts, src/cli.ts, templates/orchestrate, docs/corrections.md, docs/mesures]
    endpoints: []
    jobs: []
    hors_perimetre:
      - "les sept causes de CAUSES, leur cache .cadence/corrections.json (format et lecture inchangés) et le ⚠ goulot de perf (L225 R19, src/perf.ts:702)"
      - "les 37 passes sans revue (tests rouges) : elles restent comptées à part (sans-constat), jamais envoyées au modèle ; leur analyse est un autre lot"
      - "la mesure sur la fenêtre suivante : le protocole est écrit dans docs/mesures, les lignes « après » sont remplies par un lot de mesure ultérieur"
      - "le brief fix, la revue, et tout second mécanisme : un seul maillon reçoit un mécanisme"

cas:
  - id: C1
    titre: Le lead sous-classe les passes « bug de code » d'une fenêtre
    acteur: le lead
    declencheur: commande cadence corrections --classify
    preconditions:
      - le dossier a des journaux sous .cadence/runs
      - Ollama répond
    nominal:
      - La commande classe les passes comme avant (cache corrections.json).
      - Elle envoie ensuite au modèle local chaque passe dont la cause retenue est bug-code et qui n'a pas de sous-cause en cache, avec ses constats.
      - Le modèle répond par une sous-cause parmi une liste fermée ; elle est écrite dans le cache des sous-causes.
      - Le rapport ajoute la section « Bug de code par sous-cause » (nombre et part par sous-cause) et le maillon dominant.
    alternatives:
      - { si: "le modèle ne répond pas, répond hors liste ou Ollama est en panne pour une passe", alors: "la passe n'entre pas au cache des sous-causes, elle est comptée « sans sous-cause », une relance la reprend", regles: [R3] }
      - { si: "la passe a une sous-cause relue à la main (champ manual)", alors: "la relecture prime sur le modèle", regles: [R4] }
      - { si: "le cache des sous-causes est illisible ou porte une sous-cause inconnue", alors: "la commande refuse sans rien écrire", regles: [R5] }
      - { si: "aucune passe bug-code dans la fenêtre", alors: "pas de section, le rapport est celui d'avant octet pour octet", regles: [R9] }
      - { si: "--json", alors: "une clé bugCode s'ajoute, les clés existantes sont inchangées", regles: [R9] }
    resultat: La mesure dit quelle sorte de bug de code pèse, pas seulement qu'il pèse.
  - id: C2
    titre: Le lead lit le maillon dominant dans cadence perf
    acteur: le lead
    declencheur: commande cadence perf
    preconditions:
      - un cache de sous-causes existe, ou n'existe pas
    nominal:
      - La commande compte, dans la fenêtre courante, les sous-causes des passes dont la cause retenue est bug-code.
      - "Elle imprime sous « causes dominantes » une ligne « bug de code (N passes) : 1. … » avec le maillon dominant."
    alternatives:
      - { si: "moins de 10 passes bug-code sous-classées, ou aucune sous-cause à plus de 40 %, ou maillons à égalité", alors: "la ligne dit « maillon dominant : aucun » avec la raison, aucun mécanisme n'est à poser", regles: [R2, R6] }
      - { si: "le cache des sous-causes est absent", alors: "la ligne est « sous-causes n/d · à classer : cadence corrections --classify », perf reste en lecture seule", regles: [R7] }
      - { si: "le cache des sous-causes est illisible", alors: "un avertissement, la ligne est omise, le reste du tableau est inchangé", regles: [R7] }
      - { si: "aucune passe bug-code dans la fenêtre", alors: "pas de ligne, la sortie est celle d'avant", regles: [R9] }
      - { si: "--json", alors: "corrections.causes.current gagne bugCode, les clés existantes sont inchangées", regles: [R9] }
    resultat: Le maillon à corriger est désigné par une règle, sur la fenêtre de perf.
  - id: C3
    titre: Un seul mécanisme est posé au maillon dominant
    acteur: la session du lot L447 (implémentation)
    declencheur: lecture de la mesure de la fenêtre 24→30-10 par cadence corrections puis pose du mécanisme
    preconditions:
      - C1 a classé la fenêtre 24→30-10 (cadence corrections --classify --since 2026-10-24)
    nominal:
      - La session lit le maillon dominant et la table des sous-causes.
      - Elle écrit docs/mesures/bug-code-2026-10-30.md avec le tableau mesuré, le maillon dominant et le protocole de mesure sur la fenêtre suivante (part conforme du premier coup, causes).
      - Elle pose un mécanisme, et un seul, dans le fichier du maillon désigné (brief implement, auto-vérification avant rendu, porte locale ou fiche).
    alternatives:
      - { si: "aucun maillon dominant (R2)", alors: "aucun mécanisme n'est posé, le document dit pourquoi et ce qu'il faut mesurer ensuite", regles: [R2, R8] }
      - { si: "Ollama indisponible pour classer la fenêtre", alors: "le document le dit, le mécanisme n'est pas posé sur une lecture à la main", regles: [R8] }
    resultat: Un mécanisme posé sur une mesure, avec le protocole pour juger de son effet.

regles:
  - id: R1
    cas: [C1]
    enonce: "Une passe dont la cause retenue (manual sinon cause) est bug-code reçoit une sous-cause parmi une liste fermée : cas-limite (cas limite non testé ou non tenu), test-casse (test existant cassé par le changement), contrat-mal-lu (contrat, fiche ou énoncé mal lu), appelant-oublie (oubli d'un appelant ou d'un autre site à changer), affirmation-fausse (doc, commentaire ou rapport faux), test-vide (test qui ne peut échouer ou comportement sans test), autre. Une passe d'une autre cause, ou sans constat, n'est jamais envoyée au modèle pour cela. Une passe a une seule sous-cause."
    statut: sourcee
    source: "titre du lot L447 : « sous-classer les constats bug de code (cas limite non testé, test existant cassé, contrat ou fiche mal lu, oubli d'un appelant, …) » ; familles lues à la main dans docs/mesures/bug-code-2026-10-29.md §2 (cas limite, affirmation fausse, test qui ne peut échouer). Les sept valeurs exactes et leurs identifiants sont un choix du rédacteur."
    tests: ["R1 — une passe bug-code est envoyée au modèle de sous-cause, une passe spec-floue ne l'est pas", "R1 — une passe sans constat n'est jamais envoyée", "R1 — une réponse hors de la liste des sept sous-causes est refusée"]
  - id: R2
    cas: [C2, C3]
    enonce: "Chaque sous-cause relève d'un maillon : cas-limite et test-vide → brief implement ; affirmation-fausse et appelant-oublie → auto-vérification avant rendu ; test-casse → porte locale ; contrat-mal-lu → fiche ; autre → aucun. Le maillon dominant est celui dont les sous-causes pèsent le plus de passes ; il n'est désigné que si au moins 10 passes bug-code de la fenêtre sont sous-classées et que ses passes pèsent au moins 40 % d'elles. Sinon, ou à égalité de deux maillons en tête, il n'y en a aucun, et la ligne dit la raison."
    statut: hypothese
    si_faux: "Seuls la table sous-cause → maillon et les seuils 10 et 40 % changent (constantes dans src/corrections.ts) ; aucune donnée stockée ne porte le maillon, il est recalculé à chaque lecture."
    tests: ["R2 — 6 cas-limite et 4 test-vide sur 10 : le maillon dominant est le brief implement", "R2 — 9 passes sous-classées seulement : aucun maillon dominant, raison donnée", "R2 — deux maillons à égalité en tête : aucun maillon dominant", "R2 — un maillon à 39 % : aucun maillon dominant, à 40 % : désigné", "R2 — la sous-cause autre ne désigne aucun maillon"]
  - id: R3
    cas: [C1]
    enonce: "Une sous-cause n'entre au cache que sur une réponse valide du modèle. Une panne, un statut non 2xx ou une réponse hors liste laisse la passe hors cache ; elle est comptée « sans sous-cause » dans le rapport et reprise par la relance. Le classement des causes (corrections.json) n'est pas affecté."
    statut: sourcee
    source: "comportement codé de classifyAll et ollamaClassifier : un échec n'entre pas au cache (src/corrections.ts:300 et suivants, « un échec n'entre pas au cache (une relance le reprend) »)"
    tests: ["R3 — Ollama répond 500 : la passe n'est pas au cache des sous-causes et est comptée sans sous-cause", "R3 — une relance classe la passe restée hors cache", "R3 — une panne de sous-cause laisse corrections.json inchangé"]
  - id: R4
    cas: [C1]
    enonce: "Un champ manual posé à la main dans le cache des sous-causes (une des sept valeurs) prime sur la réponse du modèle dans tous les tableaux, comme pour les causes."
    statut: sourcee
    source: "règle codée pour les causes : Classification.manual prime, src/corrections.ts:30-35 et measure (c.manual ?? c.cause), docs/corrections.md"
    tests: ["R4 — manual contredit le modèle : le tableau compte la relecture", "R4 — manual hors liste : la commande refuse le fichier"]
  - id: R5
    cas: [C1]
    enonce: "Le cache des sous-causes est un fichier à part, <dossier>/.cadence/corrections-sous-causes.json (--cache-sous-causes pour un autre), objet clé de passe → { sous, by, manual? }. Illisible, ou sous-cause inconnue : cadence corrections refuse (code 1) sans réécrire le fichier, comme pour corrections.json. Absent : lu comme vide."
    statut: sourcee
    source: réponse du lead, 2026-10-30, vague 2026-10-30-1305
    tests: ["R5 — fichier illisible : code 1 et fichier intact", "R5 — sous-cause inconnue : code 1 avec la clé citée", "R5 — fichier absent : lu comme vide"]
  - id: R6
    cas: [C2]
    enonce: "cadence perf imprime, sous la ligne « causes dominantes », « bug de code (N passes sous-classées sur M) : 1. cas limite … · 2. … · maillon dominant : <maillon> » pour la fenêtre courante, ou « maillon dominant : aucun (<raison>) » ; les passes sans sous-cause sont comptées à part."
    statut: hypothese
    si_faux: "Seul le libellé de la ligne change ; la règle R2 qui désigne le maillon ne change pas."
    tests: ["R6 — la ligne cite les sous-causes dans l'ordre décroissant et le maillon", "R6 — maillon aucun : la raison est imprimée", "R6 — seules les passes de la fenêtre courante sont comptées"]
  - id: R7
    cas: [C2]
    enonce: "cadence perf reste en lecture seule et ne bloque pas : cache des sous-causes absent → « sous-causes n/d · à classer : cadence corrections --classify » ; illisible → avertissement « perf : <fichier> illisible, sous-causes n/d » sur stderr et ligne omise ; code de sortie 0 dans les deux cas."
    statut: hypothese
    si_faux: "Si perf doit refuser comme avec corrections.json illisible (src/cli.ts, readPerf), seul le code de sortie passe à 1 sur ce cas ; aucune donnée en jeu."
    tests: ["R7 — cache absent : la ligne n/d et le code 0", "R7 — cache illisible : avertissement, ligne omise, reste du tableau identique, code 0", "R7 — perf n'écrit aucun fichier"]
  - id: R8
    cas: [C3]
    enonce: "Le lot pose un seul mécanisme, au maillon désigné par la règle R2 sur la fenêtre 24→30-10, et le documente dans docs/mesures/bug-code-2026-10-30.md : tableau des sous-causes issu de la commande, maillon, texte du mécanisme, protocole sur deux fenêtres (part conforme du premier coup, causes). Aucun maillon dominant ou classement impossible : aucun mécanisme n'est posé et le document dit pourquoi. Les fichiers des autres maillons ne changent pas."
    statut: sourcee
    source: "titre du lot L447 : « désigner le maillon dominant, et y poser UN mécanisme … ; mesure : part conforme du premier coup et causes sur la fenêtre suivante »"
    tests: ["R8 — le document cite le maillon et le fichier qui porte le mécanisme, et ce fichier contient le texte du mécanisme", "R8 — le document contient le tableau des sous-causes et le protocole de mesure", "R8 — les gabarits des autres maillons n'ont pas le texte du mécanisme"]
  - id: R9
    cas: [C1, C2]
    enonce: "Sans passe bug-code dans la fenêtre, la sortie texte de cadence corrections et de cadence perf est celle d'avant octet pour octet. Avec elles, seules s'ajoutent la section ou la ligne de sous-causes et, en --json, la clé bugCode (perf : corrections.causes.current.bugCode) ; aucune clé existante ne change de type ni de sens, et corrections.json garde son format."
    statut: hypothese
    si_faux: "Si un consommateur compare la sortie JSON entière, la clé ajoutée le casse ; il faudrait alors une option --sous-causes pour l'activer."
    tests: ["R9 — sans bug-code, le rapport texte est identique à celui d'avant", "R9 — --json : les clés existantes sont inchangées, bugCode s'ajoute", "R9 — perf --json : les clés de corrections.causes.current existantes sont inchangées", "R9 — corrections.json n'est pas modifié par la sous-classification"]
  - id: R10
    cas: [C1]
    enonce: "Le prompt de sous-classement donne au modèle les constats de la passe et les commits de correction, demande UNE sous-cause de la liste pour le constat le plus grave, et définit chaque valeur en une ligne ; température 0, sortie contrainte par un schéma à sept valeurs, comme le classeur des causes."
    statut: sourcee
    source: "ollamaClassifier existant : température 0, format JSON contraint, constats tronqués à 1500 caractères (src/corrections.ts, SYSTEM et ollamaClassifier)"
    tests: ["R10 — la requête a temperature 0 et un enum de sept sous-causes", "R10 — les constats sont tronqués à 1500 caractères"]

contrats:
  - id: A1
    appel: commande cadence corrections [dossier] [--classify [--model m]] [--cache fichier] [--cache-sous-causes fichier] [--since date] [--until date] [--json]
    entree: "options existantes ; --cache-sous-causes ajoute le chemin du cache des sous-causes ; les sous-causes sont classées avec --classify, lues sans lui"
    sortie: "rapport existant, plus la section « Bug de code par sous-cause » (sous-cause, passes, part, maillon) et la ligne du maillon dominant ; --json : clé bugCode { classees, sansSousCause, parSousCause, maillon }"
    erreurs:
      - { code: log error, message: "<fichier> : JSON illisible (un objet clé → classement est attendu), corrigez ou supprimez le fichier" }
      - { code: log error, message: "<fichier> : sous-cause inconnue pour <clé> : <valeur>" }
    regles: [R1, R3, R4, R5, R9, R10]
  - id: A2
    appel: commande cadence perf [dossier] [--since date] [--json]
    entree: "options existantes, aucune nouvelle"
    sortie: "tableau existant, plus la ligne « bug de code (N passes sous-classées sur M) … maillon dominant » ; --json : corrections.causes.current.bugCode"
    erreurs:
      - { code: log warn, message: "perf : <fichier> illisible, sous-causes n/d" }
    regles: [R2, R6, R7, R9]
  - id: A3
    appel: commande cadence corrections (cache des sous-causes illisible)
    entree: "un fichier corrections-sous-causes.json qui n'est pas un objet JSON, ou porte une sous-cause inconnue"
    sortie: "aucune sortie, code 1, fichier intact"
    erreurs:
      - { code: log error, message: "<fichier> : JSON illisible (un objet clé → classement est attendu), corrigez ou supprimez le fichier" }
      - { code: log error, message: "<fichier> : sous-cause inconnue pour <clé> : <valeur>" }
    regles: [R5]

donnees:
  - { id: D1, objet: ".cadence/corrections-sous-causes.json ({ clé de passe: { sous, by, manual? } })", existant: false, modification: aucune, note: "nouveau fichier, écrit par cadence corrections --classify ; absent = vide" }
  - { id: D2, objet: ".cadence/corrections.json (cause par passe)", existant: true, modification: aucune, note: "format, lecture et écriture inchangés (R9) ; il fournit la cause retenue qui sélectionne les passes bug-code" }
  - { id: D3, objet: "journaux .cadence/runs/<vague>/<projet>--<lot>.json", existant: true, modification: aucune, note: "lus comme avant, aucun champ ajouté" }
  - { id: D4, objet: "docs/mesures/bug-code-2026-10-30.md", existant: false, modification: aucune, note: "document de mesure et de protocole (R8)" }
