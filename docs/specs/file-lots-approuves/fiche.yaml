sujet:
  id: file-lots-approuves
  titre: File de lots pré-approuvés tirée à chaque créneau libre
  lot: L498
  perimetre:
    modules: [src/orchestrate/queue.ts, src/orchestrate/queue-command.ts, src/orchestrate/queue-draw.ts, src/orchestrate/draw.ts, src/orchestrate/ajout.ts, src/orchestrate/execute.ts, src/orchestrate/command.ts, src/orchestrate/command-args.ts, src/orchestrate/command-checks.ts, src/orchestrate/continue.ts, src/ready-free.ts]
    endpoints: []
    jobs: []
    hors_perimetre:
      - "l'ajout d'un lot à une vague vivante lui-même (--add <projet:lot>, lot L421, dépendance : la file l'utilise, elle ne le définit pas ni n'en fixe le contrat)"
      - "lever pour un lot approuvé les garde-fous continue.exclude, continue.maxEstimate et « non tirable » (option, pas livrée par ce lot)"
      - "le remplissage des créneaux libres par le plan lui-même (L527, L587 : la file s'y insère, avant le plan, et ne le redéfinit pas)"
      - "l'affichage de la file dans le HUD ou dans le tour du lead"
      - "le skill lead (la consigne d'approuver une liste)"

cas:
  - id: C1
    titre: Le lead approuve une liste ordonnée de lots une fois
    acteur: le lead
    declencheur: commande orchestrate queue add <projet:lot>…
    preconditions:
      - chaque projet:lot nomme un projet du dossier de lancement et un lot de son plan
    nominal:
      - "La commande lit les clés projet:lot dans l'ordre donné."
      - "Chaque clé est vérifiée : projet connu, lot présent dans son plan, lot ni terminé ni déjà dans la file."
      - "Les clés valides sont ajoutées à la fin de la file approuvée, dans l'ordre."
      - "La commande affiche la file avec la position de chaque lot."
    alternatives:
      - { si: "aucune clé n'est donnée", alors: "refus, rien n'est écrit", regles: [R2] }
      - { si: "une clé est mal formée, un projet ou un lot est inconnu, ou le lot est terminé", alors: "refus de toute la commande nommant la clé, rien n'est ajouté", regles: [R2] }
      - { si: "une clé est déjà dans la file", alors: "elle garde sa position, un avertissement la nomme", regles: [R3] }
    resultat: La file approuvée porte les lots dans l'ordre voulu par le lead.

  - id: C2
    titre: Le lead lit et retire des lots de la file
    acteur: le lead
    declencheur: commande orchestrate queue show, commande orchestrate queue drop <projet:lot>…
    preconditions:
      - aucune
    nominal:
      - "show liste les lots dans l'ordre avec leur état : en attente, tiré par la vague <id>, ou sauté avec sa cause."
      - "drop retire les clés données de la file ; l'ordre des autres ne change pas."
    alternatives:
      - { si: "la file est vide", alors: "show dit « file approuvée vide : approuver des lots avec orchestrate queue add <projet:lot> »", regles: [R4] }
      - { si: "drop nomme une clé absente de la file", alors: "refus nommant la clé", regles: [R4] }
      - { si: "drop nomme un lot déjà tiré", alors: "refus, le lot est déjà dans une vague", regles: [R4] }
    resultat: Le lead voit ce que la file contient et peut l'amender sans la refaire.

  - id: C3
    titre: Une vague vivante tire le lot suivant de la file dès qu'un créneau se libère
    acteur: une vague d'orchestrate en cours (lancée avec des lots donnés, --continue ou --queue)
    declencheur: libération d'un créneau de session (un lot de la vague a fini, est rendu ou posé en question)
    preconditions:
      - la file approuvée contient au moins un lot en attente
      - la vague vit et aucune borne d'arrêt ne joue (stopReason nul)
      - "L421 est livré (--add, dépendance déclarée du lot : R18 ; livré le 06-11, le repli de R18 n'a plus cours)"
    nominal:
      - "Le créneau se libère ; la vague n'attend pas la fin du tour en cours ni le lead. Toute vague vivante tire, quel que soit son lancement, sans option (R11)."
      - "Elle parcourt la file dans l'ordre, avant tout tirage du plan de --continue (R19), et prend le premier lot mûr (R5) : un seul lot par créneau libéré (R20)."
      - "Elle réserve le lot dans la file (R7), puis le pousse par le mécanisme de --add de L421 (R9) dans la vague vivante qui tient son dépôt quand c'est une autre vague ; si c'est la sienne, ou si aucune vague ne tient le dépôt, elle le joue elle-même dans ce créneau (c'est elle la vague vivante qui prend le dépôt ; le lancement d'un second processus de vague pour un dépôt libre n'aurait aucun sens : le créneau est le sien)."
      - "Une fois la poussée acceptée, le lot passe à l'état tiré avec l'id de la vague qui l'a reçu (R13) ; le journal écrit « file : tire <projet:lot> (position n) »."
      - "Aucune écriture dans l'état d'un execute en cours ne passe par un autre chemin que --add (R18)."
    alternatives:
      - { si: "le lot n'est pas mûr (question, after non clos, ressource uses: tenue)", alors: "il est sauté, reste en file à sa place et le journal le dit avec sa cause", regles: [R5, R6] }
      - { si: "aucun lot de la file n'est mûr", alors: "le créneau reste libre, le journal dit « file : aucun lot mûr (n sauté(s)) »", regles: [R6] }
      - { si: "une borne d'arrêt joue (question posée à la vague, deux lots rendus de suite, budget épuisé, --until, quota, --stop-after-current)", alors: "rien n'est tiré", regles: [R8] }
      - { si: "le budget du lot dépasse le budget restant", alors: "lot sauté et dit, il reste en file", regles: [R8] }
      - { si: "le dépôt du lot est tenu par une autre vague vivante", alors: "le lot est poussé dans cette vague par --add ; si --add le refuse, la réservation est rendue (en attente), le lot est sauté et le journal dit « file : --add refusé — <projet:lot> : <message de --add> »", regles: [R9, R7] }
      - { si: "aucune vague ne tient le dépôt du lot", alors: "la vague le joue elle-même dans son créneau libre (elle devient la vague vivante qui tient ce dépôt) ; si sa prise est refusée (verrou, garde de push), la réservation est rendue et la cause dite", regles: [R9, R7] }
      - { si: "le créneau est celui d'un tour (premier tirage de --queue ou --continue, tirage entre deux tours) et le dépôt est tenu par une autre vague vivante", alors: "le tour ne pousse pas : le lot est sauté et dit « file : lot sauté — <projet:lot> : dépôt tenu par la vague <id> », reste en file ; cette vague le tire à son prochain créneau libre, ou une vague vivante l'y pousse par --add à l'un des siens", regles: [R9, R18] }
      - { si: "la vague receveuse écarte ensuite la demande poussée (arrêt demandé, budget épuisé, limite d'usage, lot fini entre-temps, vague qui a fini de jouer, verrou refusé)", alors: "elle rend le lot à la file (en attente) et son journal dit « file : <projet:lot> rendu à la file (ajout écarté) » ; la demande porte l'origine du lot (file et dossier) dans sa file d'ajouts pour cela", regles: [R7, R9] }
      - { si: "la vague qui tient le dépôt n'a plus de créneau libre (ses voies occupées atteignent son plafond, registre waves/<pid>.json), ou que cette vague y a déjà poussé autant de lots qu'elle avait de créneaux libres", alors: "le lot est sauté « dépôt tenu par la vague <id>, sans créneau libre » et reste en file ; au plus un lot poussé ou pris par créneau libre à chaque regard", regles: [R20, R9] }
      - { si: "--add a déjà été refusé par cette vague pour ce lot", alors: "la poussée n'est pas rejouée tant que la même vague tient le dépôt (une poussée relit le contrôle préalable) ; la vague qui tient le dépôt tire le lot elle-même à son prochain créneau", regles: [R9] }
      - { si: "le contrôle préalable refuse le lot pour lui-même", alors: "le lot est exclu de cette vague, reste en file et la cause est dite", regles: [R10] }
      - { si: "le plafond de sessions (vagues et holds du lead compris) est atteint", alors: "aucun créneau n'est libre, rien n'est tiré", regles: [R8] }
      - { si: "le réglage orchestrate.continue (exclude, maxEstimate) ou le marqueur « non tirable » écarte le lot", alors: "il est sauté et dit « écarté du tirage : <cause> », reste en file", regles: [R12] }
      - { si: "un lot a changé d'état depuis l'approbation (terminé ailleurs, en cours à la main, supprimé du plan, projet ou dossier disparu, plan illisible)", alors: "il est sauté avec sa cause (« déjà terminé », « déjà en cours », « introuvable », « plan illisible ») dans le journal et dans show, et reste en file jusqu'à drop", regles: [R15] }
      - { si: "queue.json est corrompu ou le verrou d'écriture reste tenu au-delà du délai", alors: "rien n'est tiré, un avertissement est écrit, le fichier n'est ni réécrit ni supprimé", regles: [R16] }
      - { si: "une réservation appartient à une vague qui n'est plus vivante (kill -9, crash machine)", alors: "elle est lue comme en attente et le lot est de nouveau tirable", regles: [R14] }
    resultat: Le créneau libre est occupé par le lot suivant approuvé, sans passage par le lead.

  - id: C4
    titre: Une vague neuve démarre depuis la file
    acteur: le lead (ou une vague qui lance une vague neuve par C3)
    declencheur: commande orchestrate --queue
    preconditions:
      - la file approuvée contient au moins un lot en attente
      - aucune vague ne vit dans le dépôt des lots (sinon voir l'alternative)
    nominal:
      - "La vague démarre sans liste de lots donnée à la main ; --queue n'est que ce démarrage, la vague tire ensuite comme toute vague vivante (C3, R11)."
      - "Au démarrage elle tire, dans l'ordre (R5), au plus un lot par créneau libre et un par dépôt par tour comme le tirage existant (src/orchestrate/command.ts:919-921) ; les autres lots d'un même dépôt sont tirés aux créneaux suivants (C3)."
    alternatives:
      - { si: "la file est vide ou sans lot mûr", alors: "refus de démarrer, la vague nomme les lots sautés et leurs causes", regles: [R6, R11] }
      - { si: "une vague vit déjà dans le dépôt du lot", alors: "le lot n'est pas joué par la vague neuve : sauté « dépôt tenu par la vague <id> » (un premier tirage ne pousse pas, R9) ; sans autre lot mûr la commande refuse de démarrer et n'écrit rien dans l'état de cette vague, qui tire le lot à son prochain créneau libre", regles: [R9, R18] }
      - { si: "des lots sont donnés à la main avec --queue", alors: "ils passent d'abord, la file complète les créneaux restants", regles: [R11] }
    resultat: Une vague démarre sur la file sans que le lead choisisse les lots un à un.

  - id: C5
    titre: Deux vagues vivantes se disputent le même lot de la file
    acteur: deux vagues d'orchestrate
    declencheur: deux créneaux libérés au même instant
    preconditions:
      - le même lot est le premier mûr de la file pour les deux vagues
    nominal:
      - "La première vague réserve le lot de façon atomique."
      - "La seconde voit la réservation, passe au lot mûr suivant."
    alternatives: []
    sans_alternative: "la réservation atomique est la seule branche ; la perte de la course n'est pas une erreur, c'est le cas nominal de la seconde vague (R7)"
    resultat: Un lot n'est tiré qu'une fois.

regles:
  - id: R1
    cas: [C1]
    enonce: "La file approuvée est une liste ordonnée de clés projet:lot ; l'ordre d'ajout est l'ordre de tirage et reste celui du lead."
    statut: sourcee
    source: "demande du lot : « le lead approuve une liste ordonnée de lots (projet:lot) une fois »"
    tests: ["R1 — trois lots ajoutés dans l'ordre B, A, C : la file les rend B, A, C"]
  - id: R2
    cas: [C1]
    enonce: "queue add refuse en bloc, sans rien écrire, une liste vide ou une clé mal formée, de projet inconnu, de lot inconnu ou de lot terminé, en nommant la clé fautive."
    statut: hypothese
    si_faux: "Si une liste partiellement valide doit être acceptée, seul le refus en bloc devient un ajout des clés valides avec avertissement ; aucune donnée en jeu."
    tests: ["R2 — même clé deux fois dans une commande (add A A) : une seule occurrence, avertissement, rien de dupliqué", "R2 — clé de lot inconnu : refus nommant la clé, file inchangée", "R2 — liste vide : refus, file inchangée"]
  - id: R3
    cas: [C1]
    enonce: "Une clé déjà présente en file garde sa position (pas de doublon) et l'ajout l'avertit ; deux clés qui nomment le même lot (a:L1 et ./a:L1) sont la même clé, l'avertissement nomme celle qui est en file, et drop retire le lot par l'une ou l'autre."
    statut: hypothese
    si_faux: "Si le lead veut déplacer un lot en le réajoutant, il devra le retirer (drop) puis l'ajouter ; aucune donnée perdue."
    tests: ["R3 — clé déjà en file : une seule occurrence, position inchangée, avertissement"]
  - id: R4
    cas: [C2]
    enonce: "show dit l'état de chaque lot (en attente, tiré par la vague, sauté et sa cause) et, pour une file vide, comment la remplir ; drop refuse une clé absente ou déjà tirée en la nommant."
    statut: hypothese
    si_faux: "Seuls les libellés et le niveau de détail de show changent ; drop sur une clé absente pourrait devenir silencieux."
    tests: ["R4 — file vide : show dit comment approuver des lots", "R4 — drop d'une clé absente : refus nommant la clé", "R4 — drop d'un lot déjà tiré : refus, file inchangée"]
  - id: R5
    cas: [C3, C4]
    enonce: "Un lot de la file est mûr quand il est prêt au sens du tirage existant (à faire, after levé, ni récurrent ni en cours), qu'aucune question ne l'attend (« à décider », src/orchestrate/continue.ts:53 ; ou question posée) et qu'aucune de ses ressources uses: n'est tenue (src/ready-free.ts:101). La vague prend le premier lot mûr dans l'ordre de la file, pas le premier de la file."
    statut: sourcee
    source: "demande du lot : « un lot non mûr (question, after non clos, uses tenu) est sauté » ; critères repris de src/orchestrate/continue.ts:53 et src/ready-free.ts:101"
    tests: ["R5 — premier lot de la file avec after non clos : le deuxième est tiré", "R5 — lot « à décider » : sauté", "R5 — lot dont uses: est tenu par un lot doing : sauté", "R5 — tous les lots mûrs : le premier de la file est tiré"]
  - id: R6
    cas: [C3, C4]
    enonce: "Un lot sauté reste en file à sa place (il sera retenté au créneau suivant) et le journal le dit, une fois par vague et par cause (une cause identique au créneau suivant de la même vague n'est pas répétée ; une cause qui change est écrite, et si elle revient ensuite elle est de nouveau écrite), au format « file : lot sauté — <projet:lot> : <cause> » avec la cause « question posée », « after non clos (<lot>) » ou « ressource tenue (<nom>) »."
    statut: sourcee
    source: "demande du lot : « sauté et dit » ; format calqué sur « continue : lot sauté — » de src/orchestrate/command.ts:1034"
    tests: ["R6 — after non clos : journal « file : lot sauté — p:L2 : after non clos (L1) » et lot toujours en file", "R6 — même cause sur deux créneaux de la même vague : une seule ligne", "R6 — cause qui change puis revient dans la même vague : trois lignes", "R6 — même cause dans une autre vague : une ligne par vague", "R6 — aucun lot mûr : le créneau reste libre et le journal le dit"]
  - id: R7
    cas: [C3, C5]
    enonce: "Le tirage réserve le lot dans queue.json (~/.cadence/orchestrate, à côté des créneaux) de façon atomique avant de le lancer : un lot de la file n'est tiré que par une seule vague, une seule fois, et l'ordre est réservé, puis poussé par --add (R9), puis tiré (état tiré avec l'id de la vague qui l'a reçu) ; un --add refusé, un lancement refusé, une vague qui échoue ou est interrompue entre la réservation et le tiré rend le lot à la file (en attente), et une vague receveuse qui écarte la demande poussée (arrêt, budget, limite d'usage, lot fini, fin de vague) le rend de même ; la réservation porte l'id et le pid de la vague qui tire (R14)."
    statut: hypothese
    si_faux: "Sans réservation atomique, deux vagues joueraient le même lot (double travail, deux branches) ; c'est le seul risque, corrigé par un verrou de plus."
    tests: ["R7 — deux tirages simultanés du même lot : un seul le prend", "R7 — vague interrompue avant le lancement : le lot revient en file", "R7 — --add refusé après réservation : lot en attente, sauté et dit", "R7 — --add accepté : état tiré avec l'id de la vague receveuse, jamais tiré avant l'acceptation", "R7 — lot poussé puis écarté par la vague receveuse : rendu à la file, drop l'accepte"]
  - id: R8
    cas: [C3]
    enonce: "Le tirage de la file respecte les bornes de la vague : stopReason (src/orchestrate/continue.ts, question posée, deux lots rendus de suite, --until, quota, --stop-after-current, budget épuisé), le plafond de sessions qui compte les holds du lead, et le budget restant (un lot qui n'y tient pas est sauté et dit, comme src/orchestrate/command.ts:920)."
    statut: sourcee
    source: "bornes déjà codées : src/orchestrate/continue.ts (stopReason) et src/orchestrate/command.ts:1019-1028 ; plafond avec holds : lot L424"
    tests: ["R8 — vague en question : la file n'est pas tirée", "R8 — --stop-after-current : rien n'est tiré à la libération du créneau", "R8 — budget restant inférieur à celui du lot : lot sauté et dit, reste en file", "R8 — plafond atteint avec un hold du lead : aucun tirage"]
  - id: R9
    cas: [C3, C4]
    enonce: "Le tirage s'appuie sur L421 : dès qu'un créneau se libère dans une vague vivante, la file pousse le lot suivant dans la vague vivante qui tient son dépôt quand c'est une autre vague (registre waves/<pid>.json, liveWaves src/orchestrate/registry.ts) par le mécanisme de --add (addToLive, src/orchestrate/ajout.ts : même contrôle préalable, même file d'ajouts adds.log) ; si le dépôt est le sien ou qu'aucune vague ne le tient, la vague joue le lot elle-même dans ce créneau. Une poussée refusée laisse le lot en file, sauté et dit avec le message de --add (R7), et n'est pas rejouée tant que la même vague tient le dépôt. Un tirage de tour (premier tirage, entre deux tours) ne pousse pas : le lot est sauté « dépôt tenu par la vague <id> »."
    statut: sourcee
    source: "arbitrage du lead (01-11) : « le tirage s'appuie sur L421 (--add) : la file pousse le lot suivant dans la vague vivante qui tient son dépôt par le mécanisme de --add, ou lance une vague neuve si aucune ne le tient » ; refus existant src/orchestrate/command.ts:418 évité par la poussée"
    tests: ["R9 — dépôt tenu par une autre vague vivante : le lot est poussé par --add dans cette vague (sa file d'ajouts), « tiré par » elle, rien d'autre n'est écrit chez elle", "R9 — dépôt tenu par la vague elle-même ou par personne : le lot est joué par la vague dans son créneau", "R9 — --add refusé : lot en attente et sauté avec le message de --add, une fois", "R9 — orchestrate --queue dans un dépôt tenu par une autre vague : refus qui nomme la vague, rien d'écrit chez elle"]
  - id: R10
    cas: [C3]
    enonce: "Un refus du contrôle préalable propre au lot l'exclut de la vague mais le laisse en file, avec sa cause dite ; un refus du dépôt (arbre sale, orchestration en cours) ne l'exclut que pour ce tirage."
    statut: sourcee
    source: "tirage existant src/orchestrate/command.ts:941-943 (refus propre au lot exclu pour la vague, refus de dépôt passager)"
    tests: ["R10 — refus propre au lot : non retiré de la file, non retenté par cette vague", "R10 — arbre sale : retenté au créneau suivant"]
  - id: R11
    cas: [C3, C4]
    enonce: "Toute vague vivante tire de la file, sans option : qu'elle ait été lancée avec des lots donnés, avec --continue ou avec --queue ; --no-fill (L587) écarte le plan du remplissage des créneaux libres, pas la file. --queue est le démarrage d'une vague sur la file sans lot donné : sans lot mûr il refuse de démarrer en listant les lots sautés et leurs causes ; avec des lots donnés à la main, ceux-ci passent avant et la file complète les créneaux restants."
    statut: sourcee
    source: "arbitrage du lead (01-11) : « toute vague vivante tire de la file (lancée avec des lots donnés, --continue ou --queue) »"
    tests: ["R11 — vague lancée avec des lots donnés : un créneau libéré tire le lot de la file", "R11 — vague lancée avec --continue : un créneau libéré tire le lot de la file", "R11 — vague lancée avec --queue : un créneau libéré tire le lot de la file", "R11 — file sans lot mûr : orchestrate --queue refuse en listant les causes", "R11 — lots donnés et --queue : les lots donnés d'abord"]
  - id: R12
    cas: [C3, C4]
    enonce: "Le tirage de la file respecte le réglage orchestrate.continue (exclude, maxEstimate) et le marqueur « non tirable » : un lot approuvé qu'ils écartent est sauté, reste en file et le journal dit « écarté du tirage : <cause> » (listé dans continue.exclude, marqué « non tirable », estimate > continue.maxEstimate). Lever ces garde-fous pour un lot approuvé serait une option, que ce lot ne livre pas."
    statut: sourcee
    source: "src/orchestrate/continue.ts:64-66 (nonDrawable : « jamais tiré par --continue (L390) » ; drawFilter : exclude, non tirable, maxEstimate) ; garde-fous posés par le lead sur ses lots"
    tests: ["R12 — lot approuvé listé dans continue.exclude : sauté « écarté du tirage : listé dans continue.exclude », reste en file", "R12 — lot approuvé dont l'estimation dépasse continue.maxEstimate : sauté et dit", "R12 — lot approuvé marqué « non tirable » : sauté et dit"]
  - id: R13
    cas: [C2, C3]
    enonce: "Un lot tiré de la file reste en file à l'état tiré avec l'id de la vague qui l'a reçu : show l'affiche « tiré par la vague <id> », drop le refuse (« déjà tiré ») et le tirage ne le reprend pas ; il n'est jamais retiré par le tirage."
    statut: sourcee
    source: "demande du lot : « R13 aligné sur l'état tiré » ; D1 (états en attente, réservé, tiré)"
    tests: ["R13 — lot tiré : état tiré avec l'id de la vague, non retiré de la file", "R13 — lot tiré : show affiche « tiré par la vague <id> »", "R13 — lot tiré : jamais tiré une seconde fois"]
  - id: R14
    cas: [C3, C5]
    enonce: "Une réservation de queue.json dont la vague n'est plus dans le registre des vagues vivantes (waves/<pid>.json absent ou pid mort, liveWaves de src/orchestrate/registry.ts:51) est lue comme « en attente » ; le lot redevient tirable et drop l'accepte ; le journal de la vague qui le tire dit « file : réservation orpheline reprise — <projet:lot> (vague <id>) »."
    statut: hypothese
    si_faux: "Si une vague tuée a pu laisser son lot à moitié joué, la reprise le rejoue depuis son état (le contrôle de R5 refuse un lot déjà en cours) ; seuls le libellé ou le délai de reprise changent."
    tests: ["R14 — vague tuée après réservation (pid mort) : le lot est de nouveau tiré", "R14 — réservation d'une vague vivante : lot non tiré par une autre", "R14 — drop d'une réservation orpheline : accepté"]
  - id: R15
    cas: [C3, C2]
    enonce: "Un lot de la file dont l'état a changé depuis l'approbation est sauté avec une cause dite, au format de R6, dans le journal et dans show : « déjà terminé », « déjà en cours », « introuvable » (lot supprimé du plan, projet ou dossier disparu) ou « plan illisible » ; il reste en file jusqu'à un drop du lead, qui seul le retire."
    statut: hypothese
    si_faux: "Si un lot terminé doit sortir seul de la file, le tirage le retire en le disant ; la file perd une entrée sans le lead, aucune donnée de plan en jeu."
    tests: ["R15 — lot terminé par un autre chemin : sauté « déjà terminé », show le dit, reste en file", "R15 — lot supprimé du plan : sauté « introuvable »", "R15 — plan illisible : sauté « plan illisible », les autres lots sont tirés"]
  - id: R16
    cas: [C1, C2, C3]
    enonce: "Un queue.json illisible (JSON invalide) n'est jamais réécrit ni supprimé : add et drop refusent, show et le tirage le disent et ne tirent rien ; un verrou d'écriture tenu au-delà de 10 secondes fait refuser add et drop et sauter le tirage de ce créneau, avec avertissement. Un queue.json absent se lit comme une file vide."
    statut: hypothese
    si_faux: "Si une file corrompue doit être reconstruite, le fichier serait remplacé après sauvegarde ; le délai de 10 s est un réglage sans donnée."
    tests: ["R16 — queue.json corrompu : add refusé, fichier inchangé octet pour octet", "R16 — queue.json corrompu : le tirage ne tire rien et avertit", "R16 — verrou tenu au-delà du délai : add refusé", "R16 — queue.json absent : show dit file vide"]
  - id: R17
    cas: [C1, C2]
    enonce: "queue est un mot réservé quand c'est le premier jeton positionnel de orchestrate : il est aiguillé vers la sous-commande add|show|drop avant l'analyse des lots (src/orchestrate/command.ts:268-271) ; un lot d'un projet nommé queue se donne sous la forme queue:<lot> (la clé contient « : »), jamais le mot seul ; un sous-mot inconnu est refusé."
    statut: hypothese
    si_faux: "Si un projet nommé queue existe et doit rester lançable par son seul nom, la sous-commande passe en option (--queue-add) ; aucune donnée en jeu."
    tests: ["R17 — orchestrate queue show : aiguillé vers la file, pas lu comme un lot", "R17 — orchestrate queue:L1 : lu comme le lot L1 du projet queue", "R17 — orchestrate queue frobnicate : refus du sous-mot inconnu"]
  - id: R18
    cas: [C3, C4]
    enonce: "Dépendance déclarée : le lot dépend de L421 (--add, livré le 06-11 : addToLive dans src/orchestrate/ajout.ts). Jamais d'injection dans un execute en cours par un autre chemin que --add : la file n'écrit dans l'état d'une autre vague que par sa file d'ajouts (adds.log), ce que --add écrit ; le registre, wave.json et les états de lots de cette vague ne sont pas touchés. Le tirage interne d'une vague (ses propres créneaux) n'est pas une injection. Le repli « --add indisponible » prévu tant que L421 n'était pas livré n'a plus cours."
    statut: sourcee
    source: "arbitrage du lead (01-11) : « jamais d'injection dans un execute en cours par un autre chemin » ; L421 .cadence/raf.yaml:268-275 (doing)"
    tests: ["R18 — poussée dans une vague : seul le chemin --add écrit chez elle (adds.log), son registre et ses lots sont inchangés", "R18 — dépôt libre : la vague joue le lot elle-même"]
  - id: R19
    cas: [C3, C4]
    enonce: "La file passe avant le tirage du plan, à chaque moment où le plan est tiré : premier tirage (--queue, --continue sans lot), remplissage d'un créneau libre en cours de vague (L527, L587) et tirage entre deux tours de --continue ; à un créneau libéré, la vague tente d'abord la file, le plan ne reçoit que les créneaux que la file laisse, et un lot qui attend dans la file n'est jamais tiré comme lot du plan."
    statut: sourcee
    source: "arbitrage du lead (01-11) : « la file passe AVANT le tirage du plan de --continue » ; tirage du plan src/orchestrate/command.ts:919-921"
    tests: ["R19 — --continue avec un lot mûr en file et un lot prêt au plan : le lot de la file est tiré", "R19 — file sans lot mûr : le plan de --continue est tiré"]
  - id: R20
    cas: [C3, C4]
    enonce: "Un seul lot de la file est tiré par créneau libéré ; deux créneaux libérés tirent deux lots, un chacun. Un lot poussé par --add tient un créneau de la vague qui le pousse tant que la receveuse ne l'a pas pris (ses voies au registre inchangées) ni rendu — le plan ne remplit pas ce créneau —, et une vague ne pousse pas plus de lots dans une autre que celle-ci n'a de créneaux libres tant qu'elle ne les a pas pris."
    statut: sourcee
    source: "arbitrage du lead (01-11) : « un lot à la fois par créneau libéré »"
    tests: ["R20 — un créneau libéré, trois lots mûrs : un seul tiré", "R20 — deux créneaux libérés : deux lots tirés, un par créneau", "R20 — créneau libre d'une vague vivante, receveuse à deux voies libres, trois lots en file : deux poussés, le troisième attend"]

contrats:
  - id: A1
    appel: commande orchestrate queue add
    entree: "une ou plusieurs clés <projet:lot>, dans l'ordre"
    sortie: "la file approuvée : une ligne « <position>. <projet:lot> — <titre> » par lot (code de sortie 0) ; chaque erreur « log error » écrit son message sur la sortie d'erreur et termine avec le code de sortie 1 (RafError, src/orchestrate/command.ts:767)"
    erreurs:
      - { code: log error, message: "queue add : aucun lot donné (attendu : <projet:lot>…)" }
      - { code: log error, message: "queue add : <clé> : lot ou projet inconnu" }
      - { code: log error, message: "queue add : <clé> : lot déjà terminé" }
      - { code: log error, message: "queue : file illisible (<chemin>) : corriger ou supprimer le fichier à la main" }
      - { code: log error, message: "queue : file verrouillée depuis plus de 10 s : réessayer" }
      - { code: log warn, message: "queue add : <clé> : déjà en file (position <n>)" }
    regles: [R1, R2, R3, R16, R17]
  - id: A2
    appel: commande orchestrate queue show
    entree: aucune
    sortie: "la file avec l'état de chaque lot ; si elle est vide « file approuvée vide : approuver des lots avec orchestrate queue add <projet:lot> »"
    erreurs:
      - { code: log error, message: "queue : file illisible (<chemin>) : corriger ou supprimer le fichier à la main" }
    regles: [R4, R14, R15, R16, R17]
  - id: A3
    appel: commande orchestrate queue drop
    entree: "une ou plusieurs clés <projet:lot>"
    sortie: "la file restante (code de sortie 0) ; chaque erreur « log error » écrit son message sur la sortie d'erreur et termine avec le code de sortie 1 (RafError, src/orchestrate/command.ts:767)"
    erreurs:
      - { code: log error, message: "queue drop : <clé> : absent de la file" }
      - { code: log error, message: "queue drop : <clé> : déjà tiré par la vague <id>" }
      - { code: log error, message: "queue : file illisible (<chemin>) : corriger ou supprimer le fichier à la main" }
      - { code: log error, message: "queue : file verrouillée depuis plus de 10 s : réessayer" }
    regles: [R4, R14, R16, R17]
  - id: A4
    appel: commande orchestrate --queue
    entree: "option --queue, éventuellement des lots donnés, --max-sessions, --until ; le tirage de la file à chaque créneau libéré vaut aussi pour toute vague vivante (lots donnés, --continue), sans option, et pousse par --add (L421)"
    sortie: "une vague qui joue les lots mûrs de la file et en tire un à chaque créneau libéré ; journal « file : tire <projet:lot> (position <n>) »"
    erreurs:
      - { code: log info, message: "file : lot sauté — <projet:lot> : <cause>" }
      - { code: log info, message: "file : aucun lot mûr (<n> sauté(s))" }
      - { code: log info, message: "file : lot sauté — <projet:lot> : écarté du tirage : <cause>" }
      - { code: log info, message: "file : --add refusé — <projet:lot> : <message de --add>" }
      - { code: log info, message: "file : tire <projet:lot> (position <n>) — poussé par --add dans la vague <id>" }
      - { code: log info, message: "file : lot sauté — <projet:lot> : dépôt tenu par la vague <id>" }
      - { code: log info, message: "file : lot sauté — <projet:lot> : dépôt tenu par la vague <id>, sans créneau libre" }
      - { code: log info, message: "file : <projet:lot> rendu à la file (ajout écarté)" }
      - { code: log info, message: "file : aucun créneau libre pour la file (plafond <n> : <v> vague(s) vivante(s), <h> session(s) du lead)" }
      - { code: log warn, message: "file : réservation orpheline reprise — <projet:lot> (vague <id>)" }
      - { code: log warn, message: "file : illisible ou verrouillée, rien n'est tiré à ce créneau" }
      - { code: log error, message: "orchestrate --queue : aucun lot mûr dans la file approuvée" }
    regles: [R5, R6, R7, R8, R9, R10, R11, R12, R13, R14, R15, R16, R18, R19, R20]

donnees:
  - { id: D1, objet: "queue.json dans l'état commun (CADENCE_HOME, par défaut ~/.cadence/orchestrate/queue.json), à côté de slots/ et waves/ : liste ordonnée de { clé projet:lot, état (en attente, réservé, tiré : conservé en file), vague } ; écrite par renommage atomique sous verrou, éditée par la commande orchestrate queue, ni commit ni écriture dans les plans", existant: false, modification: ajout, note: "nouveau fichier partagé entre vagues vivantes ; réservation = état réservé + id et pid de la vague (R7, R14) ; ne touche aucun format existant ; décision du lead : option (a), état commun à côté du registre des créneaux" }
  - { id: D2, objet: "état de vague (lots, journal, file d'ajouts adds.log) et registre des vagues vivantes (waves/<pid>.json)", existant: true, modification: aucune, note: "lus pour savoir ce qui est tenu ; dans une autre vague, le lot tiré n'entre que par sa file d'ajouts adds.log, ce que --add écrit (L421, R18) ; la file n'écrit rien d'autre chez elle" }
  - { id: D3, objet: "plan du projet (after, uses, notes « à décider »)", existant: true, modification: aucune, note: "lu seulement pour juger la maturité" }
