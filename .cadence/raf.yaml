    started: 2026-10-28
    notes:
      - { date: 2026-10-28, text: "Revue de la fiche — mineur : docs/specs/panneau-lots/fiche.yaml:153 — R12 / A2 : la surveillance des dates de modification des plans suppose un accès fichier côté mod. Dans plugins/cadence-hud, seul collect.ts (script Python lancé via `$.process.run`) fait un `os.stat`. La fiche ne dit pas par quel moyen, ni si le coût d'un `stat` toutes les 5 s est acceptable. De plus, `Pane` n'est cité nulle part dans plugins/cadence-hud (grep vide) : l'API du panneau est supposée par la fiche et à vérifier avec la skill plugin-authoring." }
      - { date: 2026-10-28, text: "Revue de la fiche — mineur : docs/specs/panneau-lots/fiche.yaml:123 — R7 : la ligne d'erreur synthétique `cadence.yaml` produite par leadTour (src/lead.ts:~181, `problems`) est aussi un « projet » en erreur. La règle ne dit pas comment elle s'affiche. Par ailleurs les statuts « sourcee » de R6 et R7 mêlent des éléments hypothétiques (repli étroit, préfixe « illisible : »), mentionnés dans la source mais sans `si_faux` propre." }
      - { date: 2026-10-28, text: "Revue de la fiche — mineur : docs/specs/panneau-lots/fiche.yaml:111 — Pas de limite pour un volume important (nombreux projets ou lots, titres très longs aux 1440 px) ni pour un `after:` dont l'id est inconnu ou clos. L'affichage de ces liens (tels quels ou barrés) n'est pas précisé. R6 ne teste qu'un id ouvert." }
      - { date: 2026-10-28, text: "Revue de la fiche — mineur : docs/specs/panneau-lots/fiche.yaml:110 — R5 : « todo sans after: ouvert → ○ libre » cite nextUp (src/audit.ts:392-399) comme source, mais nextUp classe aussi en « bloqué » un todo dont la `gate` n'est pas remplie (`gateProgress(...).met`). Un lot en attente d'une condition de tirage serait donc affiché « libre » alors que `raf now` et le tour (`waiting`) le disent en attente. Écart non dit ; pas de donnée en jeu." }
      - { date: 2026-10-28, text: "Revue de la fiche — mineur : docs/specs/panneau-lots/fiche.yaml:172 — R14 : la condition « les lignes du tour n'ont pas de champ lots » ne précise pas le cas mixte. Les lignes en erreur (R7) n'ont jamais de `lots`, et un projet sans lot non clos peut porter `lots: []` ou l'omettre. Écrire que la règle vaut quand aucune ligne sans `error` ne porte `lots`, sinon un projet en erreur seul déclenche « cadence trop ancien »." }
      - { date: 2026-10-28, text: "Revue de la fiche — mineur : docs/specs/panneau-lots/fiche.yaml:188 — R16 : la nouvelle réponse « argument inconnu … (attendu : cmd, projets, lots) » remplace un texte asserté par plugins/cadence-hud/tests/hud.test.tsx:988-993 et décrit dans plugins/cadence-hud/README.md:99. La fiche ne mentionne ni la mise à jour de ce test existant ni celle du README. Le test et la doc seraient périmés si on les oubliait." }
      - { date: 2026-10-28, text: "Revue de la fiche — mineur : docs/specs/panneau-lots/fiche.yaml:166 — R13 dit que « sans cadence sur le PATH, le panneau n'invente rien », en citant docs/cadence-hud.md. R3 dit qu'il affiche une erreur dans ce même cas. Les deux sont compatibles, mais R13 reprend la règle de la bande, qui ne dessine rien (register.tsx:~160, `catch` silencieux), alors que le panneau écrit un message. Préciser dans R13 que « n'invente rien » veut dire « aucun lot affiché », afin qu'un test ne vérifie pas l'absence de tout texte." }
      - { date: 2026-10-28, text: "Revue de la fiche — mineur : docs/specs/panneau-lots/fiche.yaml:150 — R10 : l'id d'une sous-tâche est dit « <lot>/<n> (celui de Task.id) ». Or Task.id est le seul <n> (src/plan.ts:46-50, parseur l.1164 `id: String(t.id)`, et `${l.id}/${t.id}` l.440 et l.832 pour composer l'id). Le composé est construit, pas lu. Un test écrit d'après « celui de Task.id » pourrait attendre « 1 » au lieu de « L401/1 ». Écrire « id composé `${lot.id}/${task.id}` »." }
      - { date: 2026-10-28, text: "Revue de la fiche — mineur : docs/specs/panneau-lots/fiche.yaml:150 — R10 : « plan natif » vs « plan tenu par un autre outil » n'a pas de critère. Dans un plan tenu par un autre outil, le parseur replie déjà en `tasks` les sous-lots dont l'id est `<parent>/…` et dont `parent:` est un lot de premier niveau (src/plan.ts:1073-1079) ; ils sortent alors de plan.lots() et n'arriveraient dans `lots` par aucune des deux voies si la règle se limite à Lot.parent pour ce plan. Dire que les tasks sont émises quel que soit le plan (le repli étant fait par le parseur), ou fixer le critère, avec un test sur ce cas." }
