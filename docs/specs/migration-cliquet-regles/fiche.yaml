sujet:
  id: migration-cliquet-regles
  titre: Contrat de --migrer et de la porte du cliquet de qualité (correction, découpage, déplacement, migrations successives)
  lot: L477
  perimetre:
    modules: [scripts/qualite.mjs, scripts/qualite.d.mts, src/orchestrate/integrate.ts, docs/qualite.md, test/qualite-l462.test.ts]
    endpoints: []
    jobs: ["étape d'intégration de orchestrate (resolveBaseline et settleBaseline, qui appellent comparerMigration)"]
    hors_perimetre:
      - "le calcul de la mesure (ESLint, knip, jscpd, directives) et le format de qualite-baseline.json : inchangés"
      - "la garde de configuration (configChangee), le retard de origine/main, --init : inchangés"
      - "la résolution des conflits de base à l'intégration (fiche base-cliquet-integration, L538) : seul son contrôle par comparerMigration est touché (R13) ; docs/qualite.md (« Moving or splitting a file ») est mis à jour pour le lien de contenu, et les tests « R10 — … » de test/qualite-l462.test.ts:222-256 (cartes synthétiques sans contenu, qui attendent qu'un chemin neuf parte libre) sont réécrits dans test/qualite-l477.test.ts avec des contenus liés, leurs ids ne sont pas repris"

cas:
  - id: C1
    titre: Un fichier trop gros est découpé en morceaux et la base est migrée
    acteur: une session de lot (ou le lead)
    declencheur: commande node scripts/qualite.mjs --migrer --contre main
    preconditions:
      - la base du lot existe et la porte vient de l'accepter (elle ne dépasse pas celle du départ du lot)
      - un fichier du départ du lot a été coupé en plusieurs fichiers neufs, ou renommé, ou une de ses fonctions a été déplacée dans un fichier neuf (suivi par git ou non, le contenu est lu dans l'arbre de travail)
    nominal:
      - La commande mesure le code, puis lit la base du lot et la base du point de départ (merge-base avec la référence) ; si celle-ci n'existait pas au départ, elle refuse tout de suite (R17).
      - Elle vérifie qu'aucune clé d'un fichier qui existait au départ ne monte au-dessus de la base du lot et que le total de chaque mesure ne monte pas.
      - "Elle relie chaque fichier neuf qui porte un chiffre à sa source par le lien de contenu (R6, R14) : au moins 50 % de ses lignes non vides figuraient dans la source au départ (git show) et ont quitté la source aujourd'hui (R18)."
      - Pour chaque source et chaque outil-règle, elle somme les mesures des fichiers neufs liés et la compare à ce que la source a perdu depuis le départ ; un fichier neuf sans source n'a aucun crédit (R3, R4, R5).
      - Toutes les sommes sont au plus égales à la perte, elle réécrit la base avec la mesure et répond « migrée » en code 0.
    alternatives:
      - { si: un fichier existant monte sur une clé, ou un total monte, alors: refus code 1, base intacte, regles: [R2, R9, R12] }
      - { si: un défaut neuf est ajouté dans un fichier neuf et payé par une correction ailleurs (aucune source liée), alors: refus code 1 de ce fichier neuf, avec un message qui nomme le fichier neuf et « aucune source » ou la source la plus proche, base intacte, regles: [R3, R6, R12, R15] }
      - { si: un fichier est coupé en deux (cli.ts 1000 → 350 plus cli-plan.ts 650 dont les lignes viennent de cli.ts), alors: la perte de cli.ts (650) crédite cli-plan.ts, accepté, regles: [R3, R4, R6] }
      - { si: le fichier neuf réécrit le code au lieu de le couper (moins de 50 % de ses lignes figuraient dans une source du départ et en sont parties), alors: pas de lien, il paie son défaut et est refusé, regles: [R6, R14] }
      - { si: un vrai morceau et un fichier neuf compensé par un gain ailleurs sont présentés ensemble, alors: la somme des morceaux liés à la source dépasse sa perte ou le fichier neuf n'a pas de lien, refusés, regles: [R3, R12] }
      - { si: le fichier source est renommé sans rien perdre (morceau égal à la perte), alors: accepté, un renommage n'ajoute aucun défaut, regles: [R4] }
      - { si: une fonction est déplacée vers un fichier neuf (même petit) et la source garde un défaut de la règle, alors: acceptée si au moins 50 % des lignes du fichier neuf figuraient dans la source et en sont parties, et si la somme liée est au plus la perte de la source, regles: [R4, R5, R14, R18] }
      - { si: un fichier neuf a une mesure à 0, alors: ignoré, regles: [R7] }
      - { si: la commande est lancée sans --contre, alors: sortie 2, rien n'est écrit, regles: [R8] }
      - { si: qualite-baseline.json n'existait pas au point de départ (lot qui amorce la base avec --init), alors: refus code 1 avec un message qui le dit, aucun crédit, base intacte, pas de plantage, regles: [R17] }
      - { si: le fichier neuf copie la source sans que la source perde ces lignes (copie qui laisse la source intacte), alors: aucun lien, il paie son défaut et est refusé, regles: [R18, R15] }
      - { si: git ne rend pas le contenu d'un fichier du départ (clone superficiel, référence absente, git absent, délai dépassé), alors: sortie 2, rien n'est écrit, aucun fichier neuf n'est refusé à tort, regles: [R16] }
      - { si: un second --migrer suit un premier (avec ou sans --ecrire entre les deux), alors: le crédit est recalculé depuis le départ sur la mesure courante, les morceaux déjà acceptés passent encore et ne consomment rien de plus, regles: [R9, R10] }
    resultat: La base porte les fichiers neufs sans qu'un défaut neuf ait été admis.
  - id: C2
    titre: Un lot corrige un fichier, sans découper, puis fige le gain
    acteur: une session de lot
    declencheur: commande node scripts/qualite.mjs --ecrire (puis la porte avec --contre main)
    preconditions:
      - un fichier du départ du lot a maigri ou n'a plus de défaut, sans fichier neuf qui le porte
    nominal:
      - La commande compare la mesure à la base.
      - Rien n'empire, la base est baissée et la porte reste verte.
    alternatives:
      - { si: la correction fait en même temps apparaître un fichier neuf avec un défaut dont le contenu ne vient pas de la source corrigée, alors: --migrer refuse ce fichier neuf, car la source corrigée ne lui crédite rien sans lien de contenu, regles: [R3, R6] }
      - { si: une fonction grossit sans dépasser la pire de son fichier, alors: la somme des chiffres monte et le cliquet refuse, regles: [R1] }
    resultat: Une correction se fige ; elle ne sert pas à payer un défaut neuf.
  - id: C3
    titre: La porte rejoue la base du lot contre le départ du lot
    acteur: la porte orchestrate.build et la CI
    declencheur: commande node scripts/qualite.mjs --contre main
    preconditions:
      - la base du lot a pu être migrée, puis sa source corrigée et le gain figé
    nominal:
      - La porte applique la comparaison de comparerMigration à la base du lot contre la base du départ, avec les mêmes liens que --migrer (lien de contenu entre le départ et l'arbre de travail, R14, et même condition de lignes parties, R18).
      - La perte d'une source corrigée depuis la migration n'a fait que grandir, donc la base migrée reste couverte.
      - Elle répond code 0 si la base ne remonte pas.
    alternatives:
      - { si: la base du lot est éditée à la main avec un fichier existant ou un total en hausse, alors: refus code 1, regles: [R2, R12] }
      - { si: la base éditée donne à un fichier neuf une mesure supérieure à ce que sa source a perdu, ou à un fichier neuf sans lien, alors: refus code 1, aussi strict que --migrer, regles: [R3, R11] }
      - { si: git ne rend pas le contenu du départ, alors: sortie 2, regles: [R16] }
      - { si: qualite-baseline.json n'existait pas au point de départ, alors: la porte ne compare rien comme aujourd'hui (aucun crédit n'est calculé, pas de plantage), regles: [R17] }
    resultat: Migrer, corriger le reste, --ecrire puis la porte reste vert ; une base truquée est refusée.
  - id: C4
    titre: L'intégration de orchestrate contrôle un commit du lot qui découpe un fichier
    acteur: l'étape d'intégration de orchestrate
    declencheur: job orchestrate-integration
    preconditions:
      - la base du lot a changé depuis le départ du lot, et main a aussi bougé
    nominal:
      - Le contrôle établit les liens par le même lien de contenu (R14, R18), avec les lignes des fichiers neufs lues dans le commit contrôlé et celles des sources lues dans le départ du commit et dans le commit contrôlé (git show, sans arbre de travail).
      - Il appelle comparerMigration avec le départ du commit, le commit, l'existence au départ et ces liens.
      - Un découpage passe selon les mêmes règles que --migrer, la base est recomposée.
    alternatives:
      - { si: le commit ajoute un défaut neuf compensé ailleurs, alors: la base n'est pas recomposée, le rebase est abandonné comme aujourd'hui, regles: [R3, R13] }
      - { si: git ne rend pas un contenu, alors: aucun lien, le contrôle est faux et le rebase abandonné comme aujourd'hui, regles: [R13] }
    resultat: Le découpage légitime passe l'intégration, le défaut compensé non.

regles:
  - id: R1
    cas: [C2]
    enonce: "Pour ESLint, chaque clé fichier-règle porte le nombre de dépassements et la somme des chiffres mesurés (|total) ; une fonction qui grossit sous la pire du fichier fait donc monter le total, et la comparaison ordinaire du cliquet la refuse."
    statut: sourcee
    source: "scripts/qualite.mjs:31-44 (lireEslint, « la somme, pas le pire ») ; test/qualite-l462.test.ts:29 ; demande du lot (« une fonction qui grossit sous le pire chiffre de son fichier passe »)"
    tests: ["R1 — trois fonctions de complexité 463, 20 et 18 dont la troisième passe à 400 : le total monte et la comparaison refuse", "R1 — une fonction qui grossit de 18 à 19 sous la pire du fichier est refusée par la porte sur un dépôt réel"]
  - id: R2
    cas: [C1, C3]
    enonce: "Une migration ne fait monter ni une clé d'un fichier qui existait au départ du lot, ni le total d'une mesure (par outil et règle) sur tous les fichiers."
    statut: sourcee
    source: "scripts/qualite.mjs:133-146 (comparerMigration) ; docs/qualite.md:44-51 ; test/qualite-l462.test.ts:227 (« une migration ne cache pas une hausse »)"
    tests: ["R2 — le total qui monte est refusé et nomme « … (total, tous fichiers) »", "R2 — une clé d'un fichier qui existait qui monte est refusée même si le total baisse"]
  - id: R3
    cas: [C1, C2, C3, C4]
    enonce: "Pour chaque fichier source du départ et chaque outil-règle (clé sans le chemin, comme les totaux de scripts/qualite.mjs:111-117), la somme des mesures des fichiers neufs liés à cette source (R6) ne dépasse pas la perte de la source sur cette règle (R5). Un fichier neuf sans source liée n'a aucun crédit : toute mesure positive y est refusée, même quand un gain ailleurs fait baisser le total. Un morceau légitime présenté avec un tel défaut ne le sauve pas, et ne passe que si la somme de ses frères liés à la même source reste dans la perte."
    statut: sourcee
    source: "demande du lot : « compter la somme des excès par fichier et par règle, refuser un défaut neuf même compensé » ; cas mesurés par la revue (défaut neuf d'un fichier neuf compensé par un gain ailleurs)"
    tests: ["R3 — fichier neuf de 650 lignes sans parenté et fichier ancien de 700 corrigé à 0 : le fichier neuf est refusé alors que le total baisse", "R3 — un morceau lié de 400 et un fichier neuf sans lien de 600 pour une source qui a perdu 1000 : le fichier sans lien est refusé", "R3 — deux morceaux liés à la même source dont la somme (700) dépasse sa perte (650) : refusés", "R3 — découper 3047 lignes en trois de 1000 liés à la source passe toujours (le test « R10 » de test/qualite-l462.test.ts:222, réécrit avec des contenus)"]
  - id: R4
    cas: [C1]
    enonce: "La comparaison de R3 est large : une somme égale à la perte passe. Un renommage pur (git mv, un fichier neuf lié qui reprend tout ce que la source a perdu) et une fonction déplacée entière passent donc, car ils n'ajoutent aucun défaut ; une somme d'un chiffre au-dessus de la perte est refusée."
    statut: sourcee
    source: "docs/qualite.md:44-51 (« Moving or splitting a file … the one legitimate way », condition (b) : le total ne monte pas, donc l'égalité passe) ; scripts/qualite.mjs:133-146 (total égal accepté)"
    tests: ["R4 — un fichier de 1000 lignes renommé à l'identique (git mv) : accepté", "R4 — un fichier coupé en deux morceaux de 600 et 300 : accepté", "R4 — un morceau d'un chiffre au-dessus de la perte (601 pour 600) : refusé"]
  - id: R5
    cas: [C1]
    enonce: "La perte d'une source sur un outil-règle est la somme, sur ses clés qui portent un chiffre (R7), de max(0, valeur de la base du départ moins valeur de la mesure courante) ; elle compte pour une source disparue comme pour une source encore présente qui garde un défaut (une fonction déplacée entière dans un fichier neuf). Les sources candidates sont les fichiers de la base du départ (si elle n'existait pas, R17 refuse avant tout calcul) ; le crédit d'une source est borné par cette perte réelle ; elle est toujours calculée contre la base du départ, jamais contre celle du lot."
    statut: hypothese
    si_faux: "Si seule une source disparue créditait, déplacer une fonction vers un fichier neuf serait refusé ; si la perte se comptait contre la base du lot, un gain figé par --ecrire disparaîtrait du crédit et un second découpage serait refusé. Seul le calcul change, aucune donnée stockée."
    tests: ["R5 — fonction de complexité 30 déplacée avec le reste de son fichier copié (lié par le contenu), la source garde une autre fonction en défaut : acceptée", "R5 — le même déplacement avec une fonction qui a grossi au passage (31 pour 30 perdus) : refusé", "R5 — source corrigée et figée par --ecrire avant le découpage : sa perte depuis le départ crédite encore le morceau lié"]
  - id: R6
    cas: [C1, C2, C3, C4]
    enonce: "Un fichier neuf (absent du départ du lot) qui porte un chiffre n'est crédité que par la source du départ dont son contenu vient (celle que le lien de contenu lui donne, R14 et R18) ; sans ce lien (code réécrit, fichier sans parenté, copie qui laisse la source intacte, source simplement corrigée), il ne reçoit aucun crédit et paie son défaut. Aucune option ni déclaration ne remplace ce lien, pour qu'une session ne puisse pas s'exempter du cliquet. La commande et ses options ne changent pas."
    statut: sourcee
    source: "décision (1) du lead pour L477 (« coupe et correction se distinguent par le lien de contenu de git, sans option nouvelle ») pour le principe : un lien de contenu, sans option ; le lien se calcule par lignes (R14), ce que le lead a confirmé par écrit en remplacement de la détection de copie de git (note du lot du 06-11 : « le lien coupe/source est le calcul par lignes … pas git -C ») ; ni crédit sans lien (c'est le défaut compensé que le lot refuse) ni déclaration (une session s'exempterait) ; une coupe qui réécrit le code n'est pas une coupe."
    tests: ["R6 — cli.ts de 1000 lignes ramené à 350 et cli-plan.ts de 650 lignes copiées de cli.ts : accepté, la perte de cli.ts crédite cli-plan.ts", "R6 — le même découpage où cli-plan.ts réécrit le code (moins de 50 % de ses lignes figuraient dans cli.ts) : refusé, le message nomme cli-plan.ts et cli.ts", "R6 — fichier de 700 lignes corrigé à 0 et fichier neuf de 650 lignes sans parenté : refusé, le message nomme le fichier neuf et « aucune source »", "R6 — fichier corrigé sans fichier neuf : --ecrire fige le gain"]
  - id: R7
    cas: [C1]
    enonce: "Une mesure à 0 d'un fichier neuf n'ajoute aucun défaut ; les clés de comptage (nombre de dépassements, blocs jscpd) ne sont pas sommées, seules les clés qui portent un chiffre."
    statut: sourcee
    source: "scripts/qualite.mjs:109-123 (estCompteur et totaux : « les autres portent le chiffre à additionner »)"
    tests: ["R7 — un fichier neuf à 0 n'est pas refusé et n'entre pas dans la somme", "R7 — le nombre de dépassements d'un fichier neuf n'est pas ajouté à la somme des chiffres"]
  - id: R8
    cas: [C1]
    enonce: "--migrer sans --contre sort en code 2 et n'écrit rien."
    statut: sourcee
    source: "scripts/qualite.mjs:365 ; test/qualite-l462.test.ts:235"
    tests: ["R8 — --migrer sans --contre : code 2, base intacte"]
  - id: R9
    cas: [C1]
    enonce: "--migrer ne fait jamais remonter la base du lot : les clés des fichiers existants et les totaux sont jugés contre la base du lot, que la porte vient d'accepter, de sorte qu'un gain figé par --ecrire n'est pas repris par un --migrer suivant ; seul le crédit des fichiers neufs (R5) se calcule contre le départ."
    statut: hypothese
    si_faux: "Si --migrer jugeait aussi les clés et les totaux contre la base du départ, un gain figé pourrait servir à payer un défaut neuf après coup ; seule la base de comparaison change."
    tests: ["R9 — gain figé par --ecrire puis fichier neuf sans lien du même montant : --migrer refuse", "R9 — départ à 700, base du lot à 100 après un gain figé de 600, fichier neuf de mesure 50 lié à une source qui n'a rien perdu : refusé, le total (150) dépasse la base du lot (100) et la source n'a pas de perte", "R9 — la base écrite par --migrer n'a aucune clé au-dessus de la base du lot avant l'appel"]
  - id: R10
    cas: [C1]
    enonce: "Le crédit n'est jamais consommé ni stocké : à chaque appel il est recalculé depuis la base du départ, les liens (R6) et la mesure courante, sur tous les fichiers neufs, ceux déjà acceptés comme ceux d'un nouveau découpage. Un morceau déjà accepté passe donc de nouveau tant que sa mesure ne grossit pas, même si sa source a été corrigée depuis ; deux --migrer de morceaux dont la somme dépasse la perte de la source sont refusés au second, parce que la somme porte sur tous les morceaux présents."
    statut: hypothese
    si_faux: "Si le crédit était gardé dans la base ou consommé, il faudrait un nouveau format de qualite-baseline.json (question au lead) ; sans calcul depuis le départ, un second découpage après --ecrire serait refusé (cas des passes 5 à 7 du 02-11) ou deux --migrer admettraient deux fois le même défaut."
    tests: ["R10 — premier --migrer accepté, source corrigée, --ecrire, second --migrer : le morceau est gardé", "R10 — cli-plan.ts coupé de nouveau en deux après un premier --migrer et --ecrire (sources du départ : cli.ts) : accepté, la somme des morceaux reste dans la perte de cli.ts", "R10 — deux --migrer successifs de morceaux dont la somme dépasse la perte de la source : le second est refusé", "R10 — morceau déjà migré puis renommé : la clé de son ancien nom ne bloque ni --migrer, ni --ecrire, ni la porte", "R10 — morceau déjà migré puis supprimé, mesure en baisse : la porte est verte et --ecrire fige le gain", "R10 — morceau déjà migré puis réécrit et ramené à 0 : --ecrire fige le gain"]
  - id: R11
    cas: [C3]
    enonce: "La porte (--contre) applique la même comparaison que --migrer à la base du lot contre celle du départ, avec les mêmes liens de contenu : un fichier neuf d'une base éditée à la main passe seulement si son contenu est lié à une source qui a perdu au moins autant. Migrer, corriger le reste puis --ecrire laisse la porte verte, parce que la perte d'une source ne fait que grandir avec les corrections. La clé d'un fichier neuf restée dans la base du lot après que le fichier a été renommé, supprimé ou réécrit (sa mesure a baissé, le gain n'est pas figé) ne couvre que ce que le fichier mesure aujourd'hui (le plus petit de la base et de la mesure) : elle ne bloque ni la porte, ni --ecrire, ni le --migrer suivant, et un fichier qui regrossit sous cette clé est jugé par son contenu."
    statut: sourcee
    source: "docs/qualite.md:44-51 (« The same rule is what --contre applies to the baseline of the lot, so a migrated baseline passes the gate and the CI, and a hand-edited one does not ») ; scripts/qualite.mjs:357-361 (baseRemonte appelle comparerMigration)"
    tests: ["R11 — migrer, corriger la source, --ecrire : la porte reste verte", "R11 — base éditée à la main avec un fichier neuf sans lien et un fichier corrigé de même montant : la porte refuse", "R11 — base éditée à la main avec un fichier neuf lié mais plus grand que la perte de sa source : la porte refuse", "R11 — la clé d'un morceau migré ne couvre que ce qu'il mesure : réécrit sans lien et regrossi sous sa clé, la porte le refuse"]
  - id: R12
    cas: [C1, C3]
    enonce: "Un refus rend le code 1, laisse la base intacte et nomme chaque mesure en cause."
    statut: sourcee
    source: "scripts/qualite.mjs:367 (« Qualité : la migration empire N mesure(s) … ») ; scripts/qualite.mjs:360 ; test/qualite-l462.test.ts:235-244 (code 1 et base intacte)"
    tests: ["R12 — migration refusée : code 1, base inchangée, chaque clé en cause nommée avec « avant → après »"]
  - id: R13
    cas: [C4]
    enonce: "Les deux appels de l'intégration à comparerMigration (integrate.ts:226 et :287) fournissent, en plus de l'existence au départ (cat-file -e déjà présent), les liens de contenu : comparerMigration(avant, apres, existe, lien, depart = avant), où lien(cheminNeuf) rend la source ou null et se calcule par une fonction exportée de scripts/qualite.mjs (R14, R18) à partir de git show du départ (<parent ou point>) et du commit contrôlé (<REBASE_HEAD ou before>), sans arbre de travail. Le paramètre depart (la base du départ, utilisée pour le crédit R5) vaut avant pour la porte et l'intégration, et la base du départ pour --migrer. Un git show qui échoue ne crée aucun lien : le contrôle rend faux, le rebase est abandonné comme aujourd'hui. Une clé dont le fichier n'est pas dans le commit contrôlé n'a aucun lien et fait monter le total : elle n'est pas résolue (test R3 de L538) ; le contrôle n'a pas de mesure pour la borner comme la porte (R11)."
    statut: hypothese
    si_faux: "Si l'intégration ne fournissait pas de lien, tout lot qui découpe un fichier verrait son rebase abandonné ; si la signature change, seuls les trois appelants (scripts/qualite.mjs:358 et :366, integrate.ts:226 et :287) et scripts/qualite.d.mts changent."
    tests: ["R13 — commit qui coupe un fichier en deux : base recomposée à l'intégration", "R13 — commit qui ajoute un défaut neuf payé par une correction : rebase abandonné", "R13 — lien illisible dans git : rebase abandonné, rien n'est écrit", "R13 — clé d'un fichier neuf absent du commit : aucun lien, le total monte, rebase abandonné (L538)"]
  - id: R14
    cas: [C1, C3, C4]
    enonce: "Le lien d'un fichier neuf à sa source est un lien de contenu mesuré, sans déclaration. Décision du lead du 06-11 : un calcul par lignes à la place de la détection de copie de git citée par la décision (1) (le score de git se mesure sur le plus grand des deux fichiers et refuserait le déplacement d'une petite fonction). On compare les lignes non vides (espaces de bord retirés, comptées par multiensemble) du fichier neuf au contenu de chaque source au point de départ, lu par git show. Le fichier neuf est lié à la source dont le nombre de lignes liées est le plus grand, à condition que ce nombre atteigne 50 % des lignes non vides du fichier neuf ; une ligne liée est une ligne du fichier neuf qui figurait dans la source au départ ET qui a quitté la source aujourd'hui (R18). Le contenu du fichier neuf se lit dans l'arbre de travail (fichiers non suivis compris) pour --migrer et la porte, et dans le commit contrôlé à l'intégration ; celui de la source courante, dans l'arbre de travail ou le commit contrôlé. Sans source atteignant 50 %, le fichier neuf n'a pas de source et paie son défaut. Seuls les fichiers neufs qui portent un chiffre positif sont reliés, et seuls les fichiers de la base du départ sont sources. Aucune option ne remplace ce lien."
    statut: hypothese
    si_faux: "Si le seuil de 50 % était trop haut, un découpage légitime en petits morceaux serait refusé (le baisser, par exemple à 30 %) ; trop bas, un fichier neuf qui reprend quelques lignes d'une source serait lié (le relever) : la perte de la source (R5) borne de toute façon le crédit. Une copie qui laisse la source intacte ne reçoit rien (R18), un fichier réécrit paie son défaut, et sans ligne de base au départ la commande refuse avec un message (R17). Seule la fonction de lien change, aucune donnée stockée."
    tests: ["R14 — cli.ts de 1000 lignes coupé en cli.ts de 350 et cli-plan.ts de 650 lignes copiées : cli-plan.ts est lié à cli.ts", "R14 — petite fonction de 12 lignes déplacée d'une grosse source (1000 lignes) vers un petit fichier neuf : liée, acceptée", "R14 — fichier neuf dont 49 % des lignes viennent de la source : non lié, refusé ; à 50 % : lié", "R14 — fichier neuf non suivi par git : lié, l'index du lot reste inchangé", "R14 — fichier renommé (git mv) : lié à son ancien chemin", "R14 — fichier neuf dont les lignes viennent de deux sources : lié à celle qui en a perdu le plus", "R14 — à l'intégration, le lien se calcule sur le commit contrôlé sans arbre de travail"]
  - id: R15
    cas: [C1, C3]
    enonce: "Le refus d'un fichier neuf garde la forme du refus existant (R12) et ajoute la mention « fichier neuf : au-delà de ce que sa source a perdu » suivie de « source la plus proche : <fichier> » ou « aucune source ». La source la plus proche est la source liée, ou, sous le seuil de 50 %, le fichier du départ qui a perdu le plus de lignes du fichier neuf, suivi de la part de ses lignes qui en viennent (« source la plus proche : src/cli.ts, 46 % de ses lignes en viennent (lien à partir de 50 %) ») : la session sait de quel fichier il manque des lignes ; « aucune source » quand aucun fichier du départ n'en a perdu une seule. Le message du refus est décrit dans docs/qualite.md."
    statut: hypothese
    si_faux: "Seul le texte du message change (le code de sortie et la base intacte sont ceux de R12)."
    tests: ["R15 — fichier neuf refusé : le texte nomme la clé, « 0 → n », la mention et la source la plus proche ou « aucune source »", "R15 — le test de message existant (test/qualite-l462.test.ts:235-244) reste vrai sur le préfixe du refus"]
  - id: R16
    cas: [C1, C3]
    enonce: "Quand git ne rend pas le contenu d'un fichier du départ (clone superficiel, référence sans merge-base, git absent, en échec ou au-delà du délai — 60 s par git show, réglable par QUALITE_GIT_DELAI_MS), --migrer et la porte sortent en code 2 avec un message qui nomme le fichier et la référence (git absent échoue au merge-base, avant toute lecture de fichier : la référence seule) ; un refus de fichier neuf pour une cause de git serait un faux refus, et la base reste intacte. Un fichier de la base du départ absent de l'arbre du départ n'est pas une source. Un fichier neuf non suivi par git n'est pas une erreur (R14). Coût : aucune lecture git si aucun fichier neuf ne porte un chiffre positif ; sinon le contenu des sources est lu paresseusement, un git show par fichier de la base du départ au plus, une fois par exécution (mis en cache), arrêté dès qu'une source couvre toutes les lignes du fichier neuf (le lien va à la source qui en a perdu le plus : la lecture ne s'arrête pas au premier lien)."
    statut: sourcee
    source: "docs/qualite.md:38-39 (règle 4 : un outil qui échoue fait échouer la commande, code 2, jamais « zéro défaut ») ; scripts/qualite.mjs:185 (lireRef)"
    tests: ["R16 — git show en échec pour une source : code 2, message nommant le fichier et la référence, base intacte", "R16 — dépôt sans fichier neuf qui porte un chiffre : aucun git show lancé", "R16 — deux fichiers neufs et la même source : un seul git show de cette source (cache)", "R16 — clone superficiel sans merge-base : code 2, rien n'est écrit", "R16 — git absent ou délai dépassé : code 2, aucun fichier neuf refusé"]
  - id: R17
    cas: [C1, C3]
    enonce: "Sans qualite-baseline.json au point de départ (ref.base nulle, lot qui amorce la base avec --init), --migrer refuse en code 1 avec un message qui le dit, ne calcule aucun crédit, n'écrit rien et ne plante pas. La porte (--contre) garde son comportement : sans base au départ, elle ne compare rien."
    statut: sourcee
    source: "décision (3) du lead pour L477 ; scripts/qualite.mjs:185-190 (lireRef rend base null) et :357-368 (baseRemonte ignore une base nulle ; migrer appelait comparerMigration sans garde)"
    tests: ["R17 — --migrer sans qualite-baseline.json au départ : code 1, message nommant la référence et --init, base intacte, aucune exception", "R17 — --migrer sans base au départ avec un fichier neuf en défaut : aucun crédit, refus, pas de plantage", "R17 — la porte sans base au départ : code 0 comme avant"]
  - id: R18
    cas: [C1, C3, C4]
    enonce: "Le crédit exige que les lignes liées aient quitté la source (décision du lead) : une ligne du fichier neuf qui figurait dans la source au départ n'est liée que si la source courante (arbre de travail, ou commit contrôlé à l'intégration) en contient moins qu'au départ (multiensemble) ; une source disparue a tout perdu. Le crédit est borné par la perte réelle de la source (R5, R3). Une copie qui laisse la source intacte ne reçoit rien, même si une autre fonction de la source a été corrigée : elle n'a pas de source et paie son défaut."
    statut: sourcee
    source: "décision (2) du lead pour L477 : « le crédit d'un fichier neuf exige en plus que la source ait perdu les lignes qu'il partage avec elle : une copie qui laisse la source intacte ne reçoit rien », et la note du lot du 06-11 (lien par lignes parties de la source)"
    tests: ["R18 — fonction A de la source corrigée et fonction B copiée en défaut dans un fichier neuf sans que la source la perde : refusé", "R18 — coupe où la source perd les lignes copiées : accepté", "R18 — copie dont la source ne perd que 49 % des lignes du fichier neuf : refusée ; 50 % : acceptée", "R18 — source supprimée (renommage) : toutes ses lignes sont perdues, accepté", "R18 — crédit plus grand que la perte réelle de la source : refusé au-delà de la perte"]


contrats:
  - id: A1
    appel: commande node scripts/qualite.mjs --migrer --contre <ref>
    entree: "la mesure du code courant, qualite-baseline.json du lot, la base du merge-base de HEAD et de <ref>, les lignes des sources (git show au merge-base et arbre de travail) et des fichiers neufs"
    sortie: "code 0 : « qualite-baseline.json migrée : N mesures, aucun total en hausse. » et la base réécrite ; code 1 : refus (y compris base absente au départ), base intacte ; code 2 : usage, outil ou git en échec"
    erreurs:
      - { code: log error, message: "--migrer exige --contre <ref> : les fichiers « qui existaient » sont ceux du point de départ du lot." }
      - { code: log error, message: "Qualité : la migration empire N mesure(s) (ni un fichier qui existait ni le total ne peuvent monter) :" }
      - { code: log error, message: "fichier neuf : au-delà de ce que sa source a perdu" }
      - { code: log error, message: "Qualité : le contenu de <fichier> au point de départ <ref> est illisible (git show a échoué) : le lien des fichiers neufs ne peut pas être établi." }
      - { code: log error, message: "usage : node scripts/qualite.mjs [--init | --ecrire | --migrer] [--contre <ref>]" }
      - { code: log error, message: "qualite-baseline.json absente : lancer « node scripts/qualite.mjs --init » une fois, puis la versionner." }
      - { code: log error, message: "Qualité : <ref> n'a pas de qualite-baseline.json au point de départ : --migrer n'a aucun crédit à calculer. Versionner la base avec « node scripts/qualite.mjs --init » avant de découper." }
    regles: [R2, R3, R4, R5, R6, R7, R8, R9, R10, R12, R14, R15, R16, R17, R18]
  - id: A2
    appel: commande node scripts/qualite.mjs --contre <ref>
    entree: "la base du lot, celle du merge-base avec <ref>, les lignes des sources (git show au merge-base et arbre de travail) et des fichiers neufs ; sans base au départ, rien n'est comparé (R17)"
    sortie: "code 0 si la base du lot ne remonte pas et que rien n'empire, sinon code 1 ; code 2 si git échoue"
    erreurs:
      - { code: log error, message: "qualite-baseline.json remonte par rapport à N (elle ne peut que baisser : corriger le code, pas la base) :" }
      - { code: log error, message: "fichier neuf : au-delà de ce que sa source a perdu" }
      - { code: log error, message: "Qualité : le contenu de <fichier> au point de départ <ref> est illisible (git show a échoué) : le lien des fichiers neufs ne peut pas être établi." }
    regles: [R1, R2, R3, R11, R12, R14, R15, R16, R17, R18]
  - id: A3
    appel: job orchestrate-integration
    entree: "comparerMigration(avant, apres, existe, lien) (resolveBaseline, settleBaseline) : départ du commit, commit, existence au départ et lignes lues par git show dans le départ et le commit"
    sortie: "la base recomposée ou, si le contrôle refuse, aucune résolution (rebase abandonné)"
    erreurs: []
    sans_erreur: "le job ne répond à aucun appelant ; un refus du contrôle, ou un git show en échec, abandonne le rebase comme aujourd'hui (fiche base-cliquet-integration, R3)"
    regles: [R3, R13, R14, R18]

donnees:
  - { id: D1, objet: "qualite-baseline.json (carte plate clé → nombre, clés eslint|fichier|règle, …|total, knip|, jscpd|, directive|)", existant: true, modification: aucune, note: "format, clés et écriture inchangés ; le crédit et les liens se recalculent à chaque appel (R10), rien n'est stocké" }
