<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Sonde — contrôle couvert</title>
<style>body{font:14px sans-serif;margin:0;padding:16px} .ligne{display:block;height:24px;padding:6px 0} #voile{position:absolute;top:0;left:0;width:100%;height:46px;background:#333}</style></head>
<body>
<!-- La première case est sous un voile (un panneau replié sur téléphone) : l'utilisateur ne peut pas la cliquer, la sonde ne la retient pas. -->
<div id="liste">
  <label class="ligne"><input type="checkbox"> Sous le voile</label>
  <label class="ligne"><input type="checkbox"> Découverte</label>
</div>
<div id="voile"></div>
</body></html>
