<text x="200" y="71.5" text-anchor="middle" font-weight="600" font-size="13.5" fill="#e6edf3">Chooses</text>
<text x="200" y="86.5" text-anchor="middle" font-size="11.5" fill="#8b949e">lots + order</text>
<rect x="424" y="46" width="128" height="58" rx="6" fill="#0d1117" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="488" y="71.5" text-anchor="middle" font-weight="600" font-size="13.5" fill="#e6edf3">Answers</text>
<text x="488" y="86.5" text-anchor="middle" font-size="11.5" fill="#8b949e">on a question</text>
