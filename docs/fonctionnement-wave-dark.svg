<text x="1120" y="321.5" text-anchor="middle" font-size="11.5" fill="#8b949e">fresh session</text>
<polyline points="1100,245 1100,284" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr2)"/>
<text x="1094" y="270" text-anchor="end" font-size="11.5" fill="#8b949e">not compliant</text>
<polyline points="1140,286 1140,247" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr2)"/>
<text x="1147" y="262" text-anchor="start" font-size="11.5" fill="#8b949e">≤ 2 passes,</text>
<text x="1147" y="277" text-anchor="start" font-size="11.5" fill="#8b949e">3rd if it converges</text>
<rect x="1230" y="193" width="80" height="52" rx="6" fill="#0c2d6b" stroke="#58a6ff" stroke-width="2"/>
<text x="1270" y="215.5" text-anchor="middle" font-weight="600" font-size="13.5" fill="#e6edf3">raf review</text>
<text x="1270" y="230.5" text-anchor="middle" font-size="11.5" fill="#8b949e">recorded</text>
<polyline points="1190,219 1228,219" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr2)"/>
<text x="900" y="162" text-anchor="start" font-size="11.5" fill="#8b949e">small lot: one pass,</text>
<text x="900" y="177" text-anchor="start" font-size="11.5" fill="#8b949e">review-small if visible</text>
<text x="1210" y="186" text-anchor="middle" font-size="11.5" fill="#8b949e">compliant</text>
</svg>
