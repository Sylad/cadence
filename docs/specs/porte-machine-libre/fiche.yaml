sujet:
  id: porte-machine-libre
  titre: La porte joue sur la machine libre, l'hôte est décidé une fois par lot
  lot: L639
  perimetre:
    modules: [src/orchestrate/gate-place.ts, src/orchestrate/gate-host-slots.ts, src/remote-gate.ts]
    endpoints: []
    jobs: ["commande orchestrate (portes de lot et de ligne de base)"]
    hors_perimetre:
      - "la valeur de gate.host dans le cadence.yaml d'un projet (L640 l'a retirée de celui de cadence ; la remettre est un réglage du lead)"
      - "tout changement de clé de cadence.yaml : aucune clé n'est ajoutée ni renommée"
      - "le verdict, la ligne de base et le rejeu de la porte (inchangés)"

cas:
  - id: C1
    titre: Une porte de lot s'ouvre alors que la machine locale est libre
    acteur: la vague orchestrate
    declencheur: commande orchestrate (porte d'un lot, withPlace)
    preconditions:
      - gate.host est déclaré (mini-blue) et une commande build ou test existe
      - aucune autre porte locale ne tourne
    nominal:
      - La porte vérifie qu'aucune porte locale ne tient la machine.
      - Elle se joue en local (Big-Blue), sans aucun appel ssh.
      - "La ligne « porte du lot L1 : jouée en local, machine locale libre » est écrite une fois."
    alternatives:
      - { si: une porte locale tourne déjà et l'hôte est joignable avec un créneau libre, alors: la porte déborde sur l'hôte (mini-blue), regles: [R2, R3] }
      - { si: une porte locale tourne et l'hôte est occupé (gate.maxParallel atteint), alors: la porte attend la première machine libérée, dans l'ordre des demandes, regles: [R4] }
      - { si: gate.host est absent, alors: porte locale comme avant, sans ligne nouvelle, regles: [R9] }
    resultat: Une porte seule joue sur Big-Blue (~4 min mesurées) et non sur mini-blue (7 min 24).
  - id: C2
    titre: Le débordement vise un hôte injoignable
    acteur: la vague orchestrate
    declencheur: commande orchestrate (porte d'un lot, local occupé)
    preconditions:
      - gate.host est déclaré mais ne répond pas (éteint, réseau coupé)
      - la machine locale est occupée
    nominal:
      - Le préflight ssh (ConnectTimeout 3) échoue.
      - "La ligne « porte du lot L1 : porte déportée indisponible sur H (cause) — jouée en local » est écrite une fois."
      - La décision « local » est retenue pour tout le lot.
      - Les commandes suivantes du lot (ligne de base, rejeu) jouent en local sans ssh ni délai.
    alternatives:
      - { si: la porte locale libère sa place pendant l'attente, alors: elle est jouée en local sans attendre l'hôte, regles: [R4] }
      - { si: l'échec vient du push ou du cache et non du préflight, alors: même repli, une fois par lot, ligne « cache de dépendances impossible », regles: [R6, R7] }
    resultat: Au plus une ligne de repli et un préflight échoué par lot, au lieu de 50 lignes sur 4 lots.
  - id: C3
    titre: La ligne de base et le rejeu d'un même lot suivent la décision déjà prise
    acteur: la vague orchestrate
    declencheur: commande orchestrate (ligne de base, rejeu, nouvelle porte du même lot)
    preconditions:
      - la porte du lot a déjà décidé son hôte
    nominal:
      - Le lieu s'ouvre avec le même hôte (ou le même repli local) sans nouveau préflight.
      - Aucune seconde ligne de repli n'est écrite.
    alternatives:
      - { si: la décision était l'hôte et la connexion est perdue en cours de porte, alors: rejeu local de cette commande et suites locales, comme avant, regles: [R8] }
      - { si: le lot a une ligne de base jouée pendant sa porte (l'hôte tient déjà son tour), alors: elle ne reprend pas de tour, regles: [R5] }
    resultat: Une décision d'hôte par lot, relue par chaque lieu ouvert du lot.

regles:
  - id: R1
    cas: [C1]
    enonce: "Avec gate.host, une porte joue d'abord en local quand aucune autre porte locale ne tourne ; elle n'ouvre alors ni ssh ni worktree sur l'hôte."
    statut: sourcee
    source: "demande du lot L639 : « Big-Blue d'abord, mini-blue en débordement » ; mesures du 05-11 : Big-Blue ~4 min seule, mini-blue 7 min 24"
    tests: ["R1 — local libre : la porte joue en local et aucun appel ssh n'est fait", "R1 — local libre : une seule ligne de lieu est écrite"]
  - id: R2
    cas: [C1]
    enonce: "Quand une porte locale tient déjà la machine, la porte suivante déborde sur l'hôte si son préflight réussit et si un créneau est libre ; la ligne de lieu existante « porte jouée sur l'hôte H (sha, cache) » est inchangée."
    statut: sourcee
    source: "demande du lot L639 : « mini-blue en débordement » ; message coded src/orchestrate/gate-place.ts:103"
    tests: ["R2 — local occupé, hôte joignable : la porte joue sur l'hôte avec la ligne existante"]
  - id: R3
    cas: [C1]
    enonce: "Le nombre de portes locales simultanées vaut 1 par défaut (constante, sans clé de configuration) ; une porte locale d'un lot qui tient déjà la machine ne reprend pas de tour pour ses lieux imbriqués."
    statut: hypothese
    si_faux: "Si la borne locale doit se régler (2 portes sur Big-Blue), il faudra une clé optionnelle gate.localMaxParallel : question de config publique à poser alors ; seule la constante change ici."
    tests: ["R3 — deux portes simultanées avec hôte joignable : une locale, une sur l'hôte", "R3 — la ligne de base d'un lot qui tient la machine locale ne s'attend pas elle-même"]
  - id: R4
    cas: [C1, C2]
    enonce: "Quand la machine locale et l'hôte sont tous deux occupés, la porte attend la première machine libérée, dans l'ordre des demandes, et le dit une fois (ligne existante « en attente d'un créneau de porte », onWait)."
    statut: sourcee
    source: "src/orchestrate/gate-place.ts:76 (attente d'un créneau, L624) et src/orchestrate/gate-host-slots.ts:9 (ordre des demandes)"
    tests: ["R4 — deux machines occupées : la porte attend et la ligne d'attente est écrite une fois", "R4 — la première machine libérée prend la porte en attente"]
  - id: R5
    cas: [C3]
    enonce: "La décision d'hôte est prise une fois par lot et gardée en mémoire pour sa durée (clé : le lot, `owner`) ; la porte, la ligne de base et le rejeu du lot la relisent sans nouveau préflight. Sans `owner`, aucune décision n'est gardée."
    statut: sourcee
    source: "demande du lot L639 : « décision d'hôte prise une fois par lot » ; mesure : 0 « porte déportée indisponible » répété par lot"
    tests: ["R5 — porte puis ligne de base d'un même lot : un seul préflight", "R5 — deux lots : un préflight chacun", "R5 — sans owner : aucune décision gardée"]
  - id: R6
    cas: [C2]
    enonce: "Le préflight est un ssh non interactif avec ConnectTimeout 3 (3 s, contre 5 aujourd'hui) ; un échec (code non nul, délai, 255) rend la décision « local » du lot."
    statut: sourcee
    source: "demande du lot L639 : « préflight ssh ConnectTimeout 3 » ; code actuel src/remote-gate.ts:21 (PROBE_CONNECT_S = 5)"
    tests: ["R6 — l'appel ssh du préflight passe ConnectTimeout=3", "R6 — hôte injoignable : la décision du lot est local"]
  - id: R7
    cas: [C2]
    enonce: "Hôte injoignable, la porte se replie en local avec une seule ligne par lot (« porte déportée indisponible sur H (cause) — jouée en local ») ; les lieux suivants du lot ne réécrivent pas la ligne et n'attendent aucun délai ssh. Un échec de push ou de cache garde sa ligne « cache de dépendances impossible », aussi une fois par lot."
    statut: sourcee
    source: "demande du lot L639 : « hôte injoignable = repli local sans timeout répété » ; texte déjà codé src/orchestrate/gate-place.ts:99"
    tests: ["R7 — hôte injoignable, porte et ligne de base : une seule ligne « porte déportée indisponible »", "R7 — lieux suivants du lot : aucun appel ssh", "R7 — échec de cache : une seule ligne « cache de dépendances impossible » par lot"]
  - id: R8
    cas: [C3]
    enonce: "Une connexion perdue (ssh 255) pendant une commande sur l'hôte reste rejouée en local avec sa ligne, comme avant ; le reste du lot reste local sans nouveau préflight."
    statut: sourcee
    source: "src/orchestrate/gate-place.ts:114 (rejeu après connexion perdue, R6 de porte-deportee)"
    tests: ["R8 — connexion perdue en cours de porte : rejeu local et ligne dite une fois"]
  - id: R9
    cas: [C1]
    enonce: "Sans gate.host, ou sans commande build ni test, ou avec un worktree non validé, ou un sha invalide, la porte est locale avec les mêmes lignes qu'avant ; aucun préflight, aucune décision gardée."
    statut: sourcee
    source: "src/orchestrate/gate-place.ts:71-86 (cas locaux d'emblée)"
    tests: ["R9 — sans gate.host : aucune ligne nouvelle et aucun ssh", "R9 — worktree non validé : même ligne qu'avant"]
  - id: R10
    cas: [C2]
    enonce: "Une décision « hôte injoignable » vaut pour le lot en cours seulement ; le lot suivant, ou une nouvelle vague, refait son préflight (un hôte revenu est retrouvé)."
    statut: hypothese
    si_faux: "Si l'hôte injoignable doit l'être pour toute la vague, la mémoire passe du lot à la vague : un préflight de moins, rien d'autre ne change ; la mesure « 0 ligne répétée par lot » reste vraie."
    tests: ["R10 — lot A voit l'hôte tomber, lot B démarré après : nouveau préflight"]

contrats:
  - id: A1
    appel: commande orchestrate
    entree: "cadence.yaml orchestrate.gate.host (inchangé), build et test ; aucune clé ajoutée"
    sortie: "porte jouée sur la machine libre : local d'abord, hôte en débordement, verdict et lignes de lieu inchangés"
    erreurs:
      - { code: log info, message: "porte du lot L1 : porte déportée indisponible sur H (cause) — jouée en local" }
      - { code: log info, message: "porte du lot L1 : cache de dépendances impossible sur H (cause) — jouée en local" }
      - { code: log info, message: "porte du lot L1 : en attente d'un créneau de porte sur H (N porte(s) simultanée(s) au plus)" }
      - { code: log info, message: "porte du lot L1 : connexion perdue avec H pendant la porte — rejouée en local" }
    regles: [R1, R2, R3, R4, R5, R7, R8, R9, R10]
  - id: A2
    appel: commande orchestrate (préflight de l'hôte)
    entree: "ssh -o BatchMode=yes -o ConnectTimeout=3 H uname/nproc"
    sortie: "plateforme et cœurs de l'hôte, ou la cause de son silence ; résultat gardé pour le lot"
    erreurs:
      - { code: log info, message: "porte du lot L1 : porte déportée indisponible sur H (cause) — jouée en local" }
    regles: [R5, R6, R7]

donnees:
  - { id: D1, objet: "décision d'hôte du lot (mémoire du processus, clé = le lot)", existant: false, modification: ajout, note: "jamais écrite sur disque ; perdue à la fin de la vague" }
  - { id: D2, objet: "cadence.yaml orchestrate.gate (host, install, refs, maxParallel)", existant: true, modification: aucune, note: "clés et schéma inchangés ; seule leur lecture change : l'hôte devient le débordement" }
