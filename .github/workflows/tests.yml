# Diagnostic de la suite sur le runner GitHub, sans rien publier : même image, Node 22 (le minimal, engines.node) et Node 24 (celui de publish.yml), même identité git
# et même npm ci que le job de publish.yml. Lancement à la main (workflow_dispatch), par un push sur une branche diag/** ou sur main (L446) :
# chaque run part d'un checkout neuf, sans fichier non suivi, ce que les arbres locaux et les copies de la porte ne sont jamais.
name: tests

on:
  workflow_dispatch:
  push:
    branches: [main, 'diag/**']

permissions:
  contents: read

# Un seul run par rafale de pushes (L834, D-33) : un push sur la même branche annule le run encore en cours, que le suivant remplace.
# Chaque run joue tout l'arbre de son commit, celui de la pointe contient les commits des runs annulés : rien n'est livré sans
# avoir été joué (publish.yml, déclenché par les tags, n'est pas dans ce groupe et n'est jamais annulé par lui).
# Mesure du 24-11 : 23 runs en 3 jours, des pushes à 2 min d'écart joués chacun en entier (~55 min par run).
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # Tout l'historique et les tags (L336) : test/changelog.test.ts cherche les commits de chaque lot cité sous le dernier tag.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          registry-url: https://registry.npmjs.org

      # Comme publish.yml, pour que npm soit le même.
      - run: npm install -g npm@^11.5.1

      # Les tests créent des dépôts git jetables : il leur faut une identité (comme publish.yml).
      - run: |
          git config --global user.name "cadence-ci"
          git config --global user.email "cadence-ci@users.noreply.github.com"

      # cadence ref appelle poppler et tesseract (ses tests rendent de vrais PDF et lisent leur texte par OCR) ; ImageMagick y est remplacé par un faux (ref measure décode les PNG lui-même).
      - run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr

      # Les tests de rendu réel de cadence ref corpus (R16, R17, R18, R20) rendent le corpus avec Playwright et son Chromium, que le dépôt ne porte pas
      # (sans CADENCE_PLAYWRIGHT ils sont ignorés). Playwright est installé hors du dépôt, à la version qui sert à la maison (maritime-atlas/qa),
      # avec les polices système que Chromium attend (fonts-liberation pour Arial, d'où les zones de R20).
      - name: Playwright et Chromium (rendu réel du corpus)
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-audit --no-fund playwright@1.61.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "CADENCE_PLAYWRIGHT=$RUNNER_TEMP/pw/node_modules/playwright" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Environnement vu par la suite
        run: |
          git --version
          node --version
          npm --version
          git config --global --list || true
          grep '^GIT_' <<< "$(env)" || echo "aucune variable GIT_*"

      # Le README est une page d'accueil (L232) : aucun lien relatif ni ancre cassé dans lui et dans les pages docs/.
      - name: Liens du README et des pages docs/
        run: node scripts/check-links.mjs

      # prepublishOnly de publish.yml : typecheck, qualité (cliquet) puis tests.
      - run: npm run typecheck

      # Garde-fous de qualité (L462) : rien ne doit empirer par rapport à qualite-baseline.json, et la base ne peut pas dépasser celle de origin/main (docs/qualite.md).
      - name: Qualité du code (cliquet)
        run: npm run qualite -- --contre origin/main
      - run: npm test

      # La suite est jouée une fois par version de Node, par `npm test` ci-dessus (L834). L'étape suivante contrôle le paquet que
      # publish.yml enverrait (liste des fichiers de `files`, archive, métadonnées) sans rejouer prepublishOnly (typecheck, cliquet
      # et suite, déjà joués ci-dessus) : --ignore-scripts. dist/ et v2/dist/ sont ceux que `npm ci` a construits (prepare).
      # Jusqu'à L834 la suite était rejouée ici, dans le cycle de `npm publish` (L224, diagnostic d'un run rouge de publish.yml) :
      # ce rejeu reste fait avant chaque version par `cadence release` (prepublishOnly en clone neuf, puis npm pack et fumée du
      # paquet installé), et par publish.yml lui-même (docs/releasing.md).
      # Un commit hors release porte une version déjà publiée : npm refuse alors le dry-run par « You cannot publish over the previously
      # published versions ». Ce seul refus, lu sur une ligne d'erreur de npm comme dans publish.yml, est toléré ; tout autre échec reste rouge.
      - name: Paquet sous npm publish --dry-run
        continue-on-error: false
        run: |
          if out="$(npm publish --dry-run --ignore-scripts --access public 2>&1)"; then
            echo "$out"
          else
            echo "$out"
            grep -qE '^npm (error|ERR!) (code EPUBLISHCONFLICT|.*previously published)' <<< "$out" || exit 1
            echo "La version de package.json est déjà publiée : npm refuse le dry-run, c'est attendu hors release."
          fi
