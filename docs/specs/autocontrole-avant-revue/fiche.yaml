sujet:
  id: autocontrole-avant-revue
  titre: "Auto-contrôle avant revue dans les briefs implement et fix"
  lot: L222
  perimetre:
    modules: [templates/orchestrate/implement.md, templates/orchestrate/fix.md, src/orchestrate/briefs.ts, src/corrections.ts, src/cli.ts, README.md, CHANGELOG.md, docs/mesures]
    endpoints: []
    jobs: []
    hors_perimetre:
      - "le schéma du rapport de session (src/orchestrate/schemas.ts) : aucun champ ajouté, la vérification se dit dans la prose existante (R6)"
      - "la commande cadence corrections : seule l'option --since s'ajoute (R9) ; son format de sortie et --until sont inchangés, la mesure avant/après est un document de docs/mesures"
      - "les briefs fix-minors, spec, spec-back, accept, accept-back, review* : inchangés (R8)"
      - "l'agent code-reviewer : ses constats majeurs existants ne changent pas"

cas:
  - id: C1
    titre: "Une session d'implémentation reçoit la liste d'auto-contrôle et la vérifie avant de rendre"
    acteur: le programme (orchestrate) puis la session implement
    declencheur: commande cadence orchestrate (étape implement, rendu par renderBrief('implement'))
    preconditions:
      - le lot est dans une vague
    nominal:
      - "Le programme rend implement.md : le brief contient la liste des constats récurrents des revues du 15-10."
      - "La session code et commite ses sous-parties comme avant."
      - "Avant de rendre son rapport, elle relit la liste, point par point, sur ses propres commits et corrige ce qui manque."
      - "Son rapport dit, dans la prose existante (choix ou nonVerifie), les points qu'elle n'a pas pu tenir."
    alternatives:
      - { si: "le lot n'a pas de fiche ({{fiche}} vide)", alors: "le point « un test par règle » se lit « une règle du lot, un test nommé »", regles: [R2] }
      - { si: "le lot ne modifie aucun écran", alors: "le point capture est sans objet et la session le dit", regles: [R4] }
      - { si: "un point de la liste ne peut pas être tenu", alors: "elle le déclare au lieu de le taire", regles: [R6] }
    resultat: "Un brief implement qui porte la liste, sans changer le reste de ses consignes."
  - id: C2
    titre: "Une session de correction reçoit la même liste"
    acteur: le programme puis la session fix
    declencheur: commande cadence orchestrate (étape fix, renderBrief('fix'))
    preconditions:
      - une revue a rendu des constats à corriger
    nominal:
      - "Le programme rend fix.md avec la liste."
      - "La session corrige les constats, puis relit la liste sur ce qu'elle a modifié avant de rendre."
    alternatives:
      - { si: "la liste touche à autre chose que les constats", alors: "la session ne corrige que les constats : la liste ne vaut que pour ce qu'elle a changé", regles: [R7] }
    resultat: "Un brief fix qui porte la liste, avec « fix them, and nothing else » inchangé."
  - id: C3
    titre: "Le lead mesure les passes de correction avant et après la liste"
    acteur: le lead
    declencheur: commande cadence corrections <dossier> --until <borne> (avant) puis --since <borne> (après)
    preconditions:
      - des journaux .cadence/runs existent avant et après la mise en service de L222
    nominal:
      - "Le lead rejoue la commande bornée par --until à l'heure de la mise en service (avant), puis la commande --since de la même borne (après : les lots des vagues créées après la borne, avec toutes leurs passes)."
      - "Il consigne les passes par lot dans docs/mesures/."
    alternatives: []
    sans_alternative: "la mesure est une lecture seule de cadence corrections ; ses échecs sont ceux de la commande (usage, date invalide)"
    resultat: "Un document daté avec les passes de correction par lot avant et après."

regles:
  - id: R1
    cas: [C1]
    enonce: "Le brief implement contient une liste d'auto-contrôle qui demande la documentation d'usage (README et documentation d'architecture) à jour dans les mêmes commits que le comportement."
    statut: sourcee
    source: "titre du lot L222 : « doc d'usage (README, architecture) à jour dans le même lot » ; consigne existante templates/orchestrate/implement.md:12 (README), test/orchestrate-briefs.test.ts:43"
    tests: ["R1 — le brief implement cite README et la documentation d'architecture dans la liste d'auto-contrôle"]
  - id: R2
    cas: [C1]
    enonce: "La liste demande un test nommé « Rn — … » par règle de la fiche ; sans fiche, un test nommé par règle de gestion du lot."
    statut: sourcee
    source: "titre du lot L222 : « un test nommé par règle de la fiche » ; convention README « The downstream briefs » (tests cités « Rn — »)"
    tests: ["R2 — le brief implement demande un test nommé Rn par règle de la fiche"]
  - id: R3
    cas: [C1]
    enonce: "La liste interdit le code mort et le test qui ne peut pas échouer (un test dont l'assertion est toujours vraie ou qui n'exerce pas la règle)."
    statut: sourcee
    source: "titre du lot L222 : « pas de code mort ni de test qui ne peut pas échouer » ; docs/mesures/corrections-2026-10-10.md (test manquant : un test qui ne peut pas échouer)"
    tests: ["R3 — le brief implement interdit le code mort et le test qui ne peut pas échouer"]
  - id: R4
    cas: [C1]
    enonce: "La liste demande, pour un écran modifié, la capture due de chaque état (1440 et 390 px, nom de fichier relatif) ; un lot sans écran modifié n'en doit pas."
    statut: sourcee
    source: "titre du lot L222 : « capture due pour un écran modifié » ; consigne Playwright existante de implement.md (nom relatif seul)"
    tests: ["R4 — le brief implement demande la capture d'un écran modifié, nom de fichier relatif"]
  - id: R5
    cas: [C1]
    enonce: "La liste interdit un commentaire faux : un commentaire, une docstring ou un message qui décrit un comportement que le code n'a plus ou n'a pas."
    statut: sourcee
    source: "titre du lot L222 : « pas de commentaire faux »"
    tests: ["R5 — le brief implement interdit le commentaire faux"]
  - id: R6
    cas: [C1]
    enonce: "La session vérifie la liste avant de rendre ; un point qu'elle ne tient pas est écrit sous choix ou nonVerifie de son rapport, sans nouveau champ de rapport."
    statut: hypothese
    si_faux: "Si le programme doit lire la vérification, un champ du rapport (schemas.ts) serait ajouté : un autre lot, avec une question sur le contrat du rapport."
    tests: ["R6 — le brief implement demande de vérifier la liste avant de rendre et d'écrire les points non tenus", "R6 — le schéma du rapport implement n'a pas de nouveau champ"]
  - id: R7
    cas: [C2]
    enonce: "Le brief fix porte la même liste, limitée à ce que la session a modifié, et garde « fix them, and nothing else »."
    statut: sourcee
    source: "titre du lot L222 : « dans le brief implement (et fix) » ; templates/orchestrate/fix.md:2-3 (« and nothing else »)"
    tests: ["R7 — le brief fix porte la liste d'auto-contrôle et garde « nothing else »"]
  - id: R8
    cas: [C1, C2]
    enonce: "Le reste des briefs est inchangé : la liste est du texte fixe, sans nouveau marqueur {{…}} ni nouvelle variable de BriefVars, et le rendu ne laisse aucune accolade."
    statut: hypothese
    si_faux: "Si la liste devait varier selon le lot (capture seulement pour un lot visible), il faudrait un marqueur et une variable de plus dans briefs.ts ; les tests de rendu changeraient."
    tests: ["R8 — implement et fix se rendent sans accolade restante avec les variables existantes", "R8 — fix-minors, spec, spec-back, accept et review-small n'ont pas la liste"]
  - id: R9
    cas: [C3]
    enonce: "La mesure avant/après est un document de docs/mesures/ qui rejoue cadence corrections : l'avant avec --until <borne>, l'après avec --since <borne>, les passes par lot comparées. Une vague rend tous ses briefs depuis la copie de l'outil figée à sa création (<vague>/tool/) : --since ne garde donc que les lots des vagues créées strictement après la borne (created de wave.json), avec toutes leurs passes, quelle que soit la date de début de leur implement ; une vague sans created lisible est écartée ; --until est inchangé (vagues créées jusqu'à la borne incluse), si bien que les deux mesures ne se recouvrent jamais ; la sortie est inchangée. Avant + après égale le total sans borne champ par champ seulement si la borne est posée hors vague (cadence orchestrate --status : aucune vague en cours) et qu'aucune vague créée avant elle n'est encore reprenable (--status ne liste que les vagues vivantes : lister les autres avec jq sur .cadence/runs/*/wave.json, status différent de done, et les terminer ou ne plus les reprendre) ; une vague d'avant la borne reçoit le brief d'avant, sauf reprise sans instantané ou depuis un instantané d'avant L223 avec --budget projet:lot=+N (dist/ et gabarits courants) ; un écart signale une vague à cheval, la borne est invalide et se repose."
    statut: sourcee
    source: "constats de la revue du 15-10 (vague 2026-10-15-1915) : une différence sans borne − --until donne un après faux dès qu'une vague est à cheval sur la borne (--continue : cas courant, scripts/mise-en-service.mjs:141) ; puis le début de l'implement donnait un après faux pour une vague --continue créée avant la borne (src/orchestrate/snapshot.ts:37, command.ts:785 : les gabarits sont lus une fois par vague)"
    tests: ["R9 — le README renvoie au document de mesure avant/après de L222", "R9 — le document de mesure rejoue l'avant avec --until et l'après avec --since, sans différence", "R9 — --since garde les lots des vagues créées après la borne, --until ceux des vagues créées avant : la somme des deux est le total", "R9 — une borne posée hors vague partage les journaux : --until + --since = sans borne champ par champ, et l'écart d'une vague à cheval est celui de ses passes terminées après la borne", "R9 — --since se règle sur la création de la vague, pas sur le début de l'implement : une vague --continue créée avant la borne ne reçoit pas le brief d'après", "R9 — --since et --until ensemble lisent une fenêtre de dates de création : --since strict, --until inclusif, les vagues hors fenêtre sont écartées", "R9 — --since invalide est refusé, l'aide et le message d'usage de cadence corrections citent --since"]

contrats:
  - id: A1
    appel: commande cadence orchestrate (brief implement.md)
    entree: "BriefVars existantes (chemin, lot, titre, objectif, repos, fiche, news, commits, reponse…)"
    sortie: "le brief texte avec la liste d'auto-contrôle (R1 à R6), consignes existantes conservées"
    erreurs:
      - { code: log error, message: "gabarit implement.md : valeur manquante pour {{chemin}}" }
    regles: [R1, R2, R3, R4, R5, R6, R8]
  - id: A2
    appel: commande cadence orchestrate (brief fix.md)
    entree: "BriefVars existantes (constats, commits, captures…)"
    sortie: "le brief texte avec la liste d'auto-contrôle, limitée à ce qui est modifié"
    erreurs:
      - { code: log error, message: "gabarit fix.md : valeur manquante pour {{constats}}" }
    regles: [R7, R8]
  - id: A3
    appel: commande cadence corrections
    entree: "[dossier] [--until date] [--since date] [--cache fichier] ; --since est la seule option ajoutée"
    sortie: "les tables existantes, sur les lots des vagues créées après --since ; le lead consigne les passes par lot avant/après dans docs/mesures/"
    erreurs:
      - { code: "exit 2", message: "--since invalide : <valeur> (une date ISO, ex. 2026-10-10T18:31Z)" }
    regles: [R9]

donnees:
  - { id: D1, objet: "templates/orchestrate/implement.md et fix.md (texte des briefs)", existant: true, modification: changement, note: "texte de consigne relu à chaque rendu, aucun format stocké", decision: "texte de consigne rendu à chaque vague, pas un format stocké ; réversible par un commit : écrit en règles R1 à R8, aucune question au lead" }
  - { id: D2, objet: "docs/mesures/ (document avant/après)", existant: false, modification: aucune, note: "nouveau document daté, aucune donnée lue ou écrite hors .cadence/corrections.json de la commande existante" }
