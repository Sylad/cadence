<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Défauts connus</title>
<style>
  body { margin: 0; font: 16px/1.4 sans-serif; }
  header { padding: 8px 16px; }
  main { padding: 0 16px; }
  /* D1 : un bandeau de largeur fixe fait défiler la page sous 600 px */
  .bandeau { width: 600px; background: #eee; }
  /* D2 : un titre tronqué par une ellipse */
  .titre { width: 120px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* D3 : un mot coupé entre deux lettres */
  .etroit { width: 70px; overflow-wrap: anywhere; }
  /* D4 : une valeur séparée de son unité */
  .valeur { width: 48px; }
  /* D5 : un bouton dont le libellé passe à la ligne */
  .bouton { width: 60px; }
  /* D6 : une cible de 16 × 16 px */
  .petit { width: 16px; height: 16px; padding: 0; border: 0; }
  /* D7 : une police de 10 px */
  .note { font-size: 10px; }
  .tableau { overflow-x: auto; width: 100%; }
  .tableau table { width: 900px; }
  #panneau { display: none; }
  #panneau.ouvert { display: block; width: 700px; }
</style></head>
<body>
<header><nav><a href="#a">Accueil</a></nav></header>
<main>
  <div class="bandeau" data-testid="bandeau">Bandeau de largeur fixe</div>
  <p class="titre">Un titre beaucoup trop long pour sa boîte</p>
  <p class="etroit">Anticonstitutionnellement</p>
  <p class="valeur">vent 12 km/h</p>
  <button class="bouton" type="button">Afficher tout</button>
  <button class="petit" type="button" aria-label="fermer">×</button>
  <p class="note">Source : démo</p>
  <div class="tableau"><table><tr><td>un tableau large dans son propre défileur : pas un débordement de la page</td></tr></table></div>
  <button id="ouvrir" type="button" onclick="document.getElementById('panneau').classList.add('ouvert')">Ouvrir le panneau</button>
  <div id="panneau">Panneau de 700 px, ouvert seulement par un clic</div>
</main>
</body></html>
