sujet:
  id: index-memoire-seuil
  titre: "Index mémoire de Claude Code : avertir au-delà d'un seuil de taille et proposer de regrouper les entrées datées"
  lot: L442
  perimetre:
    modules: [src/memory-index.ts, src/session.ts, src/cli.ts, src/config.ts, skills/session-close/SKILL.md, skills/lead/SKILL.md, docs/session.md, docs/lead.md]
    endpoints: []
    jobs: []
    hors_perimetre:
      - "l'écriture dans la mémoire : cadence ne modifie, ne déplace ni ne supprime jamais MEMORY.md ni un autre fichier de mémoire, il mesure et propose"
      - "le regroupement lui-même : l'agent le fait, après l'accord de l'humain, avec les outils de la session (le skill le décrit)"
      - "le contenu d'une entrée : aucun jugement sur ce qui mérite d'être gardé en mémoire (déjà le rôle de l'étape « Memory, filtered » du skill)"
      - "la mesure en tokens : l'index est mesuré en octets, sans tokenizer"

cas:
  - id: C1
    titre: "La clôture de session signale un index mémoire trop gros"
    acteur: l'humain ou l'agent qui ferme la session
    declencheur: commande cadence session close
    preconditions:
      - "le fichier MEMORY.md de la mémoire de Claude Code du dossier d'invocation existe"
      - "sa taille dépasse le seuil (par défaut 12000 octets)"
    nominal:
      - "La clôture localise l'index du dossier d'invocation (R1) et mesure sa taille en octets (R2)."
      - "Elle compte les entrées datées (R3) et les octets qu'elles occupent."
      - "Elle imprime une section « Mémoire » : taille, seuil, nombre d'entrées datées et leur poids, avec la proposition de les regrouper sous une ligne vers un index secondaire (R4)."
      - "Le code de sortie et la ligne « prêt à fermer » ne changent pas (R5)."
      - "Le skill session-close, à son étape mémoire, propose le regroupement et ne l'exécute qu'avec l'accord de l'humain (R8)."
    alternatives:
      - { si: "l'index est absent ou sa taille est au plus égale au seuil", alors: "aucune section, la sortie est celle d'avant le lot", regles: [R2, R6] }
      - { si: "le seuil est posé dans cadence.yaml (memory.indexMaxBytes)", alors: "il remplace le défaut ; une valeur qui n'est pas un entier ≥ 1 est refusée", regles: [R7] }
      - { si: "l'index existe mais aucune entrée n'est datée", alors: "la section dit la taille et qu'aucune entrée datée n'est à regrouper", regles: [R3, R4] }
      - { si: "l'index est illisible (droits, dossier au lieu d'un fichier)", alors: "une ligne le dit, la clôture continue et son code de sortie ne change pas", regles: [R5, R9] }
    resultat: "L'humain voit dans le rapport de clôture que l'index pèse trop et quelles entrées regrouper, sans que la clôture tombe."
  - id: C2
    titre: "Le lead voit l'avertissement à chaque tour"
    acteur: le lead (session Claude Code du dossier parent)
    declencheur: commande cadence lead tour
    preconditions:
      - "l'index MEMORY.md du dossier parent (celui du tour) dépasse le seuil"
    nominal:
      - "Le tour localise l'index du dossier parent (R1) et le mesure (R2)."
      - "Après les lignes de projets et celles des worktrees, il imprime une ligne « mémoire » : taille, seuil, nombre d'entrées datées (R4)."
      - "Le lead propose le regroupement à l'humain sans l'imposer (R8)."
    alternatives:
      - { si: "l'index est sous le seuil, absent ou illisible sans autre effet", alors: "aucune ligne en plus, sauf la ligne d'illisibilité", regles: [R6, R9] }
      - { si: "le tour est demandé avec --json", alors: "la sortie JSON est inchangée, l'avertissement n'y figure pas", regles: [R10] }
    resultat: "Le lead lit en une ligne que sa charge fixe est gonflée par la mémoire, au lieu de le découvrir à la mesure."
  - id: C3
    titre: "L'agent regroupe les entrées datées après accord"
    acteur: l'agent de la session (lead ou clôture)
    declencheur: commande cadence session close (lecture de la section « Mémoire » par le skill)
    preconditions:
      - "la section ou la ligne « mémoire » a signalé au moins une entrée datée"
      - "l'humain a accepté la proposition"
    nominal:
      - "L'agent déplace les entrées datées dans un index secondaire (un fichier de mémoire) et les remplace dans MEMORY.md par une seule ligne qui pointe vers lui."
      - "Il relance cadence session close : la section « Mémoire » a disparu ou la taille a baissé."
    alternatives:
      - { si: "l'humain refuse ou ne répond pas", alors: "rien n'est déplacé, l'avertissement revient au prochain tour et à la prochaine clôture", regles: [R8] }
    resultat: "L'index chargé à chaque tour est plus léger, sans entrée perdue : chacune reste atteignable par l'index secondaire."

regles:
  - id: R1
    cas: [C1, C2]
    enonce: "L'index mesuré est <CLAUDE_CONFIG_DIR ou ~/.claude>/projects/<dossier>/memory/MEMORY.md, où <dossier> est le chemin absolu du dossier d'invocation dont chaque « / » et chaque « . » devient « - » ; pour la clôture le dossier d'invocation est celui où la commande tourne (une seule mesure, même avec --all), pour le tour le dossier parent du tour."
    statut: sourcee
    source: "dossiers réels de ~/.claude/projects (ex. -home-sylvain-ladoire-projects-developpeur--cadence-runs-… : « /.cadence » donne « --cadence ») et memory/MEMORY.md du projet developpeur"
    tests: ["R1 — chemin /home/u/p/.cadence/x donne -home-u-p--cadence-x", "R1 — CLAUDE_CONFIG_DIR remplace ~/.claude"]
  - id: R2
    cas: [C1, C2]
    enonce: "La taille est celle du fichier en octets ; l'avertissement n'a lieu que si elle dépasse strictement le seuil (égale au seuil : rien)."
    statut: hypothese
    si_faux: "Si le seuil se compte en lignes ou en tokens, seul le calcul de la taille change (aucune donnée en jeu) ; le lot pèse en octets car le lead n'a pas de tokenizer."
    tests: ["R2 — 12000 octets pile : aucun avertissement", "R2 — 12001 octets : avertissement", "R2 — fichier absent : aucun avertissement"]
  - id: R3
    cas: [C1, C2]
    enonce: "Une entrée datée est une ligne de liste (« - ») de l'index dont le texte commence par un jour « jj-mm » (précédé au plus de « ** », « [ » et « ⚠ ») ou dont le nom de fichier lié contient une date « _aaaa_mm_jj » ; les autres lignes (profil, titres, lignes de renvoi) ne sont jamais comptées."
    statut: hypothese
    si_faux: "Si les entrées datées se reconnaissent autrement, le nombre proposé change et la proposition est plus ou moins large ; aucune donnée n'est touchée puisque rien n'est écrit."
    tests: ["R3 — « - **[31-10 : … » est datée", "R3 — lien vers x_2026_10_13.md est datée", "R3 — « - [Profil](profil.md) » n'est pas datée", "R3 — ligne de titre « ## … » n'est pas comptée"]
  - id: R4
    cas: [C1, C2, C3]
    enonce: "Le message dit la taille, le seuil, le nombre d'entrées datées et leur poids en octets, et propose de les regrouper sous une ligne vers un index secondaire ; avec zéro entrée datée il le dit au lieu de proposer."
    statut: sourcee
    source: "demande du lot : « proposer de regrouper les entrées datées sous une ligne vers un index secondaire »"
    tests: ["R4 — la section cite taille, seuil, nombre et poids des entrées datées", "R4 — sans entrée datée : « aucune entrée datée à regrouper »"]
  - id: R5
    cas: [C1]
    enonce: "L'avertissement ne compte pas parmi les points ouverts : le code de sortie de session close et la ligne « prêt à fermer » ou « pas fermé » restent ceux d'avant."
    statut: sourcee
    source: "src/session.ts:150-153 (open = écarts non avertissement + dépôt + livraison) ; le nettoyage proposé ne change jamais le verdict (src/session.ts:130-131)"
    tests: ["R5 — index trop gros et dépôt propre : code 0 et « ✓ prêt à fermer »", "R5 — index trop gros et dépôt sale : le nombre de points ouverts est inchangé"]
  - id: R6
    cas: [C1, C2]
    enonce: "Index absent ou au plus égal au seuil : la sortie de session close et de lead tour est octet pour octet celle d'avant le lot."
    statut: hypothese
    si_faux: "Si un projet doit voir une ligne « mémoire » même saine, la sortie d'avant change : les tests existants des deux commandes le montrent tout de suite."
    tests: ["R6 — sortie de lead tour inchangée sans index", "R6 — sortie de session close inchangée sous le seuil"]
  - id: R7
    cas: [C1]
    enonce: "Le seuil par défaut est 12000 octets ; la clé memory.indexMaxBytes du cadence.yaml du dossier d'invocation le remplace ; une valeur qui n'est pas un entier ≥ 1 est refusée avec le texte du contrat A3."
    statut: hypothese
    si_faux: "Si le bon défaut est autre (l'index de 15,7 Ko a pesé ~8k tokens le 30-10), seule la constante change ; la clé est facultative et son absence ne change aucun comportement existant."
    tests: ["R7 — sans clé : seuil 12000", "R7 — memory.indexMaxBytes: 5000 : seuil 5000", "R7 — memory.indexMaxBytes: 0 ou « abc » : refus avec le message exact"]
  - id: R8
    cas: [C1, C2, C3]
    enonce: "cadence ne modifie jamais la mémoire : la section et la ligne proposent seulement ; le regroupement se fait après l'accord de l'humain, par l'agent, d'après le skill session-close (étape mémoire) et le skill lead."
    statut: sourcee
    source: "skills/session-close/SKILL.md étapes 3 et 5 (rien n'est supprimé sans l'accord de l'humain, propositions seulement) et demande du lot « proposer de regrouper »"
    tests: ["R8 — session close n'écrit aucun fichier sous le dossier de mémoire (empreinte avant/après identique)", "R8 — le skill session-close décrit la proposition et l'accord de l'humain"]
  - id: R9
    cas: [C1, C2]
    enonce: "Un index illisible ne fait jamais échouer la commande : une ligne le dit avec la cause, et la suite du rapport ou du tour est imprimée."
    statut: sourcee
    source: "src/session.ts:138-141 (nettoyage interrompu : un message, la clôture continue) et src/cli.ts:292-294 (une erreur de lecture de cadence.yaml n'arrête pas le tour)"
    tests: ["R9 — MEMORY.md est un dossier : une ligne d'illisibilité, code de sortie inchangé", "R9 — MEMORY.md sans droit de lecture : idem"]
  - id: R10
    cas: [C2]
    enonce: "Avec --json, la sortie de lead tour reste le tableau des lignes de projets, sans champ ni ligne en plus."
    statut: sourcee
    source: "src/cli.ts:265-266 (--json n'imprime que les lignes de projets, les créneaux et verdicts restent hors JSON) ; contrat de sortie JSON existant"
    tests: ["R10 — lead tour --json avec index trop gros : JSON identique à celui sans index"]

contrats:
  - id: A1
    appel: commande cadence session close
    entree: "options existantes (--since, --all, --depth) ; lit MEMORY.md (R1) et memory.indexMaxBytes de cadence.yaml (R7)"
    sortie: "rapport existant ; en plus, quand l'index dépasse le seuil, une section « Mémoire : l'index MEMORY.md pèse <n> octets (seuil <s>) » suivie de la ligne « <k> entrée(s) datée(s) (<b> octets) à regrouper sous une ligne vers un index secondaire — le skill propose, l'humain décide » ; code de sortie inchangé"
    erreurs:
      - { code: log warn, message: "Mémoire : l'index MEMORY.md est illisible (<cause>), sa taille n'est pas contrôlée" }
      - { code: log warn, message: "Mémoire : aucune entrée datée à regrouper dans l'index MEMORY.md" }
    regles: [R1, R2, R3, R4, R5, R6, R7, R8, R9]
  - id: A2
    appel: commande cadence lead tour
    entree: "options existantes ; lit MEMORY.md du dossier parent (R1)"
    sortie: "tableau existant ; en plus, quand l'index dépasse le seuil, une ligne « mémoire · MEMORY.md <n> octets > seuil <s> · <k> entrée(s) datée(s) à regrouper (cadence session close détaille) » après les lignes de worktrees ; --json inchangé"
    erreurs:
      - { code: log warn, message: "mémoire · MEMORY.md illisible (<cause>)" }
    regles: [R1, R2, R3, R4, R6, R8, R9, R10]
  - id: A3
    appel: commande cadence session close (clé memory.indexMaxBytes invalide)
    entree: "cadence.yaml avec memory.indexMaxBytes qui n'est pas un entier ≥ 1"
    sortie: "aucun rapport de mémoire ; le reste de la commande suit sa règle actuelle pour un cadence.yaml invalide"
    erreurs:
      - { code: log warn, message: "cadence.yaml : memory.indexMaxBytes doit être un entier ≥ 1 (octets), pas <valeur>" }
    regles: [R7]

donnees:
  - { id: D1, objet: "~/.claude/projects/<dossier>/memory/MEMORY.md (format de mémoire de Claude Code)", existant: true, modification: aucune, note: "lu seulement : taille et lignes de liste ; jamais écrit par cadence (R8)" }
  - { id: D2, objet: "cadence.yaml, clé facultative memory.indexMaxBytes", existant: false, modification: ajout, note: "absente par défaut : aucun cadence.yaml existant ne change de sens (R6, R7)" }
