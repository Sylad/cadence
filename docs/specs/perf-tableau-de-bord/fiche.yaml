sujet:
  id: perf-tableau-de-bord
  titre: "cadence perf : tableau de bord permanent du workflow (débit, passes de correction, interventions du lead), vitesse toujours à côté de la qualité"
  lot: L225
  perimetre:
    modules: [src/cli.ts, src/corrections.ts, src/lead.ts, src/orchestrate/state.ts]
    endpoints: []
    jobs: []
    hors_perimetre:
      - "tokens par lot, délai création → done → livraison, coût en euros (L226) ; livraisons rouges et en-tête perf de cadence lead tour (L227)"
      - "les lots rouverts : le plan ne date pas la réouverture, aucune fenêtre ne peut la porter (choix du lot, voir R9) ; L227 peut les ajouter"
      - "toute écriture : la commande ne modifie ni journal, ni plan, ni cache"
# Décision que permet chaque indicateur (demande 16-10 : « la fiche doit justifier chaque indicateur par la décision qu'il permet de prendre »).
# Débit : rendus par jour et livrés (le flux baisse-t-il ? alors chercher le goulot avant d'ajouter des lots) ; prêts (la vague produit-elle des lots
#   que le lead n'a pas encore pris ?) ; part sur budget (les allocations de budget sont-elles justes ? sinon relever le plancher, cf. L218) ;
#   jumeau défauts échappés (la vitesse se paie-t-elle en qualité ? alors durcir la revue avant d'accélérer).
# Passes de correction : médiane et part ≥ 2 (la première écriture est-elle assez bonne ? sinon, durcir la fiche ou le brief) ; causes dominantes
#   (quel maillon corriger : spec floue, règle inventée, test manquant…) ; jumeau part conformes du premier coup.
# Interventions du lead : lots rendus puis terminés hors vague (la vague s'arrête-t-elle trop tôt ? le lead la rattrape-t-il à la main ?) ; sessions ux par
#   lot visible (la revue d'ergonomie coûte-t-elle plus d'un tour ? alors renforcer la maquette) ; jumeau défauts échappés.
# Aucun indicateur de volume produit (lignes, commits, tokens comme objectif) : voir R11.

cas:
  - id: C1
    titre: Le lead lit le tableau de bord du workflow
    acteur: le lead
    declencheur: commande cadence perf
    preconditions:
      - "le dossier contient .cadence/runs avec au moins une vague"
      - "le dossier contient des projets à plan raf (lead.ts:100 findProjects)"
    nominal:
      - "La commande lit les wave.json et les journaux <vague>/<projet>--<lot>.json (lecture des journaux de perf et classification des passes partagée avec cadence corrections, R23) et le plan de chaque projet du dossier."
      - "Elle découpe en deux fenêtres de 7 jours : les 7 derniers jours (aujourd'hui compris) et les 7 précédents."
      - "Elle calcule les trois familles d'indicateurs sur chaque fenêtre."
      - "Elle imprime chaque indicateur de vitesse sur la même ligne que son jumeau de qualité, valeur courante, valeur précédente et variation."
      - "Elle sort avec le code 0."
    alternatives:
      - { si: "une fenêtre n'a aucun lot pour un indicateur", alors: "la valeur est n/d et aucun ⚠ n'est posé", regles: [R14] }
      - { si: "le lot du journal n'a pas de lot correspondant dans les plans du dossier", alors: "il compte pour les indicateurs de journal, jamais comme terminé hors vague, et un compte d'orphelins est affiché", regles: [R15] }
      - { si: "un plan est illisible", alors: "le projet est sauté, un avertissement est écrit, les autres projets sont lus", regles: [R16] }
      - { si: "un lot figure dans plusieurs journaux (relancé dans une autre vague)", alors: "chaque journal compte une fois", regles: [R17] }
    resultat: Un tableau à deux colonnes de fenêtres où chaque vitesse est lue avec sa qualité, sans indicateur de volume.
  - id: C2
    titre: Une dégradation de plus de 25 % sur deux fenêtres est signalée par un ⚠
    acteur: le lead
    declencheur: commande cadence perf
    preconditions:
      - "les deux fenêtres portent chacune au moins 5 lots pour l'indicateur"
      - "aucune des deux fenêtres n'est tronquée par --since"
    nominal:
      - "La commande compare la fenêtre courante à la précédente, indicateur par indicateur, dans le sens qui est « pire » pour lui."
      - "Si la dégradation relative dépasse 25 %, la ligne est préfixée par « ⚠ » et finit par la décision que l'indicateur éclaire."
      - "Une cause qui pèse au moins la moitié des passes classées de la fenêtre courante est signalée aussi (goulot net)."
    alternatives:
      - { si: "la dégradation est de 25 % ou moins, ou l'indicateur s'améliore", alors: "pas de ⚠", regles: [R12] }
      - { si: "une fenêtre a moins de 5 lots, ou la valeur précédente est nulle, ou --since tronque une fenêtre", alors: "pas de ⚠ sur tendance, la ligne dit pourquoi", regles: [R13] }
      - { si: "le jumeau de qualité se dégrade de plus de 25 % alors que la vitesse monte", alors: "⚠ sur la ligne du jumeau", regles: [R12, R8] }
      - { si: "une cause pèse au moins la moitié des passes classées (au moins 10 classées)", alors: "⚠ goulot même sans tendance", regles: [R19] }
    resultat: "Le lead voit en une ligne où le workflow se dégrade et quelle décision en découle ; une variation d'une semaine seule ne déclenche rien."
  - id: C3
    titre: Le lead ou un script lit la mesure en données
    acteur: le lead ou un script (le skill lead, L227)
    declencheur: commande cadence perf --json
    preconditions:
      - "les mêmes que C1"
    nominal:
      - "La commande calcule les mêmes valeurs que C1."
      - "Elle imprime un seul objet JSON (fenêtres, indicateurs par famille, avertissements) au lieu du tableau."
    alternatives: []
    sans_alternative: "la sortie JSON ne se distingue de C1 que par sa forme ; ses cas limites (n/d, ⚠, orphelins) sont ceux de C1 et C2 (R14, R15, R12, R13)"
    resultat: "Les mêmes nombres et les mêmes ⚠ sous forme de données."
  - id: C4
    titre: La commande est mal lancée ou n'a rien à lire
    acteur: le lead
    declencheur: commande cadence perf avec un argument invalide ou un dossier sans journal
    preconditions:
      - "la date de --since est illisible, ou plus d'un dossier est donné, ou <dossier>/.cadence/runs n'existe pas, ou le cache de corrections est illisible"
    nominal:
      - "La commande refuse avant de lire quoi que ce soit d'autre."
      - "Elle écrit l'erreur nommée et sort avec le code 1."
    alternatives:
      - { si: "le dossier n'a aucun projet à plan", alors: "les indicateurs de journal sont servis, ceux du plan sont n/d, avec un avertissement", regles: [R16] }
    resultat: "Une erreur qui dit quoi corriger, sans sortie partielle."

regles:
  - id: R1
    cas: [C1]
    enonce: "La commande compare deux fenêtres : les 7 derniers jours (fenêtre courante) et les 7 jours qui les précèdent (fenêtre précédente)."
    statut: sourcee
    source: "titre du lot L225 : « deux fenêtres (7 derniers jours contre les 7 précédents) »"
    tests: ["R1 — deux fenêtres adjacentes de 7 jours : un lot rendu au 8e jour passé tombe dans la précédente, non dans la courante"]
  - id: R2
    cas: [C1]
    enonce: "Une fenêtre est faite de jours calendaires locaux : la courante va d'aujourd'hui − 6 j à aujourd'hui inclus, la précédente d'aujourd'hui − 13 j à aujourd'hui − 7 j. Un horodatage de journal est converti en jour local, un jour de plan (finished, date de note) est pris tel quel. Aujourd'hui est injectable pour les tests."
    statut: hypothese
    si_faux: "Si les fenêtres devaient être glissantes à l'heure près, seules les bornes changent d'au plus un jour ; aucune donnée ni contrat en jeu."
    tests: ["R2 — un lot rendu à 23:50 le jour J−6 est dans la courante, à 23:50 le jour J−7 dans la précédente", "R2 — un jour de plan J−7 (finished) est dans la précédente"]
  - id: R3
    cas: [C1, C2]
    enonce: "--since <date ISO> ignore tout ce qui est antérieur à ce jour dans les deux fenêtres (une vague créée avant ou une date de lot antérieure n'est pas lue) ; une fenêtre dont le premier jour précède --since est dite tronquée : ses taux par jour se divisent par les jours couverts et elle ne porte aucun ⚠ (R13)."
    statut: hypothese
    si_faux: "Si --since devait avancer l'ancre des fenêtres (fin à since + 14 j, ou durée = aujourd'hui − since), seul le sens de l'option change ; la commande est nouvelle, aucun usage publié."
    tests: ["R3 — --since au milieu de la précédente : les lots avant la date sont ignorés et la précédente est dite tronquée", "R3 — --since antérieur aux deux fenêtres : résultat identique au lancement sans option"]
  - id: R4
    cas: [C1]
    enonce: "Débit : lots prêts = journaux au statut ready, lots rendus = journaux ready, handed-back ou failed (orchestrate/state.ts:181 lotFinished), rendus par jour = rendus de la fenêtre ÷ ses jours, livrés = lots des plans au statut done dont finished tombe dans la fenêtre. Un journal est daté par la fin de sa dernière étape (le plus grand ended), à défaut par le champ created de son wave.json ; un journal sans date lisible est écarté. Les champs status, budget, tokens.counted et ended viennent du journal lu par le lecteur de journaux de perf (R23)."
    statut: hypothese
    si_faux: "Si « prêts » devait désigner le stock de lots à prendre dans le plan (todo débloqués), seul le calcul de cet indicateur change (lecture de lead.ts nextUp) ; aucun contrat en jeu."
    tests: ["R4 — rendus par jour : 7 lots ready+handed-back+failed sur 7 jours = 1/jour", "R4 — livrés compte le plan done daté dans la fenêtre, pas les journaux", "R4 — un journal sans ended utilise la création de la vague, sans date : écarté"]
  - id: R5
    cas: [C1]
    enonce: "Part des rendus sur budget = rendus de la fenêtre dont la somme des tokens comptés de toutes les étapes (tokens.counted) ne dépasse pas le champ budget du journal, sur les rendus qui portent un budget ; un journal sans budget est hors du dénominateur."
    statut: hypothese
    si_faux: "Si la dépense devait ne compter que les étapes réussies, seul le numérateur bouge ; aucune donnée en jeu."
    tests: ["R5 — un lot à 450 k de budget et 460 k comptés n'est pas sur budget", "R5 — un journal sans budget n'entre pas au dénominateur"]
  - id: R6
    cas: [C1]
    enonce: "Passes de correction par lot : sur les lots dont une session implement a abouti et dont le cycle est fini (statut ready, handed-back ou failed, R4) et dont la date de rendu (R4) tombe dans la fenêtre, la médiane du nombre de passes fix abouties (étapes kind fix, status ok) et la part des lots à au moins 2 passes. Définition de la passe identique à cadence corrections (corrections.ts:111-120) : perf n'en a pas d'autre, la passe vient de la lecture partagée avec corrections (R23). Les bornes des deux fenêtres (R1, R2) sont des paramètres de la fonction de calcul, la commande les dérive d'aujourd'hui et de --since ; un appel peut donc poser les deux fenêtres où il veut."
    statut: sourcee
    source: "titre du lot (« passes de correction par lot (médiane, part ≥ 2…) ») ; définition de la passe : src/corrections.ts:111-120 (pas fix abouti), docs/corrections.md"
    tests: ["R6 — médiane de 0,0,1,3 passes = 0,5 et part ≥ 2 = 50 %", "R6 — un lot sans implement abouti n'entre pas", "R6 — la fonction de calcul reçoit les bornes en paramètre : posées sur toute l'étendue des journaux (fenêtre courante de la création de la première vague à maintenant, précédente vide placée avant), sur des journaux tous finis, le total de passes égale celui de cadence corrections sans borne ; un lot non fini ou une passe hors des bornes posées fait la différence et n'est compté que par corrections"]
  - id: R7
    cas: [C1]
    enonce: "Causes dominantes : les passes des lots finis (implement abouti, cycle fini, R6) sont rangées dans une fenêtre par la date de FIN de leur étape fix (à défaut, par la date de rendu de leur lot, R4), indépendamment de la date de rendu de leur lot : un lot rendu dans la fenêtre courante dont une passe fix date de la veille de la fenêtre compte dans R6 (par lot) de la courante et sa passe compte dans la précédente de R7. La classification mécanique de chaque passe est celle de cadence corrections (R23) : passe sans constat (aucun constat dans la revue précédente, ou constats déjà traités par une passe intermédiaire) comptée à part « sans-constat » ; passe à constats classée avec le cache de corrections <dossier>/.cadence/corrections.json (corrections.ts:250 readCache ; cause manuelle prioritaire), « non-classe » quand elle est absente du cache. La commande affiche les 3 premières causes avec leur part des passes classées et la part non classée, sans appeler aucun modèle."
    statut: sourcee
    source: "titre du lot : « causes dominantes du cache de corrections », « sans modèle » ; src/corrections.ts:60-86 (clé de passe, priorité de manual), :165 (sans-constat quand p.findings est vide). La date de rangement de la passe en fenêtre est une lecture du lead."
    tests: ["R7 — trois causes en tête avec leur part, la part non classée affichée à part", "R7 — un lot rendu dans la fenêtre courante dont une passe fix date de la veille de la fenêtre : le lot compte dans R6 de la courante, la passe compte dans les passes de la précédente (date de fin de l'étape fix, non date de rendu du lot)", "R7 — aucun appel réseau : la commande tourne avec OLLAMA_HOST injoignable", "R7 — le cache absent donne 100 % non classé sans erreur"]
  - id: R8
    cas: [C1, C2]
    enonce: "Chaque indicateur de vitesse est imprimé sur la même ligne que son jumeau de qualité, jamais seul : débit (prêts, livrés, rendus par jour, part sur budget) ↔ défauts échappés ; passes de correction ↔ part des lots conformes du premier coup (lots rendus sans aucune passe fix, corrections.ts:111) ; interventions du lead ↔ défauts échappés. Un ⚠ peut aussi porter sur le jumeau."
    statut: sourcee
    source: "note du lot 16-10, principe (1) VITE ET BIEN ; le jumeau des interventions (défauts échappés) est une extension du lead, non dite par la note"
    tests: ["R8 — la ligne de débit contient la valeur de défauts échappés", "R8 — la ligne des passes contient la part conforme du premier coup", "R8 — la sortie --json lie chaque indicateur de vitesse à son jumeau"]
  - id: R9
    cas: [C1]
    enonce: "Défauts échappés d'une fenêtre = nombre de lots distincts (clé de R10) ayant, dans la fenêtre, une note de plan dont la date est dans la fenêtre, dont le texte (hors préfixe de date « JJ-MM », « JJ-MM hh:mm » et séparateur « : ») commence par « QA » et contient « bloquant » ou « majeur » non précédé de « 0 » ou « aucun », sur un lot déjà terminé à la date de la note (finished ≤ date de la note). Les notes réelles du plan commencent par la date (docs/plan/raf.yaml:2570, 2585) et aucune n'a encore la forme « QA … bloquant/majeur » : tant qu'aucune note des plans lus ne correspond, sur toute leur histoire, l'indicateur est n/d avec la mention « aucune note QA reconnue : convention à fixer (L227) », jamais 0, et ne porte aucun ⚠ (R14). Les lots rouverts ne sont pas comptés : le plan ne date pas la réouverture."
    statut: hypothese
    si_faux: "Si les notes QA devaient porter la gravité dans un champ lisible ou une autre formule, seule la reconnaissance du texte change (L227 fixe la convention du constat QA) ; l'indicateur reste n/d d'ici là au lieu d'afficher un 0 trompeur ; aucune donnée n'est écrite."
    tests: ["R9 — une note « 16-10 : QA … 1 bloquant » datée dans la fenêtre sur un lot terminé compte un défaut", "R9 — « 0 défaut » et « aucun bloquant » ne comptent pas", "R9 — une note QA datée avant finished ne compte pas", "R9 — plans sans aucune note reconnue : valeur n/d (null) avec la mention, pas 0 et pas de ⚠", "R9 — sur docs/plan/raf.yaml réel du dépôt, le décompte égale celui d'une expression indépendante sur le texte des notes (n/d si zéro)"]
  - id: R10
    cas: [C1]
    enonce: "Interventions du lead : (a) lot rendu par une vague puis terminé hors vague = journal handed-back ou failed qui est le DERNIER journal du lot (par date de rendu, R4) parmi tous ceux du dossier, dont le lot du plan (clé ci-dessous) est done avec finished ≥ le jour du rendu ; un lot rejoué (R17) dont un journal plus récent est ready, ou encore en cours, n'est pas une intervention. Affiché en nombre et en part des lots rendus de la fenêtre (journaux de rendu daté dans la fenêtre). Clé de jointure journal ↔ plan : le projet du journal (champ project, nom du projet, state.ts:74 et lotKey) égale le chemin du dossier du projet relatif au dossier de perf, séparateurs « / » (le basename pour un projet direct, « groupe/gamma » pour un projet imbriqué, comme continue.ts:79 et lotSlug state.ts:190) ; l'id du lot se lit dans le champ lot du journal, jamais dans le nom de fichier (le slug remplace « / » par « __ ») ; il égale l'id d'un lot du plan, à défaut, pour un id « <lot>/<sous-tâche> », l'id de son lot parent (la partie avant le premier « / »). Un journal sans correspondance est orphelin (R15). (b) sessions ux par lot visible = étapes ux abouties (kind ux, status ok) des journaux visible, sur le nombre de lots rendus visibles de la fenêtre."
    statut: sourcee
    source: "titre du lot : « lots rendus par une vague puis terminés hors vague, sessions ux par lot visible » ; statuts : orchestrate/state.ts:181 (lotFinished), table.ts:17 ; clés : orchestrate/state.ts:74, 188-190, orchestrate/continue.ts:79. Le choix du dernier journal et du repli sur le lot parent est une lecture du lead pour lever les cas non prévus."
    tests: ["R10 — handed-back dont le plan est done après le rendu = 1 intervention", "R10 — handed-back encore doing n'est pas compté comme terminé", "R10 — 3 sessions ux sur 2 lots visibles = 1,5", "R10 — un lot ready terminé par la vague n'est pas une intervention", "R10 — lot rejoué : handed-back en vague 1 puis ready en vague 2, plan done : aucune intervention", "R10 — un projet imbriqué « groupe/gamma » se joint à son plan ; un projet direct se joint par son nom", "R10 — un lot « Q4/accueil-4-ux12 » du journal se joint au lot Q4 du plan, l'id lu dans le champ lot et non dans le nom de fichier"]
  - id: R11
    cas: [C1, C3]
    enonce: "Aucun indicateur de volume produit (lignes de code, nombre de commits, tokens consommés comme objectif) n'est imprimé ni exposé en JSON ; les tokens ne servent qu'à rapporter un lot à son budget (R5)."
    statut: sourcee
    source: "note du lot 16-10, principe (2)"
    tests: ["R11 — la sortie JSON n'a aucune clé de lignes, de commits ni de tokens consommés au total", "R11 — le texte n'imprime aucun nombre de commits ni de lignes"]
  - id: R12
    cas: [C2]
    enonce: "Un indicateur est en dégradation quand sa valeur courante est pire que la précédente de plus de 25 % relatif (|courante − précédente| ÷ précédente > 0,25, dans le sens pire) ; pire = baisse pour rendus par jour, livrés, part sur budget, part du premier coup ; hausse pour la médiane de passes, la part ≥ 2, la part terminée hors vague, les sessions ux par lot visible, les défauts échappés. La ligne est alors préfixée « ⚠ » et finit par la décision que l'indicateur éclaire (commentaire de cette fiche). Les lots prêts n'ont pas de ⚠."
    statut: sourcee
    source: "titre du lot : « ⚠ sur une dégradation de plus de 25 % » ; le sens pire de chaque indicateur est une lecture du lead (principe 4 de la note)"
    tests: ["R12 — rendus par jour 1,0 → 0,7 : ⚠ ; 1,0 → 0,8 : pas de ⚠", "R12 — médiane de passes 1 → 1,5 : ⚠ ; 1 → 0,5 : pas de ⚠", "R12 — pile 25 % : pas de ⚠", "R12 — la ligne ⚠ finit par la décision de l'indicateur"]
  - id: R13
    cas: [C2]
    enonce: "Pas de ⚠ sur tendance quand l'une des deux fenêtres porte moins de 5 lots pour l'indicateur, quand la valeur précédente est nulle (variation relative indéfinie), ou quand --since tronque une fenêtre ; la ligne dit alors « pas de tendance : échantillon » ou « fenêtre tronquée »."
    statut: hypothese
    si_faux: "Si le seuil d'échantillon devait être autre que 5, seule la constante change ; aucune donnée en jeu. Principe sourcé : un ⚠ ne vaut que sur deux fenêtres (note 16-10, principe 3)."
    tests: ["R13 — 4 lots dans la courante : pas de ⚠ malgré −50 %", "R13 — valeur précédente 0 : pas de ⚠, pas de division par zéro", "R13 — fenêtre tronquée par --since : pas de ⚠ et mention"]
  - id: R14
    cas: [C1, C2, C3]
    enonce: "Une fenêtre sans lot pour un indicateur donne la valeur n/d (null en JSON) ; une médiane ou une part sur zéro lot n'est jamais 0, et un n/d ne porte aucun ⚠."
    statut: hypothese
    si_faux: "Si un 0 était préféré, un n/d serait lu comme une chute de 100 % et déclencherait un ⚠ à tort ; seul l'affichage change."
    tests: ["R14 — fenêtre précédente vide : n/d et pas de ⚠", "R14 — médiane de passes sans lot = null en JSON, jamais 0"]
  - id: R15
    cas: [C1, C3]
    enonce: "Un lot de journal sans lot correspondant dans les plans du dossier (projet absent du dossier, lot inconnu, clé de R10 sans correspondance) compte pour les indicateurs de journal, ne compte jamais comme terminé hors vague (R10) ni comme livré ; leur nombre est affiché (« N lot(s) de journal sans plan »)."
    statut: hypothese
    si_faux: "Si un orphelin devait être écarté de tout, seuls les dénominateurs changent ; aucune donnée en jeu."
    tests: ["R15 — un journal d'un projet absent du dossier est compté orphelin, hors terminé hors vague", "R15 — le compte d'orphelins est imprimé"]
  - id: R16
    cas: [C1, C4]
    enonce: "Un plan illisible ou un dossier sans plan ne fait pas échouer la commande : le projet est sauté (comme lead.ts:118 tourRow, qui attrape l'erreur), un avertissement est écrit sur la sortie d'erreur, les indicateurs qui lisent le plan (livrés, terminé hors vague, défauts échappés) sont n/d ; ceux du journal restent servis."
    statut: sourcee
    source: "src/lead.ts:118-120 (tourRow lit le plan sous try, un projet en échec n'arrête pas les autres)"
    tests: ["R16 — un plan illisible : avertissement, autres projets lus", "R16 — aucun plan : indicateurs de journal servis, ceux du plan n/d"]
  - id: R17
    cas: [C1]
    enonce: "Chaque fichier journal <vague>/<projet>--<lot>.json compte une fois ; un lot rejoué dans une autre vague compte autant de fois qu'il a de journaux, dans la fenêtre de sa fin de cycle. Une vague sans wave.json lisible est écartée de tous les indicateurs (sa date de création manque) ; un journal sans steps lisible est écarté de tous les indicateurs ; un journal sans session implement aboutie n'est écarté que des indicateurs de passes (R6, R7 ; comme corrections.ts:112), pas du débit ni des interventions (R4, R10, R23)."
    statut: sourcee
    source: "src/corrections.ts:100-120 (readRuns : un journal = un lot compté, wave.json illisible écarté)"
    tests: ["R17 — un lot rejoué dans deux vagues est compté deux fois", "R17 — un wave.json illisible écarte la vague sans échec", "R17 — un journal sans steps est ignoré", "R17 — un journal failed sans implement reste dans le débit (R4) et est écarté des passes"]
  - id: R18
    cas: [C1, C3, C4]
    enonce: "La commande est sans modèle et en lecture seule : elle n'écrit ni journal, ni plan, ni cache, n'appelle aucun service, sort avec 0 même quand un ⚠ est imprimé (un ⚠ n'est pas une erreur), et 1 sur une erreur de saisie ou de lecture (RafError)."
    statut: hypothese
    si_faux: "Si le code de sortie devait refléter les ⚠ (non zéro), un script qui enchaîne la commande échouerait ; seul le code de sortie change."
    tests: ["R18 — après la commande, l'arbre du dossier est inchangé (aucun fichier créé ni modifié)", "R18 — un ⚠ imprimé et le code de sortie vaut 0", "R18 — aucun appel à fetch"]
  - id: R19
    cas: [C2]
    enonce: "Goulot net : une cause qui pèse au moins la moitié des passes classées de la fenêtre courante (passes rangées selon R7, classification mécanique de R23 : une passe sans-constat n'est pas classée, une passe à constats absente du cache non plus), avec au moins 10 passes classées, est signalée par un ⚠ même sans tendance, avec la décision « quel maillon corriger »."
    statut: hypothese
    si_faux: "Si le seuil (50 %, 10 passes) était autre, seules ces deux constantes changent ; sans goulot net, L227 ne proposerait un lot que sur tendance."
    tests: ["R19 — 6 passes de bug-code sur 10 classées : ⚠ goulot", "R19 — 5 sur 9 classées : pas de ⚠ (moins de 10)", "R19 — 4 sur 10 : pas de ⚠", "R19 — fenêtre de 10 passes dont 5 tests rouges sans cache et 5 à constats classées bug-code au cache : les 5 tests rouges sont sans-constat (comme chez cadence corrections), 5 passes classées seulement : pas de ⚠ goulot"]
  - id: R20
    cas: [C3]
    enonce: "Avec --json la sortie est un objet unique { since, today, windows: { current: { from, to, days }, previous: { … } }, throughput, corrections, interventions, warnings }, où chaque indicateur porte { current, previous, change, warn, twin }, n/d = null ; mêmes valeurs que le texte."
    statut: hypothese
    si_faux: "Si le skill lead (L227) attend une autre forme, seules les clés changent avant qu'il ne la lise ; la commande est nouvelle, aucun lecteur publié."
    tests: ["R20 — --json imprime un seul objet JSON parsable avec les clés windows, throughput, corrections, interventions, warnings", "R20 — chaque indicateur porte current, previous, change, warn, twin", "R20 — les nombres du JSON égalent ceux du texte"]
  - id: R21
    cas: [C4]
    enonce: "Erreurs de saisie : plus d'un dossier → usage ; --since illisible → message comme cadence corrections ; <dossier>/.cadence/runs absent → « perf : aucun journal de vague dans <chemin> » ; cache de corrections présent mais illisible → l'erreur de readCache, sans sortie partielle."
    statut: sourcee
    source: "src/cli.ts:851, 854, 858 (mêmes contrôles de cadence corrections) et src/corrections.ts:250 (readCache refuse un fichier illisible)"
    tests: ["R21 — deux dossiers : usage", "R21 — --since pas-une-date : message d'invalidité", "R21 — dossier sans .cadence/runs : « perf : aucun journal de vague dans … »", "R21 — corrections.json illisible : l'erreur de readCache, rien sur la sortie"]
  - id: R22
    cas: [C1]
    enonce: "Le dossier se donne en argument facultatif (cadence perf [dossier], défaut le dossier courant) comme cadence corrections ; les projets lus sont ceux de findProjects(dossier, 2) (un niveau d'imbrication, pour les projets « groupe/gamma ») ; l'aide de cadence liste la commande."
    statut: hypothese
    si_faux: "Si la commande ne devait lire que le dossier courant, l'argument disparaît ; aucune donnée en jeu."
    tests: ["R22 — cadence perf <dossier> lit les journaux de ce dossier", "R22 — un projet à un niveau d'imbrication est lu", "R22 — l'aide liste « cadence perf [dossier] [--since date] [--json] »"]

  - id: R23
    cas: [C1, C3]
    enonce: "perf réutilise la lecture de cadence corrections, jamais un lecteur de rapports à lui : les passes et leur classification mécanique viennent des mêmes fonctions du module src/corrections.ts que cadence corrections (lecture des journaux, findingsOf sur le rapport de la revue précédente, règle handled, règle sans-constat quand la passe n'a aucun constat, corrections.ts:111-122 et :165). La lecture partagée est exportée et appelée par readRuns et par perf, avec la sortie de readRuns inchangée ; elle rend en plus, par passe, la date de fin de son étape fix, et par journal ce dont perf a besoin (project, lot, visible, status, budget, tokens.counted de chaque étape, date de création de la vague, ended de chaque étape, kind, status, n, commits), et rend TOUS les journaux lisibles, y compris ceux en échec ou rendus avant toute session implement aboutie : seuls un wave.json illisible ou un journal illisible écartent un journal (R17). Le filtre « session implement aboutie » de readRuns (corrections.ts:112) ne s'applique qu'aux indicateurs de passes (R6, R7), par un prédicat appliqué par readRuns et par perf à la sortie du lecteur, jamais dans le lecteur ; ainsi un lot failed dès l'implement entre dans les rendus (R4), la part sur budget et le terminé hors vague (R10), mais pas dans R6/R7. Résultat : pour une même passe, perf et cadence corrections rendent la même classification mécanique (sans-constat, ou à constats) ; le cache ne porte que la cause par modèle (--classify) des passes à constats, une passe à constats absente du cache est non-classe chez les deux. cadence corrections ne change ni de sortie ni de test."
    statut: hypothese
    si_faux: "Si perf devait avoir son propre lecteur de rapports, sa classification mécanique pourrait diverger de celle de cadence corrections (une passe sans constat rangée non-classe) et fausser R7 et R19 ; le risque inverse est de toucher la sortie de cadence corrections en partageant le code, d'où la sortie de readRuns figée par test."
    tests: ["R23 — lot failed sans implement : compté dans rendus par jour, part sur budget et terminé hors vague, absent de R6 et R7", "R23 — le lecteur partagé rend status, budget, tokens.counted et ended d'un journal, et la date de fin de l'étape fix d'une passe", "R23 — readRuns et cadence corrections donnent la même sortie qu'avant sur les mêmes journaux", "R23 — une passe de tests rouges (fix juste après une autre passe fix, sans cache) est sans-constat pour perf comme pour cadence corrections", "R23 — une passe à constats absente du cache est non-classe pour perf comme pour cadence corrections", "R23 — une passe sans revue précédente lisible est sans-constat pour perf comme pour cadence corrections"]

contrats:
  - id: A1
    appel: commande perf
    entree: "cadence perf [dossier] [--since date ISO] [--json]"
    sortie: "texte : un tableau à deux fenêtres (courante, précédente) où chaque ligne de vitesse porte son jumeau de qualité, les ⚠ et les décisions ; --json : un objet unique (R20) ; code de sortie 0"
    erreurs:
      - { code: log error, message: "usage : cadence perf [dossier] [--since date] [--json]" }
      - { code: log error, message: "--since invalide : <valeur> (une date ISO, ex. 2026-10-10T18:31Z)" }
      - { code: log error, message: "perf : aucun journal de vague dans <dossier>/.cadence/runs" }
      - { code: log error, message: "<fichier> : JSON illisible (un objet clé → classement est attendu), corrigez ou supprimez le fichier" }
      - { code: log warn, message: "perf : plan illisible, projet <projet> sauté" }
    regles: [R1, R2, R3, R4, R5, R6, R7, R8, R9, R10, R11, R12, R13, R14, R15, R16, R17, R18, R19, R20, R21, R22, R23]

donnees:
  - { id: D1, objet: ".cadence/runs/<vague>/wave.json et <projet>--<lot>.json (wave.json created ; journal : project, lot, visible, status, budget, steps[kind, status, n, ended, tokens.counted])", existant: true, modification: aucune, note: "lus en lecture seule, format inchangé (orchestrate/state.ts)" }
  - { id: D2, objet: "plans raf des projets du dossier (status, finished, notes)", existant: true, modification: aucune, note: "lus en lecture seule via le chargeur de plan" }
  - { id: D3, objet: ".cadence/corrections.json (cache des causes de passes)", existant: true, modification: aucune, note: "lu seul, jamais réécrit (la classification reste l'affaire de cadence corrections --classify)" }
