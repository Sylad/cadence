sujet:
  id: orchestrate-worktree-par-lot
  titre: "orchestrate : un worktree par lot dans une vague — deux lots indépendants d'un même dépôt avancent en parallèle (étude de faisabilité)"
  lot: L279
  perimetre:
    modules: [src/orchestrate/pool.ts, src/orchestrate/command.ts, src/orchestrate/cycle.ts, src/orchestrate/lock.ts, src/orchestrate/registry.ts, src/config.ts]
    endpoints: []
    jobs: []
    hors_perimetre:
      - "le verrou d'orchestration du dépôt (REPO_LOCK, lock.ts:26) : une seule VAGUE par dépôt, inchangé ; seul le « un seul lot à la fois » interne à la vague tombe"
      - "les lots qui partagent un dépôt voisin (repos:, L62) : restent à la suite les uns des autres (R2), aucun worktree de voisin"
      - "le plafond de sessions toutes vagues confondues (--max-sessions, registre des créneaux) : inchangé, c'est lui qui borne le parallélisme"
      - "le push et le déploiement : jamais faits par orchestrate (hook pre-push de garde inchangé) ; la livraison par `cadence deliver` reste au lead"
      - "la résolution d'un conflit de fusion : rendue au lead, jamais tentée par le programme"
      - "la prévention des conflits (prédire quels fichiers deux lots touchent) : non faite, les conflits sont constatés à l'intégration"

cas:
  - id: C1
    titre: "Une vague joue deux lots indépendants du même dépôt en parallèle, chacun dans son worktree"
    acteur: le lead
    declencheur: "commande cadence orchestrate <projet>:<lotA> <projet>:<lotB> (orchestrate.worktrees: true, --max-sessions 2 au moins)"
    preconditions:
      - "les deux lots sont du même dépôt (sans dépôt voisin partagé), sans dependsOn entre eux"
      - "le dépôt est sur une branche, son arbre n'a aucun fichier suivi modifié, aucune autre orchestration ne le tient"
      - "le plafond de sessions libre laisse au moins deux créneaux"
    nominal:
      - "Les gardes de départ passent comme aujourd'hui (command.ts:358-365), une fois par dépôt ; le verrou de dépôt est pris une fois pour la vague (command.ts:850)."
      - "Quand un lot prend son créneau de session (et non au lancement de la vague : un lot qui attend un créneau n'a pas de worktree), le programme crée sa branche propre `cadence/<vague>/<slug du lot>` au sommet courant de la branche du dépôt, et son worktree par `git worktree add -b` hors du dépôt."
      - "Les dépendances ignorées (node_modules…) sont reliées dans le worktree comme pour le worktree jetable de base (cycle.ts:219-240)."
      - "Le lot joue tout son cycle (spec, accept, implement, revues, corrections) avec le worktree comme dépôt : ses commits de travail, son arbre propre et son contrôle de HEAD sont ceux du worktree ; son plan ne l'est jamais : toutes les écritures de plan du lot sont faites par le programme dans le checkout principal du dépôt, en série (R21, R26), la branche du lot ne porte que du travail."
      - "Le pool lance les deux lots ensemble, chacun prenant un créneau ; sans créneau libre, le second attend."
      - "Au « prêt » de chaque lot, le programme l'intègre à la branche du dépôt (C2)."
    alternatives:
      - { si: "orchestrate.worktrees absent ou false", alors: "comportement actuel : une file par dépôt, un lot à la fois dans le dépôt lui-même", regles: [R1] }
      - { si: "le dépôt est en HEAD détaché, ou un des lots a un dépôt voisin partagé avec l'autre", alors: "ces lots restent à la suite les uns des autres dans le dépôt, avec un avertissement", regles: [R2] }
      - { si: "un lot dépend de l'autre (dependsOn)", alors: "il attend que son prédécesseur soit ready, ce qui n'arrive qu'après son intégration (R22), puis part du sommet de la branche qui le contient", regles: [R4, R22] }
      - { si: "un seul créneau de session est libre", alors: "les lots s'enchaînent sans erreur, un worktree à la fois en session", regles: [R3] }
      - { si: "la création du worktree ou de la branche échoue (branche existante, disque plein, index.lock)", alors: "le lot est rendu avec la cause, les autres lots continuent", regles: [R5] }
    resultat: "Deux lots indépendants d'un même dépôt avancent en parallèle dans la limite des créneaux, sans que L261 (4 corrections) fasse attendre les autres lots du dépôt."
  - id: C2
    titre: "Un lot prêt est intégré à la branche du dépôt"
    acteur: le programme (fin de cycle d'un lot)
    declencheur: "la fin du cycle d'un lot dans son worktree, juste avant la transition à ready (cycle.ts:2009)"
    preconditions:
      - "le lot a un worktree et une branche propres, verdict de revue conforme enregistré sur la branche du lot"
      - "la branche du dépôt est toujours celle sur laquelle les lots sont partis"
    nominal:
      - "Le programme prend le verrou d'intégration du dépôt (un seul lot s'intègre ou écrit le plan à la fois ; attente bornée pour les autres, R25)."
      - "Si la branche du dépôt n'a pas bougé depuis le départ du lot, la branche avance en fast-forward (aucun sha ne change). Les commits de plan que le programme fait dans le checkout principal (R21) et l'intégration des autres lots la font bouger : le rebase est le cas courant, le fast-forward pur celui d'un lot parti d'un sommet resté le même."
      - "Sinon la branche du lot est rebasée sur le sommet courant de la branche du dépôt, puis avance en fast-forward."
      - "Quand le rebase a changé les commits, le programme compare le patch-id stable du diff du lot avant et après (git patch-id --stable, diff cumulé de la base au sommet du lot)."
      - "Patch-id identique : les tests et le build sont rejoués au sommet intégré ; verts, le verdict de revue sera enregistré au sha intégré, avec une trace qui cite l'ancien sha relu et le nouveau."
      - "Patch-id différent : tests et build rejoués, puis une revue courte (review-small) du diff rebasé est jouée avant l'avance ; sans bloquant ni majeur, son verdict sera enregistré au sha intégré."
      - "La branche du dépôt avance (fast-forward). Toujours sous le même verrou, le programme écrit alors dans le checkout principal l'entrée du lot dans le plan, en un commit de plan seul : verdict au sha intégré (avec la trace `reporte` si les shas ont changé), sous-tâches couvertes passées à done ; pour un plan en lecture seule, il lance l'outil orchestrate.verdict du projet dans le checkout principal (R21, R23)."
      - "Le worktree et la branche du lot, propres et fusionnés, sont retirés ; une ligne de journal dit les shas intégrés."
      - "Seulement alors le lot passe à ready : l'intégration précède la transition (R22). Aucun champ n'est ajouté au lot : l'étape d'intégration est la valeur `integrate` du champ existant `next` (R14)."
    alternatives:
      - { si: "le rebase rencontre un conflit (non résolu automatiquement)", alors: "rebase abandonné, lot rendu au lead avec les fichiers en conflit, worktree et branche conservés ; aucune session ne résout le conflit", regles: [R6] }
      - { si: "les contrôles rejoués sont rouges au sommet intégré", alors: "la branche du dépôt n'avance pas, lot rendu avec les échecs", regles: [R7] }
      - { si: "l'arbre du dépôt (celui du lead) a des fichiers suivis modifiés au moment de l'avance", alors: "pas d'avance, lot rendu, branche du lot conservée", regles: [R8] }
      - { si: "le rebase est non vide et le patch-id du diff du lot est identique avant/après", alors: "verdict reporté au sha intégré, tracé (ancien sha relu, nouveau sha), sans nouvelle revue", regles: [R9] }
      - { si: "le rebase est non vide et le patch-id diffère (contexte modifié, conflit déjà résolu à la main)", alors: "revue courte du diff rebasé avant l'intégration ; un bloquant ou un majeur rend le lot au lead", regles: [R17] }
      - { si: "raf done lit le verdict reporté écrit à l'intégration", alors: "la porte est inchangée : `vers` est le dernier commit de travail intégré, elle ne trouve aucun commit non relu ; la trace `reporte` est informative et n'ouvre aucune exception", regles: [R18] }
      - { si: "un autre lot s'intègre déjà", alors: "le lot attend le verrou d'intégration, sans bloquer les sessions des autres", regles: [R10] }
      - { si: "l'attente du verrou d'intégration dépasse la borne", alors: "lot rendu, worktree et branche conservés, branche du dépôt inchangée", regles: [R25] }
      - { si: "le dépôt du lead n'est plus sur la branche de départ de la vague", alors: "pas d'avance ni de changement de branche, lot rendu, branche du lot conservée", regles: [R24] }
      - { si: "le plan du projet est modifié par plusieurs lots (statuts, notes, sous-tâches, verdicts ; plan en lecture seule ; plan hors du dépôt)", alors: "le plan n'est jamais écrit sur une branche de lot : le programme l'écrit seul, dans le checkout principal, en série (R21, R26) ; aucun conflit de plan au rebase, rien à rejouer ; une session qui touche le plan dans son worktree fait rendre le lot", regles: [R21, R26] }
      - { si: "une écriture de plan est refusée (dépôt hors de la branche de départ, fichier suivi modifié hors plan dans le checkout principal, verrou tenu au-delà de la borne)", alors: "lot rendu avec la cause, rien commité, le lot reprend à l'étape qu'il avait atteinte", regles: [R26] }
      - { si: "l'intégration échoue ou est refusée", alors: "le lot n'est jamais passé à ready : il est rendu, ses dépendants le sont aussi", regles: [R22] }
      - { si: "le verdict est reporté ou enregistré après le rebase", alors: "il l'est dans un commit de plan seul de la branche du dépôt, après l'avance, et désigne le dernier commit de travail intégré", regles: [R23] }
    resultat: "La branche du dépôt reçoit les lots un par un, sur un historique linéaire ; aucun commit, aucune note ni aucun statut de plan n'est perdu, aucun conflit n'est résolu à l'aveugle."
  - id: C3
    titre: "Le lead reprend une vague interrompue qui laissait des worktrees"
    acteur: le lead
    declencheur: commande cadence orchestrate --resume <vague>
    preconditions:
      - "la vague a été interrompue (processus tué, quota, budget) ou a rendu des lots avec leurs worktrees conservés"
    nominal:
      - "Pour chaque lot repris, le worktree et la branche déterministes du lot sont retrouvés et réutilisés tels quels (commits et arbre du lot intacts)."
      - "Un worktree enregistré par git mais dont le dossier a disparu est élagué puis recréé sur la branche existante."
      - "Les lots rendus, avec worktree conservé, restent tels quels jusqu'à ce que le lead les règle : un lot rendu à l'étape d'intégration n'est rejoué que si le lead le nomme (--resume <vague> --integrate <projet>:<lot>, R27), sinon il reste rendu ; ou retrait (R20)."
    alternatives:
      - { si: "le worktree du lot a un arbre sale que le cycle n'a pas laissé", alors: "même refus qu'un dépôt sale (code 2), avant toute écriture", regles: [R11] }
      - { si: "le lot est retiré par --drop", alors: "son worktree et sa branche sont conservés, une ligne dit où", regles: [R12] }
      - { si: "le lead consulte cadence orchestrate --status ou cadence lead tour", alors: "les worktrees conservés sont listés (dépôt, lot, âge, commits non intégrés)", regles: [R19] }
      - { si: "le lead nomme un lot rendu à l'étape d'intégration avec --integrate", alors: "le lot est repris à l'intégration (rebase, contrôles, avance) ; un lot non rendu à cette étape, ou retiré par --drop, est refusé (code 2)", regles: [R27, R14, R25] }
      - { si: "le lead retire un worktree conservé", alors: "refus tant qu'un commit n'est ni intégré ni confirmé abandonné", regles: [R20] }
    resultat: "Une reprise ne perd ni commit ni worktree de lot, et ne laisse pas de worktree orphelin non signalé."
  - id: C4
    titre: "Une seconde vague vise le dépôt pendant que la première y a des worktrees"
    acteur: le lead
    declencheur: "commande cadence orchestrate <projet>:<lot> lancée dans une autre vague"
    preconditions:
      - "une vague vivante tient le verrou du dépôt"
    nominal:
      - "La seconde vague est refusée avant toute écriture, comme aujourd'hui (command.ts:364-366), sans créer de worktree."
    alternatives: []
    sans_alternative: "le seul échec est le refus du verrou, déjà couvert par R13 ; le cas n'a pas d'autre branche"
    resultat: "Une seule vague par dépôt, même quand elle y a plusieurs worktrees."

regles:
  - id: R1
    cas: [C1]
    enonce: "Les worktrees par lot ne s'activent que par la clé orchestrate.worktrees: true de cadence.yaml ; absente ou false, la vague se comporte exactement comme avant (une file par dépôt, lots à la suite dans le dépôt)."
    statut: hypothese
    si_faux: "Si le parallèle doit être le défaut, seule la valeur par défaut de la clé change (config.ts, une ligne) ; l'activation progressive protège les vagues en cours le temps de roder la fusion."
    tests: ["R1 — sans orchestrate.worktrees, deux lots du même dépôt jouent à la suite dans le dépôt, aucun worktree créé", "R1 — orchestrate.worktrees: oui (valeur non booléenne) est refusé à la lecture de la config"]
  - id: R2
    cas: [C1]
    enonce: "Seuls les lots dont le dépôt est sur une branche et dont aucun dépôt voisin (repos:) n'est partagé avec un autre lot du groupe passent en worktree ; les autres restent à la suite dans leur file, avec un avertissement dans le journal qui dit pourquoi."
    statut: sourcee
    source: "src/orchestrate/pool.ts:9-11 (deux lots qui partagent un dépôt voisin sont dans la même file) et cycle.ts:786-789 (le lot repose sur une branche) : le worktree ne remplace pas ces gardes"
    tests: ["R2 — dépôt en HEAD détaché : lots à la suite et avertissement", "R2 — deux lots partageant un voisin : même file, aucun worktree", "R2 — un lot seul d'un dépôt : joué dans le dépôt, pas de worktree"]
  - id: R3
    cas: [C1]
    enonce: "Le parallélisme interne à un dépôt est borné par le plafond de sessions de la vague (--max-sessions) : au plus ce nombre de lots du groupe jouent en même temps, un lot sans créneau attend sans être rendu et sans worktree : son worktree n'est créé qu'à la prise du créneau."
    statut: sourcee
    source: "demande du lot : « avancent en parallèle dans la limite des créneaux » ; plafond command.ts:111-112 et pool.ts:5"
    tests: ["R3 — trois lots indépendants d'un dépôt, plafond 2 : jamais plus de deux sessions simultanées", "R3 — plafond 1 : les lots s'enchaînent, aucun refus", "R3 — un lot en attente de créneau n'a ni worktree ni branche créés"]
  - id: R4
    cas: [C1]
    enonce: "Un lot qui dépend d'un lot du même dépôt (dependsOn) attend que celui-ci soit ready (état atteint seulement après son intégration, R22) avant de créer son worktree, qui part alors du sommet de la branche du dépôt ; un prédécesseur rendu ou en échec le rend aussi, comme aujourd'hui."
    statut: sourcee
    source: "src/orchestrate/pool.ts:39-53 (un lot attend ses dépendances au statut ready, rendu si une dépendance est rendue ou en échec) ; « intégré » découle de R22 : ready n'est atteint qu'après l'intégration"
    tests: ["R4 — B dépend de A : le worktree de B naît après l'intégration de A et contient ses commits", "R4 — A rendu sur conflit : B est rendu « dépendance non prête dans la vague : A »"]
  - id: R5
    cas: [C1]
    enonce: "Quand le worktree ou la branche d'un lot ne peut être créé, ce lot seul est rendu au lead avec la cause git ; les autres lots du groupe continuent et le verrou de dépôt n'est pas touché."
    statut: sourcee
    source: "src/orchestrate/cycle.ts:790-796 (une remise de branche impossible rend le lot, l'orchestrateur ne s'arrête pas, L214) ; baselineFailures (cycle.ts:219-249) traite déjà l'échec de `worktree add`"
    tests: ["R5 — branche cadence/<vague>/<lot> déjà présente et non reconnue : lot rendu avec la cause, l'autre lot joue", "R5 — échec de git worktree add : aucun dossier ni branche laissés"]
  - id: R6
    cas: [C2]
    enonce: "Un conflit au rebase d'intégration abandonne le rebase (git rebase --abort), ne touche pas la branche du dépôt, rend le lot au lead avec la liste des fichiers en conflit et conserve le worktree et la branche du lot tels qu'avant le rebase."
    statut: sourcee
    source: "demande du lot : « conflits rendus au lead » ; réponse du lead du 24-10, cas (3) : rebase en conflit non résolu automatiquement rend le lot au lead, sans résolution par une session ; principe coded : un lot qui laisse le dépôt dans un état douteux est rendu, jamais réparé à l'aveugle (cycle.ts:809-814)"
    tests: ["R6 — deux lots modifient la même ligne : le second est handed-back avec le fichier en conflit", "R6 — après le conflit, la branche du dépôt est au même sha qu'avant et le worktree du lot est intact", "R6 — aucun rebase en cours dans le worktree après l'échec", "R6 — aucune session n'est lancée pour résoudre le conflit", "R6 — le conflit ne porte jamais sur le plan : la branche d'un lot ne contient aucun commit de plan (R21)"]
  - id: R7
    cas: [C2]
    enonce: "Quand le rebase a changé les commits du lot, les commandes de test et de build du projet sont rejouées (condition aussi du report, R9) dans le worktree au sommet rebasé avant l'avance de la branche ; un rouge nouveau rend le lot et laisse la branche du dépôt intacte. Les rouges déjà présents au sha de base (baseline, L213) ne comptent pas."
    statut: hypothese
    si_faux: "Si deux lots sans conflit textuel ne peuvent pas se casser mutuellement, la relance est du temps perdu et se retire ; si au contraire elle manque, un sommet intégré rouge n'est vu qu'à la livraison."
    tests: ["R7 — rebase non vide puis test rouge au sommet : branche du dépôt inchangée, lot rendu", "R7 — fast-forward pur : aucune relance des tests", "R7 — rouge présent au sha de base : ne rend pas le lot"]
  - id: R8
    cas: [C2]
    enonce: "L'avance de la branche du dépôt (git merge --ff-only dans son arbre) n'est tentée que si ce dépôt n'a aucun fichier suivi modifié ; sinon le lot est rendu avec la liste de ces fichiers et sa branche est conservée, sans toucher l'arbre du lead."
    statut: sourcee
    source: "src/orchestrate/command.ts:361 (un dépôt à fichiers suivis modifiés est refusé : l'arbre du lead n'est jamais écrasé) ; cycle.ts:141-143 (arbre sale : lot rendu)"
    tests: ["R8 — arbre du lead modifié pendant la vague : lot rendu, fichiers listés, arbre inchangé", "R8 — arbre propre : branche avancée en fast-forward"]
  - id: R9
    cas: [C2]
    enonce: "Après un rebase non fast-forward dont le patch-id stable du diff du lot est identique avant et après, ET dont les tests et le build passent sur le résultat intégré, le verdict de revue est reporté au sha intégré : le programme l'enregistre (dans le checkout principal, R23) au sha intégré et non au sha relu, avec une trace `reporte` (ancien sha relu, nouveau sha, patch-id) ; la revue a relu exactement ce diff, aucune nouvelle revue n'est jouée. Un fast-forward pur ne change aucun sha : rien à reporter."
    statut: sourcee
    source: "réponse du lead du 24-10, validée par Sylvain : cas (1) « patch-id identique ET tests et build verts sur le résultat intégré → verdict reporté au sha intégré, avec une note qui cite l'ancien sha relu et le nouveau »"
    tests: ["R9 — rebase non vide, patch-id identique, tests et build verts : verdict au sha intégré, trace avec ancien et nouveau sha", "R9 — fast-forward pur : le sha du verdict est celui relu, aucune trace de report", "R9 — patch-id identique mais build rouge : pas de report, lot rendu", "R9 — le patch-id est calculé commit par commit ou en diff cumulé de façon stable (git patch-id --stable) : même diff, contexte déplacé, même résultat"]
  - id: R10
    cas: [C2]
    enonce: "Les intégrations d'un dépôt sont sérialisées par un verrou propre au dépôt, pris dans l'état commun aux worktrees (celui de deliver), avec le même mécanisme (pid + heure de démarrage, périmé si le porteur est mort) que le verrou d'orchestration ; un lot qui attend ce verrou ne retient aucun créneau de session. Les lots d'une même vague partagent un pid : le verrou fichier verrait chacun comme déjà porteur (takeLock rend `held` pour un porteur vivant, lock.ts:73), les sérialiser exige donc une file en mémoire par dépôt devant le verrou fichier, qui ne départage que les autres processus. Ce verrou couvre l'intégration ET les écritures de plan du programme (R21, R26)."
    statut: sourcee
    source: "src/orchestrate/lock.ts:26, :57, :69-71 et :99 (takeLock/releaseLock, porteur vivant ou périmé) et src/state.ts:14 (`sharedStateDir`, état commun à tous les worktrees ; `stateDir`, local au worktree, est à la ligne 7) : mécanisme existant réutilisé sous un autre nom"
    tests: ["R10 — deux lots prêts en même temps : intégrés l'un après l'autre, historique linéaire", "R10 — verrou d'intégration d'un pid mort : retiré, l'intégration passe", "R10 — pendant l'attente du verrou aucun créneau de session n'est occupé", "R10 — deux lots du même processus demandent le verrou ensemble : l'un attend l'autre en mémoire, aucun n'est pris pour le porteur"]
  - id: R11
    cas: [C3]
    enonce: "À la reprise, le worktree de chaque lot suit les mêmes gardes qu'un dépôt : un fichier suivi modifié refuse la reprise (code 2) avant toute écriture, et le worktree d'un lot dont la session a été interrompue est rejoué, pas recréé (ses commits et son arbre sont gardés)."
    statut: sourcee
    source: "src/orchestrate/command.ts:1105 (arbre sale refusé avant toute écriture à la reprise) et :1082 (étape en cours interrompue)"
    tests: ["R11 — reprise avec worktree de lot sale : code 2, état de la vague inchangé", "R11 — reprise d'un lot suspendu : même chemin de worktree, mêmes commits", "R11 — worktree enregistré mais dossier disparu : élagué et recréé sur la branche existante"]
  - id: R12
    cas: [C3]
    enonce: "Le programme ne supprime jamais un worktree ou une branche de lot qui porte des commits non intégrés (lot rendu, retiré par --drop, en échec ou en conflit) : ils sont conservés et le journal en donne le chemin. Un worktree dont tous les commits sont intégrés à la branche du dépôt (arbre propre) est, lui, retiré automatiquement après l'intégration. Aucune suppression de branche forcée (-D)."
    statut: sourcee
    source: "réponse du lead (24-10) : aucune suppression automatique d'un worktree ou d'une branche de lot portant des commits non intégrés ; retrait automatique permis quand tous les commits sont intégrés"
    tests: ["R12 — lot ready intégré : worktree et branche retirés", "R12 — lot rendu : worktree et branche conservés et chemin journalisé", "R12 — lot retiré par --drop avec commits non intégrés : worktree et branche conservés", "R12 — branche non fusionnée : jamais supprimée (aucun -D)"]
  - id: R13
    cas: [C4, C1]
    enonce: "Le verrou d'orchestration du dépôt reste pris une fois par vague, au dépôt du projet, et libéré par freeRepo quand tous ses lots sont finis ET intégrés ou rendus ; une seconde vague visant ce dépôt est refusée avant toute écriture avec le message existant, sans créer de worktree."
    statut: sourcee
    source: "src/orchestrate/command.ts:365 (refus « une orchestration y est déjà en cours »), :850-853 (prise du verrou) et :947-949 (libération quand tous les lots du dépôt sont finis)"
    tests: ["R13 — seconde vague sur un dépôt à worktrees : refus, aucun worktree créé", "R13 — le verrou n'est libéré qu'après l'intégration du dernier lot"]
  - id: R14
    cas: [C1]
    enonce: "Le worktree et la branche d'un lot ont des noms déterministes (worktree : sous le dossier de la vague, hors du dépôt ; branche : cadence/<vague>/<slug du lot>) et rien d'autre n'est stocké : la reprise les retrouve par ces noms. Qu'un lot ait été rendu ou arrêté à l'étape d'intégration est dit par le champ existant `next` de LotState (valeur `integrate`, ajoutée à l'union StepKind de launch.ts:12 : une valeur, pas un champ), jamais par un champ nouveau."
    statut: hypothese
    si_faux: "Si le schéma de nommage (dossier de la vague, slug) change, seuls les noms de fichiers git changent ; aucun champ n'est ajouté à l'état de la vague, qui reste inchangé (D4). Si `next` ne pouvait pas porter l'étape d'intégration, un champ serait nécessaire et la question reviendrait au lead ; or `next` est déjà relu à la reprise (state.ts:137) et seul stop() le remet à null (cycle.ts:123) : l'intégration pose `next: integrate` avant de rendre le lot et ne passe pas par stop() pour un rendu à l'intégration (R6, R7, R8, R17, R24, R25, R26) ; le rendu hors intégration reste celui de stop(), next null, donc non reprenable par --integrate (R27)."
    tests: ["R14 — le chemin du worktree se déduit de la vague et du lot, sans champ ajouté à l'état du lot", "R14 — l'état d'une vague écrit avant L279 se relit sans changement", "R14 — un lot rendu à l'intégration (verrou, arbre sale, branche du lead, conflit, tests rouges) garde next: integrate dans son état, et seul --resume --integrate (R27) le rejoue à cette étape"]
  - id: R15
    cas: [C1]
    enonce: "Les sessions d'un lot en worktree n'écrivent que dans ce worktree : le dépôt du lead n'est modifié que par l'avance de C2 et par les commits de plan du programme (R21), et le contrôle « HEAD déplacé » (L214) et la détection de push s'appliquent à chaque worktree comme à un dépôt."
    statut: sourcee
    source: "src/orchestrate/cycle.ts:766-815 (incidents push et hook, HEAD déplacé, surveillés par dépôt) ; src/orchestrate/registry.ts:217-233 (les worktrees d'un dépôt sont reconnus par leur .git commun)"
    tests: ["R15 — un push depuis un worktree de lot arrête la vague (incident)", "R15 — un lot dont la session change de branche dans son worktree est rendu « HEAD déplacé »"]
  - id: R16
    cas: [C1]
    enonce: "Une étape d'un lot qui lance l'application (L60) ne part pas pendant qu'une autre en a lancé une dans le même dépôt : ces étapes sont sérialisées par dépôt, les autres étapes de lots continuent en parallèle."
    statut: hypothese
    si_faux: "Si les ports de l'application sont choisis librement par lot, la sérialisation est un ralentissement inutile ; si elle manque, deux applications se disputent un port et l'étape UX échoue (lot rendu à tort)."
    tests: ["R16 — deux lots à écran : une seule application lancée à la fois dans le dépôt", "R16 — le verrou d'application est par dépôt, pris seulement par les étapes qui lancent l'application : une étape sans application d'un autre lot n'attend pas ce verrou"]
  - id: R17
    cas: [C2]
    enonce: "Après un rebase non fast-forward dont le patch-id du diff du lot diffère (conflit résolu, contexte modifié), une revue courte (review-small, Sonnet) du diff rebasé est jouée avant l'intégration : sans constat bloquant ni majeur, son verdict est enregistré au sha intégré et la branche avance ; un bloquant ou un majeur rend le lot au lead, la branche du dépôt est inchangée et le worktree est conservé."
    statut: sourcee
    source: "réponse du lead du 24-10, validée par Sylvain : cas (2) « revue courte (review-small, Sonnet) du diff rebasé avant l'intégration ; un bloquant ou un majeur rend le lot au lead »"
    tests: ["R17 — patch-id différent : une revue review-small est jouée sur le diff rebasé avant l'avance", "R17 — revue sans constat : verdict au sha intégré, branche avancée", "R17 — un constat bloquant ou majeur : lot rendu, branche du dépôt inchangée", "R17 — patch-id identique : aucune revue jouée"]
  - id: R18
    cas: [C2]
    enonce: "La porte de `raf done` (src/audit.ts:261-269, src/plan.ts:551-556) reste INCHANGÉE. Le verdict reporté (R9) est enregistré avec `commit` = `vers`, le dernier commit de travail intégré (R23) : `unreviewed` retrouve ce commit parmi ceux du lot et n'en compte aucun après lui, donc `raf done` passe sans exception. La trace `reporte` ({ de, vers, patchId }) n'est qu'une information pour la relecture et le journal : la porte ne la lit pas. Un verdict resté au sha relu d'avant le rebase n'existe pas dans ce mode (le programme n'écrit jamais le verdict avant l'avance, R23) ; s'il était édité à la main, la porte le traiterait comme aujourd'hui (commit absent de l'historique : tous les commits du lot comptent, refus)."
    statut: sourcee
    source: "src/audit.ts:261-269 (unreviewed : commit relu absent de l'historique du lot = revue rattachée à rien, tous les commits comptent ; commit présent = seuls les suivants comptent) et :215-217 (commits de plan seul écartés) ; réponse du lead du 24-10 : « le report est tracé (champ ou note dédiés), jamais un verdict édité à la main » (la trace, pas la porte, porte cette exigence)"
    tests: ["R18 — verdict reporté, commit = dernier commit de travail intégré : unreviewedWork vaut 0 et raf done passe sans modification de la porte", "R18 — verdict à la main au sha d'avant le rebase (absent de l'historique) : raf done refuse avec le message existant", "R18 — un commit de travail ajouté après le report : refus comme aujourd'hui", "R18 — la trace `reporte` retirée du verdict : raf done passe encore (elle est informative)"]
  - id: R19
    cas: [C3]
    enonce: "Les worktrees de lot conservés restent visibles : cadence lead tour et cadence orchestrate --status listent chacun (dépôt, lot, âge, nombre de commits non intégrés, chemin) ; aucun n'est oublié silencieusement."
    statut: sourcee
    source: "réponse du lead (24-10) : « cadence lead tour et orchestrate --status listent les worktrees de lot conservés (dépôt, lot, âge, commits non intégrés) »"
    tests: ["R19 — orchestrate --status liste un worktree conservé avec dépôt, lot, âge et commits non intégrés", "R19 — cadence lead tour liste le même worktree", "R19 — aucun worktree conservé : aucune ligne ajoutée"]
  - id: R20
    cas: [C3]
    enonce: "Seule une commande explicite du lead retire un worktree conservé (cadence orchestrate --remove-worktree <projet>:<lot>) : elle refuse (code 2, rien retiré) tant qu'un commit du lot n'est ni intégré à la branche du dépôt ni confirmé abandonné par l'option nommée --abandon-commits ; un worktree entièrement intégré se retire sans option."
    statut: sourcee
    source: "réponse du lead (24-10) : « une commande explicite du lead les retire (refus tant qu'un commit n'est ni intégré ni confirmé abandonné par une option nommée) » ; les noms --remove-worktree et --abandon-commits sont ceux de la fiche (cf. choix)"
    tests: ["R20 — commits non intégrés sans --abandon-commits : refus code 2, worktree et branche intacts", "R20 — avec --abandon-commits : worktree et branche retirés", "R20 — worktree entièrement intégré : retiré sans option", "R20 — lot inconnu ou sans worktree : refus code 2"]

  - id: R21
    cas: [C1, C2]
    enonce: "Le plan n'est JAMAIS écrit dans un worktree de lot. Toutes les écritures de plan d'un lot — raf start (statut doing), notes (hypothèses de la fiche, mineurs de revue), sous-tâches couvertes passées à done, verdict et report (R9, R17, R23), statut — sont faites par le programme d'orchestration dans le checkout principal du dépôt (celui du lead, d'où le plan est chargé), en série sous le verrou d'intégration (R10, R26), chacune par un commit de plan seul à chemins explicites sur la branche du dépôt. Pour un plan en lecture seule (plan.readonly), l'outil orchestrate.start / orchestrate.verdict du projet tourne dans le checkout principal, comme aujourd'hui, jamais dans le worktree ; un plan hors du dépôt (`plan:` de cadence.yaml) est lu et écrit en place, sans commit. Les branches de lot ne portent donc que des commits de travail (dont ceux de l'acceptation, scellé et vert: true, qui sont du travail du lot) : un conflit de plan au rebase est impossible, rien n'est à rejouer. Le raf start du lot est fait dans le checkout principal avant la création de son worktree, qui part donc d'un sommet qui le contient. Une session qui modifie le fichier de plan ou un fichier généré avec lui (plan.files) dans son worktree — commit qui les touche, ou modification non commitée — fait rendre le lot au lead avec un constat qui nomme le fichier et le commit ; sa branche est conservée. Les lectures d'historique du cycle (lotWork, isPlanOnly, coveredTasks, unreviewedWork) reçoivent la racine du worktree et un plan dont le chemin est celui du fichier correspondant dans le worktree : un commit de plan arrivé dans la branche du lot par le rebase n'est pas du travail du lot."
    statut: sourcee
    source: "décision du lead du 24-10 (remplace « abandonner les commits de plan puis rejouer l'entrée du lot ») ; points d'entrée vérifiés dans le code : le plan est chargé depuis la racine du projet par planLoader(repo) (command.ts:246-250, config.ts:105-110), repo étant le checkout principal, et passé au lot par contexts() (command.ts:827) : plan.save() écrit donc déjà dans le checkout principal quel que soit le dépôt du lot ; le seul code qui commite avec le dépôt du lot est commitPlan (cycle.ts:134-149, git sur c.lot.repo, chemin du plan pris par relative(repo, plan.path)), appelé pour le plan en cycle.ts:321 (démarrage), :1346 (hypothèses), :1372 (mineurs), :1989 (verdict et sous-tâches, setStatus :1986) et :2001 (orchestrate.verdict), et pour du travail en :1590 et :1616 (acceptation) ; la commande du projet part de sh(c, commande, délai, env, cwd = c.lot.repo) (cycle.ts:269) : cwd est un paramètre, le plan en lecture seule y reçoit le checkout principal (appels cycle.ts:315 et :1998) ; ownFiles et isPlanOnly (audit.ts:26-27, :65-70) rapportent le chemin du plan à la racine passée, d'où le plan « vu du worktree » ci-dessus"
    tests: ["R21 — deux lots du même dépôt, chacun avec une note de mineur et des sous-tâches couvertes : les deux passent à ready, le second s'intègre sans être rendu, le plan du checkout principal porte les statuts, les notes et les sous-tâches closes des deux lots", "R21 — git log de la branche de chaque lot : aucun commit ne touche le fichier de plan ni plan.files", "R21 — plan hors du dépôt (plan: ../x.yaml) : lu et écrit en place, aucun commit de plan, aucun conflit", "R21 — plan en lecture seule suivi par le dépôt : orchestrate.start et orchestrate.verdict sont lancés avec le checkout principal comme dossier courant, le worktree n'est pas touché", "R21 — commits d'acceptation (scellé, vert: true) : restent sur la branche du lot, pas dans le checkout principal", "R21 — une session commite une modification du plan dans son worktree : lot rendu, constat nommant le fichier et le commit, branche conservée", "R21 — une session modifie le plan sans le commiter : lot rendu de même", "R21 — un commit de plan venu de la branche du dépôt par le rebase : isPlanOnly le reconnaît depuis le worktree, lotWork et unreviewedWork ne le comptent pas", "R21 — le raf start du lot précède la création de son worktree, qui contient le commit de démarrage"]
  - id: R22
    cas: [C2, C1]
    enonce: "En mode worktree, l'intégration se fait AVANT la transition à ready : la transition à ready (cycle.ts:2009) n'a lieu qu'une fois la branche du dépôt avancée ; toute intégration refusée ou en échec (R6, R7, R8, R17, R24, R25, R26) rend le lot au lead sans qu'il ait été ready. Aucun état ni champ n'est ajouté au lot (D4) : un dépendant (pool.ts:39-53) ne voit donc jamais un lot ready non intégré."
    statut: hypothese
    si_faux: "Si ready devait précéder l'intégration, il faudrait un état ou un indicateur d'intégration dans le lot (changement de modèle stocké : question au lead) ; ici, rien de stocké n'est ajouté."
    tests: ["R22 — A et B dépendant de A : B ne part qu'après l'avance de la branche, et son worktree contient les commits de A", "R22 — intégration de A en conflit : A n'est jamais ready, B est rendu", "R22 — l'état d'un lot ne contient aucun champ nouveau après intégration"]
  - id: R23
    cas: [C2]
    enonce: "Le report (R9), le verdict de la revue courte (R17) et la clôture des sous-tâches couvertes sont écrits par le programme APRÈS l'avance de la branche du dépôt, dans le checkout principal, sous le verrou d'intégration, en un commit de plan seul de la branche du dépôt (plan.recordReview avec la trace `reporte`, plan.setStatus) — jamais sur la branche du lot (R21). Entre la fin de la revue et l'intégration le verdict n'est que l'état du lot (LotState.verdict) : le plan ne reçoit qu'un verdict, au sha intégré. Le sha du verdict (`vers`) est celui du dernier commit de travail du lot intégré, pas le commit de plan : la porte de `raf done` ignore les commits réduits au plan (audit.ts:215-217), et `unreviewed` ne trouve ainsi aucun commit après lui. Le patch-id de R9 est calculé sur le diff des seuls commits de travail. Pour un plan en lecture seule, le verdict et sa trace (ancien et nouveau sha) vont dans le texte passé à orchestrate.verdict, qui tourne dans le checkout principal. Un arrêt entre l'avance et l'écriture du verdict est repris à l'étape `integrate` (R14) : la branche du lot étant déjà contenue dans celle du dépôt, le rebase et l'avance sont sautés et le verdict est écrit une seule fois."
    statut: sourcee
    source: "src/audit.ts:215-218 (workCommits écarte les commits de plan seul) et :261-269 (unreviewed lit le commit relu dans le verdict) ; src/plan.ts:389 (recordReview écrit date, verdict, commit) ; aujourd'hui conclude() écrit verdict et sous-tâches avant ready (cycle.ts:1985-1989) : en mode worktree cette écriture passe dans l'étape d'intégration, après l'avance"
    tests: ["R23 — après report, la branche du dépôt se termine par un commit de plan seul et `vers` est le dernier commit de travail intégré ; la branche du lot ne porte aucun commit de plan", "R23 — raf done après report : unreviewedWork vaut 0", "R23 — le sha cité dans la trace du journal est `vers`, pas le tête de branche", "R23 — le patch-id ignore les modifications du plan : deux plans différents, même patch-id", "R23 — plan en lecture seule : la trace figure dans le texte passé à orchestrate.verdict", "R23 — arrêt entre l'avance et l'écriture du verdict puis --resume : verdict écrit une fois, au sha intégré, aucun second rebase"]
  - id: R24
    cas: [C2]
    enonce: "L'avance n'est tentée que si le dépôt du lead est encore sur la branche sur laquelle les lots sont partis (relevée au départ de la vague, relue à chaque intégration) ; s'il est en HEAD détaché ou sur une autre branche, le lot est rendu avec les deux noms de branche, sa branche est conservée, et le programme ne change jamais la branche du lead (aucun checkout, aucun ff sur une autre branche, aucun commit de plan : R21 et R26 appliquent la même garde avant d'écrire le plan)."
    statut: sourcee
    source: "src/orchestrate/cycle.ts:786-789 et :809-814 (la branche attendue est vérifiée, un HEAD déplacé rend le lot, sans réparation) ; réponse du lead : l'arbre du lead n'est jamais déplacé (R8, command.ts:361)"
    tests: ["R24 — le lead passe sur une autre branche pendant la vague : lot rendu, aucune branche avancée, HEAD du lead inchangé", "R24 — HEAD détaché du lead à l'intégration : lot rendu", "R24 — le lead revient sur la branche de départ puis --resume --integrate <projet>:<lot> (R27) : le lot s'intègre ; --resume seul le laisse rendu"]
  - id: R25
    cas: [C2]
    enonce: "L'attente du verrou d'intégration est bornée à 10 minutes (une intégration dure un rebase et la relance des tests) ; au-delà, le lot est rendu au lead avec le porteur du verrou (vague, pid), son worktree et sa branche sont conservés, la branche du dépôt est inchangée, et le lot est rendu avec next: integrate (R14) ; il n'est rejoué que sur ordre du lead (--resume --integrate, R27), pas par un --resume simple. La même borne et le même rendu valent pour l'attente du verrou par une écriture de plan (R26)."
    statut: hypothese
    si_faux: "Si 10 minutes est trop court pour une suite de tests longue, des lots sont rendus à tort : seule la constante change (une ligne de config, aucune donnée)."
    tests: ["R25 — verrou tenu plus que la borne : lot rendu, worktree conservé, branche du dépôt inchangée", "R25 — verrou libéré avant la borne : le lot s'intègre", "R25 — --resume --integrate d'un lot rendu sur le délai : repris à l'intégration (next: integrate) sans rejouer ses étapes"]

  - id: R26
    cas: [C1, C2]
    enonce: "Une écriture de plan du programme (R21) est précédée des mêmes gardes que l'avance de C2 : file en mémoire par dépôt puis verrou d'intégration (R10, attente bornée comme R25), dépôt encore sur la branche de départ (R24), aucun fichier suivi modifié hors plan et plan.maintained dans le checkout principal (le contrôle de commitPlan, cycle.ts:141-145). Un refus rend le lot au lead avec la cause, sans commit, et le lot garde l'étape atteinte (next) pour la reprise."
    statut: hypothese
    si_faux: "Si le lead doit pouvoir éditer le dépôt pendant une vague, le refus pour arbre sale rendrait à tort des lots à leur prochaine écriture de plan (notes, verdict) ; il faudrait alors écrire le plan sans passer par l'arbre du lead (index à part), ce que la fiche ne prévoit pas : question au lead. Le fichier d'attendus QA (plan.maintained) reste du travail du lot s'il le modifie en worktree : il ne déclenche pas le rendu de R21."
    tests: ["R26 — fichier suivi hors plan modifié dans le checkout principal : écriture de plan refusée, lot rendu, rien commité", "R26 — le lead est sur une autre branche : écriture de plan refusée, lot rendu, aucun commit", "R26 — verrou tenu au-delà de la borne pendant une écriture de plan : lot rendu avec le porteur, reprise à l'étape atteinte", "R26 — trois lots écrivent le plan en même temps : trois commits de plan, aucun perdu, dans l'ordre de la file"]
  - id: R27
    cas: [C3]
    enonce: "Un lot rendu (handed-back) à l'étape d'intégration (next: integrate, R14) n'est rejoué par la reprise que si le lead le nomme avec l'option --resume <vague> --integrate <projet:lot> ; ni --resume seul, ni --drop, --answer ou --budget ne le rejouent. Le lot repart du statut suspended, next: integrate, outcome null (comme un lot relevé par --budget, command.ts:1171-1178), avec son worktree et sa branche retrouvés (R11) ; l'intégration reprend (rebase, contrôles, avance, écriture du plan ; si la branche du lot est déjà contenue dans celle du dépôt, ces étapes sont sautées, R23). L'option est refusée (code 2, avant toute écriture, comme les autres refus de reprise) pour : un lot inconnu ou visé deux fois, un lot aussi visé par --drop, --answer ou --budget, un lot qui n'est pas rendu avec next: integrate (statut, étape et cause cités), un lot retiré par --drop (outcome DROPPED, next null). Les rendus hors intégration (revue, tests de la session, budget) gardent next null (stop(), cycle.ts:123) et ne sont pas concernés ; le rendu sur budget garde son chemin --budget. Le refus d'arbre sale du dépôt (command.ts:1118-1122) s'applique avant, sans exception. Un rendu pour conflit (R6), tests rouges (R7) ou revue courte (R17) est rejoué de la même façon, puisque le lead l'a nommé : l'intégration refait le rebase et les contrôles, et rend le lot de nouveau si le problème persiste ; le lead a alors résolu à la main dans le worktree (commit) ou accepte un nouveau rendu."
    statut: sourcee
    source: "réponse du lead (24-10, question de la vague 2026-10-24-1415, validée par la règle de Sylvain : le lead tranche les choix techniques de cadence) : option explicite --resume <vague> --integrate <projet:lot> pour tout rendu à l'intégration (environnement, conflit, tests, revue) ; --resume seul ne rejoue jamais une intégration ; rien n'est rejoué en silence, comme --answer et --drop"
    tests: ["R27 — lot rendu sur verrou d'intégration (next: integrate) puis --resume seul : il reste handed-back, rien n'est rejoué", "R27 — --resume --integrate sur ce lot : suspended puis intégré, ready", "R27 — --integrate sur un lot rendu hors intégration (next null) : refus code 2 avec statut et étape cités, état de la vague inchangé", "R27 — --integrate sur un lot retiré par --drop ou aussi visé par --drop, --answer, --budget : refus code 2", "R27 — --integrate avec un fichier suivi modifié dans le dépôt : refus d'arbre sale avant toute écriture", "R27 — lot rendu pour conflit (R6) puis --integrate sans que le lead ait rien changé : le conflit est constaté de nouveau, lot rendu de nouveau, branche du dépôt inchangée", "R27 — lot rendu sur arbre du lead sale (R8), arbre nettoyé, --integrate : le lot s'intègre"]

contrats:
  - id: A1
    appel: commande cadence orchestrate
    entree: "<projet>:<lot>… [--budget 2M] [--max-sessions n] ; cadence.yaml : orchestrate.worktrees: true|false (défaut false)"
    sortie: "lots du même dépôt joués en parallèle dans des worktrees, intégrés un par un à la branche du dépôt ; tableau de fin de vague avec, par lot rendu, le chemin de son worktree ; code 0 si tous prêts, comme aujourd'hui"
    erreurs:
      - { code: log warn, message: "orchestrate : <dépôt> : worktrees demandés mais <raison> : lots joués à la suite" }
      - { code: log error, message: "cadence.yaml : orchestrate.worktrees doit être true ou false" }
      - { code: log error, message: "orchestrate : <projet>:<lot> : worktree impossible : <cause git>" }
      - { code: log error, message: "orchestrate : <dépôt> : une orchestration y est déjà en cours (<vague>, pid <pid>)" }
    regles: [R1, R2, R3, R4, R5, R13, R14, R15, R16, R21, R26]
  - id: A2
    appel: commande cadence orchestrate --resume
    entree: "<vague> [--drop projet:lot] [--answer …] [--budget …] [--integrate projet:lot]"
    sortie: "lots repris dans leurs worktrees retrouvés ; lot retiré par --drop : worktree conservé et chemin journalisé ; lot rendu à l'intégration nommé par --integrate : suspended puis repris à l'intégration (journal « <projet>:<lot> → suspended — intégration reprise (--resume --integrate) ») ; sans --integrate, un lot rendu à l'intégration reste rendu"
    erreurs:
      - { code: log error, message: "orchestrate : <dépôt> : arbre sale, <n> fichier(s) suivi(s) modifié(s) : <fichiers>" }
      - { code: log warn, message: "orchestrate : <projet>:<lot> : worktree conservé : <chemin> (branche <branche>)" }
      - { code: log error, message: "orchestrate : --integrate <projet>:<lot> : le lot n'est pas rendu à l'étape d'intégration (<statut>, étape <étape ou aucune> : <cause ou sans cause>)" }
      - { code: log error, message: "orchestrate : --integrate <projet>:<lot> : lot inconnu dans la vague <vague>" }
      - { code: log error, message: "orchestrate : --integrate <projet>:<lot> : lot aussi retiré par --drop" }
    regles: [R11, R12, R13, R14, R19, R25, R27]
  - id: A3
    appel: commande cadence orchestrate (intégration d'un lot prêt)
    entree: "la fin du cycle du lot dans son worktree (avant ready) ; verrou d'intégration du dépôt"
    sortie: "branche du dépôt avancée (fast-forward ou après rebase), verdict et clôture des sous-tâches écrits dans le checkout principal, worktree et branche retirés puis lot ready (jamais ready avant l'intégration) ; journal « <projet>:<lot> intégré : <sha départ>..<sha intégré> » ; après un rebase non vide à patch-id identique, verdict reporté et journal « <projet>:<lot> verdict reporté : <ancien sha relu> → <nouveau sha> (patch-id identique) »"
    erreurs:
      - { code: log warn, message: "<projet>:<lot> → handed-back — intégration impossible : conflit en rebasant <branche> sur <branche du dépôt> (fichiers : <liste>) ; worktree conservé : <chemin>" }
      - { code: log warn, message: "<projet>:<lot> → handed-back — intégration refusée : tests rouges au sommet intégré (<échecs>) ; branche du dépôt inchangée, worktree conservé : <chemin>" }
