          \  - Lire le YAML avec une regex : acceptable. Si l'étape est renommée ou réindentée, le test « trouve le script de l'étape » échoue tout de suite, sans faire tomber les autres en silence. Sa justification est fausse, en revanche : la bibliothèque `yaml` est déjà une dépendance du projet (utilisée dans src/plan.ts, config.ts et audit.ts). Ce n'est pas un défaut.

          \  - Copie temporaire des fichiers : correct. Le dossier est supprimé dans le `finally` et le dépôt n'est jamais modifié.

          \  - Test qui ne pouvait pas être rouge : exact. Le workflow contrôlait déjà les trois fichiers, seule la doc était fausse.

          \  - Deux commits séparés, test puis doc : rien à redire.

          - **La doc.** L'en-tête de publish.yml (l.3-4) et le README §Releasing (aujourd'hui l.731) disent maintenant ce que fait l'étape : le tag est comparé à `package.json`, `.claude-plugin/plugin.json` et `.claude-plugin/marketplace.json`.


          **Constats et sous-tâches** : aucun.


