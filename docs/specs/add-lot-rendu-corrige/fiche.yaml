sujet:
  id: add-lot-rendu-corrige
  titre: "orchestrate --add d'un lot rendu par la vague vivante après un correctif du lead : reprise du worktree conservé"
  lot: L563
  perimetre:
    modules: [src/orchestrate/ajout.ts, src/orchestrate/preflight.ts, src/orchestrate/execute.ts, src/orchestrate/geste.ts]
    endpoints: []
    jobs: []
    hors_perimetre:
      - "rendus d'incident : un lot rendu par `HEAD déplacé` (session.ts:366), par commit sur la branche principale d'un autre dépôt (session.ts:433), par « dépendance non prête » (questions.ts:38), par « worktree impossible » (cycle.ts:63) ou par plan modifié par la session (session.ts:392) n'est PAS ajoutable : le refus « lot déjà dans la vague » reste, car la reprise n'y est pas sûre sans que le lead ait d'abord réglé l'incident (R3)"
      - "rendus des étapes spec, fiche, maquette et accept (spec non conforme, fiche/maquette non conforme, accept non conforme, verrou des tests d'acceptation, dépôt sale après spec/accept, scellé) et rendus de l'étape d'écriture (sans commit, délai dépassé, dépôt sale) : exclus par la liste blanche (R13), refus « lot déjà dans la vague » inchangé ; leur reprise reste une nouvelle vague (L311)"
      - "--replay sur une vague vivante : refusé « la vague tourne encore » comme aujourd'hui (geste : à la fin de la vague) ; seul --add gagne le chemin (issue #31 propose l'un OU l'autre)"
      - "le lot rendu à l'intégration (next: integrate), qui garde --resume --integrate (déposé tout de suite, L532), et le lot rendu sur budget, qui garde --budget projet:lot=+N (L223)"
      - "le lot retiré par --drop (nouvelle vague, L554) et l'écart docs.sync : inchangés"
      - "le format de LotState, de adds.log et du plan : aucun champ nouveau"
      - "la reprise d'une branche d'une VAGUE PASSÉE (recoverTree, L311) : inchangée"

cas:
  - id: C1
    titre: "Le lead ajoute à la vague vivante un lot qu'elle a rendu, après l'avoir corrigé dans son worktree"
    acteur: le lead
    declencheur: commande cadence orchestrate --add <projet>:<lot> --wave <vague>
    preconditions:
      - "la vague est vivante et lit la file d'ajouts (L421)"
      - "le lot est dans la vague, status handed-back, rendu hors intégration (next différent de integrate), hors budget, hors --drop, hors écart docs.sync, hors écriture de plan refusée"
      - "le worktree conservé du lot existe, sa branche est celle de la vague, son arbre n'a aucun fichier suivi modifié (le correctif du lead est commité)"
    nominal:
      - "Le contrôle préalable de --add reconnaît le lot comme un lot rendu à reprendre au lieu de répondre « lot déjà dans la vague »."
      - "La demande est déposée dans adds.log et la ligne « ajout déposé » est imprimée comme pour un lot neuf."
      - "Entre deux étapes, la vague prend la demande ; quand un créneau et le dépôt sont libres, le lot retrouve son worktree et sa branche sans les recréer, reprend les constats de sa dernière revue et sa clé existe déjà dans la vague (non dupliquée)."
      - "Le lot repart à l'étape que choisit la reprise de branche (L311) : correction avec les derniers constats de revue, revue s'il a déjà passé une revue sans constat, écriture s'il n'a jamais été revu."
      - "Le cycle normal enchaîne (revue, passes, intégration) ; la vague journalise « ajouté à la vague »."
    alternatives:
      - { si: "les constats de la dernière revue sont vides et le lot a déjà passé une revue", alors: "il repart à la revue (firstReview), pas à une correction sans constat", regles: [R2] }
      - { si: "le lot n'a jamais passé de revue (rendu avant la première)", alors: "il repart à l'écriture (firstWrite)", regles: [R2] }
      - { si: "les seuls constats sont ceux de tests rouges (source tests)", alors: "ils ne comptent pas comme une revue (L318) : il repart à l'écriture", regles: [R2] }
      - { si: "le lot est dans la vague et n'est pas rendu (en cours, en file, suspendu, en question, prêt, échoué)", alors: "refus inchangé « lot déjà dans la vague »", regles: [R1] }
      - { si: "le lot est rendu à l'intégration, sur budget, sur écriture de plan refusée, retiré ou en écart docs.sync", alors: "refus « lot déjà dans la vague » suivi du geste propre à son cas", regles: [R3] }
      - { si: "le lot est rendu par un incident (HEAD déplacé, commit sur la branche principale d'un autre dépôt, dépendance non prête, worktree impossible, plan modifié par la session)", alors: "refus « lot déjà dans la vague » inchangé : hors périmètre", regles: [R13] }
      - { si: "le worktree ou la branche du lot a disparu, ou l'arbre a des fichiers suivis modifiés", alors: "refus avant d'agir, code 2, la cause dite", regles: [R4] }
      - { si: "le même lot est déjà en file d'ajout, ou visé deux fois dans la commande", alors: "refus inchangé « lot déjà en file d'ajout dans la vague »", regles: [R1] }
      - { si: "le lead modifie ou nettoie le worktree entre le dépôt de la demande et sa prise (arbre sale, worktree ou branche disparus)", alors: "re-contrôle à la prise : demande écartée et dite, lot inchangé (rendu)", regles: [R12] }
      - { si: "le budget restant de la vague ne tient pas le budget du lot", alors: "refus inchangé (budgetRefusals)", regles: [R6] }
      - { si: "la vague a fini entre le contrôle et le dépôt, ou finit avant que la demande soit prise", alors: "demande retirée/écartée et dite, lot inchangé", regles: [R7] }
      - { si: "le dépôt est tenu par un lot qui joue", alors: "la demande attend un créneau puis est prise", regles: [R5] }
    resultat: "Un lot corrigé à la main repart dans la vague vivante dès qu'un créneau est libre, sans attendre sa fin ni une nouvelle vague."
  - id: C2
    titre: "Le lead lit le geste d'un lot rendu sur une vague vivante"
    acteur: le lead
    declencheur: commande cadence orchestrate --status (colonne geste) et refus d'une autre option sur ce lot
    preconditions:
      - "une vague vivante porte un lot rendu hors intégration, hors budget, hors retrait, hors écriture de plan refusée"
    nominal:
      - "La colonne geste du lot affiche la commande --add exacte à jouer tout de suite, sans « à la fin de la vague »."
    alternatives: []
    sans_alternative: "les autres gestes (intégration, replay, retrait, docs.sync) sont ceux de L554 et ne changent pas ; la vague terminée garde le geste actuel (aucun, ou la nouvelle vague)"
    resultat: "Le lead n'a plus à deviner qu'un lot rendu se rajoute à la vague en cours."

regles:
  - id: R1
    cas: [C1]
    enonce: "Un lot de la vague qui n'est pas rendu (queued, running, ready, suspended, question, failed, done…), ou déjà en file d'ajout, reste refusé par --add avec « <projet:lot> : lot déjà dans la vague <id> » (ou « déjà en file d'ajout dans »), code 2, rien déposé."
    statut: sourcee
    source: "src/orchestrate/preflight.ts:103 ; test/orchestrate-ajout-vivante-l421.test.ts:144 (R5 de L421)"
    tests: ["R1 — lot en cours ou prêt de la vague : « lot déjà dans la vague », code 2", "R1 — lot déjà en file d'ajout : refus inchangé"]
  - id: R2
    cas: [C1]
    enonce: "PROVENANCE. AddFeed.prepare (ajout.ts) construit par e.build un ctx NEUF (steps vides, sans constats, pass 0, sans tree) : il ne porte pas l'état du lot rendu. L'état vient de l'ANCIEN ctx du lot, trouvé dans e.ctxs par sa clé lotKey(projet, lot) (c'est le LotState vivant de la vague, que stop() a déjà écrit par store.writeLot ; e.ctxs est préféré à une relecture de store.readLot pour ne pas lire un état plus ancien que celui de la mémoire). `admit(entry, c, old)` reçoit cet ancien ctx (prepare le retrouve ; `known` l'exclut, R12) et appelle `resumeNext(c, old)` (fonction à créer dans ajout.ts), qui COPIE l'ancien LotState dans le ctx neuf (c.lot reçoit une copie de old.lot : steps, constats, code, ux, reviewCounts, minorPass, programFixes, warnings, tokens ; config, tree et plan restent ceux du ctx neuf), puis pose, dans l'ordre de R6, budget/pass/escalation/status/outcome, puis resumedFrom/resumedReviewed (R11), puis `next`. Le bloc de départ de cycle.ts:86 (`l.next === null && l.steps.length === 0`, qui choisit toFix / firstReview / firstWrite aux lignes 111-114) est SAUTÉ pour un lot rendu qui garde ses steps : c'est donc la prise, via resumeNext, qui pose `next` : (a) quand `constats` (derniers constats de revue de code, non conformes) n'est pas vide, `toFix(c, c.lot.constats, 'reprise du lot rendu')` (cycle/review.ts:69), qui pose next = 'fix' (pass déjà à 0, R6) ; (b) sinon, quand le lot a passé une revue (resumedReviewed, R11), `next = firstReview(c)` (cycle/review.ts:50) : la revue du correctif du lead ; (c) sinon, `next = firstWrite(c)` (cycle/spec-steps.ts:21), lot jamais revu ou aux seuls constats de tests rouges (source tests, qui ne font pas une revue, L318). Le `next` du lot rendu (null ou terminal) est toujours remplacé, avant le repassage à queued. Le cas (c) n'est atteignable que pour un rendu de la liste blanche R13 (étapes d'écriture/correction/revue) : les rendus des étapes spec, fiche, maquette et accept en sont exclus, firstWrite ne sautera donc jamais une étape échouée."
    statut: hypothese
    si_faux: "Si la prise ne posait pas next, le lot repasserait à queued avec son ancien next et la boucle ne jouerait rien ou la mauvaise étape ; si l'état venait de store.readLot plutôt que de e.ctxs, seule la source de la copie change (même valeurs, le disque étant écrit à chaque stop) ; si l'étape choisie devait différer (par ex. toujours firstReview), seule la valeur de next change, aucun format. La règle d'étape imite celle de cycle.ts:111-114 et de L311 (execute.ts:106-110) mais la fonction qui la pose est nouvelle."
    tests: ["R2 — constats de revue présents : après la prise, next vaut 'fix' (toFix appelée avec ces constats), quel que soit le next du lot rendu", "R2 — revue passée sans constat : après la prise, next vaut la valeur de firstReview (revue du correctif du lead), pas 'fix'", "R2 — jamais revu : après la prise, next vaut la valeur de firstWrite", "R2 — constats de tests rouges seuls : après la prise, next vaut la valeur de firstWrite (pas 'fix', pas de revue)", "R2 — lot rendu à next null ou terminal : next écrasé par la prise, le lot joue l'étape choisie dans le cycle", "R2 — provenance : le ctx neuf de e.build a steps vides ; après la prise, c.lot.steps, constats, reviewCounts et tokens sont ceux de l'ancien ctx de e.ctxs (copie, pas référence partagée)", "R2 — un lot rendu après une revue repart à fix ou firstReview, jamais à firstWrite (la copie des steps précède la pose de next)"]
  - id: R3
    cas: [C1]
    enonce: "Le refus « lot déjà dans la vague » reste le même, avec son geste, pour un lot rendu à l'intégration (--resume --integrate), sur budget (--budget projet:lot=+N), sur écriture de plan refusée (--replay, à la fin de la vague), retiré par --drop ou en écart docs.sync (nouvelle vague) ; seul le rendu « hors intégration, hors budget, hors plan » devient ajoutable. Ajoutable = addableHandBack(l) (R13)."
    statut: sourcee
    source: "src/orchestrate/geste.ts:36-47,61-64 ; src/orchestrate/cycle/budget.ts:54-59 ; docs/specs/orchestrate-worktree-par-lot R27 (--integrate garde l'intégration seule) ; docs/specs/orchestrate-reprise-lot-budget (le rendu sur budget garde --budget)"
    tests: ["R3 — lot rendu à l'intégration : refus inchangé avec le geste --integrate", "R3 — lot rendu sur budget : refus inchangé avec le geste --budget", "R3 — lot retiré par --drop : refus inchangé, nouvelle vague"]
  - id: R4
    cas: [C1]
    enonce: "Un lot rendu dont le worktree conservé ou la branche de vague a disparu, ou dont l'arbre a un fichier suivi modifié (correctif non commité), est refusé par --add avant toute écriture, code 2, avec la cause ; pour un arbre sale, le refus nomme les fichiers non commités et la commande à rejouer après le commit ; le programme ne commite ni ne jette jamais l'arbre du lead ; le lot reste rendu et inchangé."
    statut: sourcee
    source: "texte du lot L563 dans le plan (.cadence/raf.yaml) : « R4 confirmée par le lead le 04-11 : un worktree sale est refusé, le refus nomme les fichiers et la commande à rejouer après le commit » ; issue #31 de cadence"
    tests: ["R4 — arbre du worktree sale : code 2, fichiers non commités et commande à rejouer nommés, état du lot inchangé", "R4 — worktree disparu : code 2, lot toujours rendu"]
  - id: R5
    cas: [C1]
    enonce: "Le lot rendu admis attend, dans la file d'ajouts, un créneau libre et un dépôt libre comme tout ajout ; il est pris entre deux étapes, reprend le worktree et la branche existants (jamais recréés ni basés sur un autre sha), et repasse de handed-back à queued avec outcome vidé. AddFeed.admit REMPLACE l'ancien ctx au lieu d'en ajouter un second : l'ancien ctx est retiré de e.ctxs, e.all et e.lots (quand e.lots !== e.all) par la clé lotKey(projet, lot) et le ctx repris est inséré À LA PLACE de l'ancien (même rang) ; `wave.lots` ne reçoit pas la clé une seconde fois (elle y est déjà : pas de push si présente). Le lot figure donc une seule fois dans chacun, avec le LotState posé par resumeNext (R2) ; le tableau, le calcul du budget et la boucle de jeu ne le voient qu'une fois."
    statut: sourcee
    source: "src/orchestrate/ajout.ts:AddFeed.take / admit (créneau et dépôt) ; docs/specs/orchestrate-worktree-par-lot R11 (un lot déjà commencé retrouve son worktree)"
    tests: ["R5 — lot rendu ajouté : même worktree, mêmes commits, une seule clé dans wave.lots", "R5 — lot rendu ajouté : une seule occurrence du lot dans e.ctxs, une dans e.all, une dans e.lots, et c'est le nouveau LotState (ancien ctx remplacé)", "R5 — lot rendu ajouté : le lot n'est joué qu'une fois et compté une fois dans le budget de la vague", "R5 — dépôt tenu par un lot qui joue : le lot attend puis est pris"]
  - id: R6
    cas: [C1]
    enonce: "Le correctif du lead ouvre un nouveau départ sans perdre l'historique. Ordre de pose, dans resumeNext (R2), sur le LotState copié de l'ancien ctx : (1) `pass` = 0 ; (2) `escalation` = undefined (état de lot neuf) ; (3) `budget` = lotSpent(ancien lot) + budget d'un lot neuf (celui du ctx construit par e.build, réserve d'escalade comprise), de sorte que lotOver (budget.ts:9) est faux à la première passe ; (4) `steps` conservé tel quel (lotSpent, resumedReviewed et R2 en dépendent) ; (5) status queued, outcome null ; PUIS (6) la pose de `next` (R2) : toFix compare `l.pass >= cap` (review.ts:76), il doit donc voir pass = 0 (sinon il rendrait le lot aussitôt). Le budget d'un lot neuf (et non le total relevé) doit tenir dans le budget restant de la vague (contrôle de prepare, ajout.ts), sinon refus inchangé « le budget restant de la vague … ne tient pas le budget du lot »."
    statut: hypothese
    si_faux: "Si le lot devait garder son budget d'origine, un lot rendu à 90 % de son budget serait rendu de nouveau « budget du lot atteint » dès la première passe ; si l'on effaçait `steps` à la place, la reprise perdrait l'étape choisie (R2) ; si pass n'était pas remis à 0 avant toFix, le lot serait rendu aussitôt. Seules des valeurs de champs existants changent (budget, pass, escalation), aucun format."
    tests: ["R6 — lot rendu à 90 % de son budget, ajouté : budget = dépensé + budget neuf, lotOver faux, steps inchangés", "R6 — lot repris : pass à 0 et escalation vide", "R6 — lot rendu avec pass = plafond et constats de revue : après la prise next = 'fix' (toFix n'a pas rendu le lot, pass lu à 0)", "R6 — budget neuf supérieur au budget restant de la vague : refus inchangé, code 2"]
  - id: R7
    cas: [C1]
    enonce: "Une demande d'ajout d'un lot rendu que la vague ne peut plus prendre (vague finie, arrêt demandé, lot devenu non rendu ou fini entre-temps) est écartée et dite (journal, ou « la vague … vient de finir, lot non ajouté »), le lot restant rendu comme avant."
    statut: sourcee
    source: "src/orchestrate/ajout.ts:93-100 (addToLive), AddFeed.recheck / discard ; test/orchestrate-ajout-vivante-l421.test.ts"
    tests: ["R7 — la vague finit avant la prise : demande écartée, lot toujours handed-back"]
  - id: R8
    cas: [C2]
    enonce: "Sur une vague vivante, la colonne geste d'un lot rendu ajoutable (addableHandBack(l), R13 ; R3 exclu) est « cadence orchestrate --add <projet>:<lot> --wave <vague> » (forme .:<lot> quand le projet est le dossier de lancement), sans « à la fin de la vague » ; vague terminée : geste inchangé."
    statut: hypothese
    si_faux: "Si le geste restait vide, la fonctionnalité serait là mais introuvable ; seul le texte de la colonne change."
    tests: ["R8 — vague vivante, lot rendu à corriger : la colonne geste vaut exactement « cadence orchestrate --add <projet>:<lot> --wave <vague> », sans « à la fin de la vague »", "R8 — vague terminée : geste inchangé (texte exact de L554, sans --add)"]
  - id: R9
    cas: [C1]
    enonce: "À la prise, la vague journalise « <projet:lot> : ajouté à la vague <id> » et la ligne « <projet:lot> : reprise du lot rendu à la correction|à la revue|à l'écriture, worktree <chemin> » (un seul des trois compléments, selon R2)."
    statut: hypothese
    si_faux: "Si la ligne manquait, seul le journal serait moins lisible ; aucun comportement ne change."
    tests: ["R9 — journal : la ligne exacte « <projet:lot> : ajouté à la vague <id> » est écrite une fois", "R9 — journal, constats présents : la ligne exacte « <projet:lot> : reprise du lot rendu à la correction, worktree <chemin> »", "R9 — journal, revue sans constat : « … reprise du lot rendu à la revue, worktree <chemin> »", "R9 — journal, jamais revu : « … reprise du lot rendu à l'écriture, worktree <chemin> »"]
  - id: R10
    cas: [C1]
    enonce: "--replay sur une vague vivante reste refusé « la vague <id> tourne encore (pid …) : à la fin de la vague : … » ; seul --add reprend le lot rendu."
    statut: sourcee
    source: "src/orchestrate/geste.ts:56-59 (stillRunningRefusal) ; test/orchestrate-geste-suivant-l554.test.ts"
    tests: ["R10 — --replay sur vague vivante : refus inchangé"]

  - id: R11
    cas: [C1]
    enonce: "Le chemin recoverTree (execute.ts:100-110) ne se déclenche pas pour ce lot : sa condition `!baseBranchOf(repo, lotBr)` est fausse puisque la branche de la vague existe. La prise pose donc elle-même l'état de reprise, dans resumeNext (R2), à partir de l'ANCIEN LotState (R2, provenance) : `constats` est gardé ; `resumedReviewed` = constats de source code ou étape dont le kind commence par `review` dans `steps` (même formule qu'execute.ts:110) ; `resumedFrom` prend l'id de la vague vivante elle-même (champ existant ; lu par budget.ts:104 et cycle.ts:111) ; `reviewCounts`, `minorPass` et `programFixes` (review.ts:70-98) sont gardés tels quels (historique des revues : la convergence de toFix continue de les lire) ; `escalation` est remise à son état de lot neuf (undefined, R6). Le worktree est repris par le chemin « un lot dont la branche existe déjà » (known, execute.ts:117). Cette pose se fait AVANT le repassage à queued, car cycle.ts:86 ne l'exécute pas pour un lot qui garde ses steps."
    statut: hypothese
    si_faux: "Si resumedFrom devait rester vide, le lot ne serait plus reconnu comme repris (R2 violée) ; si la formule de resumedReviewed différait, ou si les compteurs de revue étaient remis à zéro, l'étape de reprise ou le plafond de passes changerait, sans donnée en jeu."
    tests: ["R11 — lot rendu après une revue avec constats : resumedFrom = id de la vague, constats gardés, resumedReviewed vrai, pas de recoverTree", "R11 — lot rendu sans aucune revue : resumedReviewed faux, next posé par la prise à firstWrite", "R11 — lot rendu après une revue avec constats : next posé par la prise à 'fix' avant le repassage à queued", "R11 — reviewCounts, minorPass et programFixes du lot rendu identiques après la prise ; escalation vide"]
  - id: R12
    cas: [C1]
    enonce: "À la prise (AddFeed.prepare puis recheck, ajout.ts:160-175), le lot rendu est exclu de `known` (les ctxs de la vague le contiennent déjà ; sinon le préflight le refuserait « lot déjà dans la vague », preflight.ts:103) et R4 est rejoué : si, entre le dépôt de la demande et sa prise (attente d'un créneau ou du dépôt, R5), le worktree ou la branche a disparu ou l'arbre a un fichier suivi modifié, la demande est écartée et dite (cause et fichiers nommés comme en R4), le lot reste rendu et inchangé, et aucun raf start ni reprise ne part sur l'arbre sale."
    statut: hypothese
    si_faux: "Le code re-contrôle déjà à la prise (ajout.ts:160-175) mais pas l'état de l'arbre : sans ce re-contrôle, un correctif défait ou un worktree nettoyé entre le dépôt et la prise ferait partir une session sur un arbre sale ; seule la prise change, le lot reste rendu."
    tests: ["R12 — arbre rendu sale après le dépôt de la demande : demande écartée et dite, aucune session lancée, lot toujours handed-back", "R12 — worktree supprimé après le dépôt : demande écartée, lot inchangé", "R12 — lot rendu absent de known à la prise : pas de refus « lot déjà dans la vague »"]
  - id: R13
    cas: [C1]
    enonce: "LISTE BLANCHE des rendus ajoutables, un préfixe par ligne, tous écrits par toFix au plafond de passes (cycle/review.ts:77 `<what> après <N> passe(s) de correction`, suivi éventuel de « ; escalade … ») : (1) « revue non conforme après », (2) « tests rouges après », (3) « code sans test après », (4) « documentation en retard après », (5) « sonde de cas limites après », (6) « UX non conforme après » (what de review.ts:256, work.ts:175,192,219,235, review.ts:192). Ces six préfixes sont exportés en une constante (FIN_DE_CYCLE_WHATS, cycle/review.ts, à côté de toFix) que toFix lit pour écrire l'outcome ; le prédicat addableHandBack(l) de src/orchestrate/geste.ts lit la MÊME constante : vrai seulement si status = handed-back, next ≠ integrate et outcome commence par `<what> après ` pour l'un des six. Il est lu par le préflight de --add (R13, R3) et par lotGesture (R8). EXCLUS, donc refusés « lot déjà dans la vague » avec leur geste propre s'il existe : (a) tous les rendus aux étapes spec, fiche, maquette et accept (« spec non conforme après », « <label> non conforme après » / « … et la spec a déjà joué » spec-steps.ts:165,279,284, « réponse du lead non reportée » :106, « dépôt sale après spec/accept » :141 accept-step.ts:171, « accept non conforme après 2 passes » :177, « verrou des tests d'acceptation » work.ts:81 accept-step.ts:143, « scellé de » accept-step.ts:189) : leur étape a échoué, et firstWrite la sauterait ; le lead les reprend dans une nouvelle vague (recoverTree, L311) ; (b) les rendus de l'étape d'écriture ou de correction : « <kind> sans commit » (work.ts:126), « fix sans commit ni raison » (:133), « dépôt sale après <kind> » (:98), « passe des mineurs sans commit » (:119), écart de documentation resté ouvert (:140), « délai dépassé » (session.ts:281) ; (c) « revue non conforme sans constat actionnable » (no-finding.ts:19), le budget (budget.ts:108), les incidents (HEAD déplacé, commit sur la branche principale d'un autre dépôt, dépendance non prête, worktree impossible, plan modifié par la session), l'intégration, DROPPED, DOCS_GAP, plan refusé ; (d) tout outcome inconnu, vide ou futur : un nouvel outcome n'est jamais ajoutable sans qu'on ait décidé de l'ajouter à la constante (décision du lead du 04-11)."
    statut: hypothese
    si_faux: "Si d'autres rendus devaient être ajoutables, la liste de la constante s'allonge sans autre effet, R4 protégeant l'arbre ; si un rendu d'étape spec ou accept l'était, firstWrite sauterait l'étape échouée (c'est pourquoi ils sont exclus). Aucun format de donnée en jeu : outcome est un texte existant."
    tests: ["R13 — lot rendu « revue non conforme après 2 passe(s) de correction » : --add accepté, geste --add", "R13 — lot rendu « tests rouges après 2 passe(s) de correction » : --add accepté", "R13 — lot rendu « code sans test après 2 passe(s) de correction » : --add accepté", "R13 — lot rendu « documentation en retard après 2 passe(s) de correction » : --add accepté", "R13 — lot rendu « sonde de cas limites après 2 passe(s) de correction » : --add accepté", "R13 — lot rendu « UX non conforme après 2 passe(s) de correction » : --add accepté", "R13 — lot rendu « revue non conforme après 2 passe(s) de correction ; escalade <modèle> déjà jouée » : --add accepté (préfixe seul compte)", "R13 — lot rendu « spec non conforme après 2 passes », « fiche non conforme après 1 revue », « maquette non conforme après 1 revue », « accept non conforme après 2 passes », « verrou des tests d'acceptation », « dépôt sale après spec » : refus « lot déjà dans la vague », code 2, sans geste --add", "R13 — lot rendu « fix sans commit », « dépôt sale après fix », « délai dépassé : fix », « revue non conforme sans constat actionnable » : refus inchangé", "R13 — lot rendu « HEAD déplacé », « dépendance non prête dans la vague », « worktree impossible », plan modifié par la session : refus inchangé, code 2", "R13 — la constante FIN_DE_CYCLE_WHATS : toFix au plafond écrit un outcome que addableHandBack accepte pour chacun des six what (la liste de l'écrivain et celle du lecteur ne peuvent pas diverger)", "R13 — même LotState, deux lectures : addableHandBack faux (outcome inconnu) → --add refusé ET geste sans --add ; vrai (fin de cycle non conforme) → --add accepté ET geste --add"]

contrats:
  - id: A1
    appel: commande cadence orchestrate --add <projet>:<lot> --wave <vague>
    entree: "un lot rendu de la vague vivante (hors intégration, budget, plan refusé, retrait, écart docs.sync)"
    sortie: "« <projet:lot> : ajout déposé — la vague <id> le prend entre deux étapes et le joue dès qu'un créneau est libre », code 0 ; chaque refus ci-dessous sort en code 2 avant d'agir ; le lot repart de son worktree à l'étape de R2"
    erreurs:
      - { code: log error, message: "orchestrate : <projet:lot> : lot déjà dans la vague <id>" }
      - { code: log error, message: "orchestrate : <projet:lot> : lot déjà en file d'ajout dans la vague <id>" }
      - { code: log error, message: "orchestrate : <projet:lot> : worktree du lot introuvable ou arbre sale : <cause>" }
      - { code: log error, message: "orchestrate : <projet:lot> : le budget restant de la vague (<N> tokens) ne tient pas le budget du lot (<B>)" }
      - { code: log warn, message: "orchestrate : <projet:lot> : ajout écarté à la prise : worktree du lot introuvable ou arbre sale : <cause>" }
      - { code: log error, message: "orchestrate : <projet:lot> : la vague <id> vient de finir, lot non ajouté : le lancer dans une nouvelle vague" }
    regles: [R1, R2, R3, R4, R5, R6, R7, R9, R10, R11, R12, R13]
  - id: A2
    appel: commande cadence orchestrate --status
    entree: "une vague vivante portant un lot rendu"
    sortie: "la colonne geste porte la commande --add du lot ajoutable"
    erreurs: []
    sans_erreur: "lecture seule de l'état de la vague ; un état illisible suit les chemins déjà couverts de --status"
    regles: [R8]

donnees:
  - { id: D1, objet: "LotState (lots/<projet>/<lot>.json) du lot rendu : status, next, outcome, pass, constats, steps, budget, resumedFrom, resumedReviewed", existant: true, modification: aucune, note: "valeurs de champs existants seulement, aucun champ ni format nouveau : status queued, outcome null, pass 0, budget relevé de lotSpent (R6), steps et constats conservés, resumedFrom = id de la vague vivante et resumedReviewed recalculé (R11)" }
  - { id: D2, objet: "adds.log (file d'ajouts de la vague)", existant: true, modification: aucune, note: "même entrée { id, project, lot, model } qu'un lot neuf ; le lot rendu se reconnaît à son état dans la vague" }
  - { id: D3, objet: "worktree et branche du lot (wave/<id>/<projet>/<lot>)", existant: true, modification: aucune, note: "repris tels quels avec le correctif commité du lead ; jamais recréés" }
