<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 350" width="1320" height="350" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3">
<title>A lot inside an orchestrate wave</title>
<desc>A lot without commits whose title cites a finding or an earlier lot starts with a precheck (unless orchestrate.precheck is false), then by type through spec, mockup or sheet review and sealed acceptance tests, or straight to the implementation; then the code review, corrections (two passes, a third if the review converges), the UX pass if visible, once, after the compliant code review, and an automatic raf review.</desc>
<defs><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker></defs>
<rect width="1320" height="350" fill="#0d1117"/>
<rect x="20" y="140" width="120" height="52" rx="6" fill="#0d1117" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="80" y="162.5" text-anchor="middle" font-weight="600" font-size="13.5" fill="#e6edf3">Precheck</text>
<text x="80" y="177.5" text-anchor="middle" font-size="11.5" fill="#8b949e">local or Sonnet</text>
<text x="80" y="212" text-anchor="middle" font-size="11.5" fill="#8b949e">already delivered?</text>
<text x="80" y="227" text-anchor="middle" font-size="11.5" fill="#8b949e">yes → handed to the lead</text>
<polyline points="140,166 165,166 165,60 198,60" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr2)"/>
<polyline points="165,166 198,166" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr2)"/>
<polyline points="165,166 165,272 728,272" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr2)"/>
<text x="200" y="26" text-anchor="start" font-size="11.5" fill="#8b949e">screen: page only</text>
<rect x="200" y="34" width="130" height="52" rx="6" fill="#0d1117" stroke="#8b949e" stroke-width="1.5"/>
<text x="265" y="56.5" text-anchor="middle" font-weight="600" font-size="13.5" fill="#e6edf3">Spec</text>
<text x="265" y="71.5" text-anchor="middle" font-size="11.5" fill="#8b949e">mockup + sheet</text>
<rect x="360" y="34" width="150" height="52" rx="6" fill="#0d1117" stroke="#8b949e" stroke-width="1.5"/>
<text x="435" y="56.5" text-anchor="middle" font-weight="600" font-size="13.5" fill="#e6edf3">Mockup review</text>
<text x="435" y="71.5" text-anchor="middle" font-size="11.5" fill="#8b949e">ux-reviewer · ≤ 2</text>
<polyline points="330,60 358,60" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr2)"/>
<polyline points="510,60 558,60" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr2)"/>
<text x="200" y="132" text-anchor="start" font-size="11.5" fill="#8b949e">spec: true</text>
<rect x="200" y="140" width="130" height="52" rx="6" fill="#0d1117" stroke="#8b949e" stroke-width="1.5"/>
<text x="265" y="162.5" text-anchor="middle" font-weight="600" font-size="13.5" fill="#e6edf3">Back-end spec</text>
<text x="265" y="177.5" text-anchor="middle" font-size="11.5" fill="#8b949e">cases · rules · contracts</text>
<rect x="360" y="140" width="150" height="52" rx="6" fill="#0d1117" stroke="#8b949e" stroke-width="1.5"/>
<text x="435" y="162.5" text-anchor="middle" font-weight="600" font-size="13.5" fill="#e6edf3">Sheet review</text>
<text x="435" y="177.5" text-anchor="middle" font-size="11.5" fill="#8b949e">code-reviewer · ≤ 2</text>
<polyline points="330,166 358,166" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr2)"/>
<polyline points="510,166 558,166" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr2)"/>
<rect x="560" y="34" width="130" height="158" rx="6" fill="#0d1117" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="625" y="98" text-anchor="middle" font-weight="600" font-size="13.5" fill="#e6edf3">Accept</text>
<text x="625" y="116" text-anchor="middle" font-size="11.5" fill="#8b949e">red tests</text>
<text x="625" y="131" text-anchor="middle" font-size="11.5" fill="#8b949e">sealed</text>
<text x="625" y="146" text-anchor="middle" font-size="11.5" fill="#8b949e">if orchestrate.accept</text>
