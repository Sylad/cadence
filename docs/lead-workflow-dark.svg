<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1650 700" width="1650" height="700" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3">
<title>Workflow of the lead skill in three lanes: the human, the lead session, and the orchestrate program with its agents</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
<marker id="arrw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff7b72"/></marker></defs>
<rect width="1650" height="700" fill="#0d1117"/>
<text x="825" y="34" text-anchor="middle" font-size="18" font-weight="600">The lead workflow: decide at the top, work in fresh sessions</text>
<rect x="10" y="70" width="1630" height="200" fill="#161b22" stroke="#30363d"/>
<line x1="150" y1="70" x2="150" y2="270" stroke="#30363d"/>
<text x="24" y="146" font-weight="700" font-size="15" fill="#d29922">Human</text>
<text x="24" y="166" font-size="11.5" fill="#8b949e">chooses, answers,</text>
<text x="24" y="181" font-size="11.5" fill="#8b949e">gives the UX verdict</text>
<rect x="10" y="270" width="1630" height="200" fill="#0d1117" stroke="#30363d"/>
<line x1="150" y1="270" x2="150" y2="470" stroke="#30363d"/>
<text x="24" y="339" font-weight="700" font-size="15" fill="#58a6ff">Lead session</text>
<text x="24" y="359" font-size="11.5" fill="#8b949e">stays small:</text>
<text x="24" y="374" font-size="11.5" fill="#8b949e">reads, decides, checks,</text>
<text x="24" y="389" font-size="11.5" fill="#8b949e">delivers</text>
<rect x="10" y="470" width="1630" height="200" fill="#161b22" stroke="#30363d"/>
<line x1="150" y1="470" x2="150" y2="670" stroke="#30363d"/>
<text x="24" y="546" font-weight="700" font-size="15" fill="#3fb950">orchestrate</text>
<text x="24" y="566" font-size="11.5" fill="#8b949e">program and agents</text>
<text x="24" y="581" font-size="11.5" fill="#8b949e">(fresh short sessions)</text>
<text x="240" y="88" text-anchor="middle" font-size="11.5" font-weight="600" fill="#8b949e">1 Tour</text>
<text x="420" y="88" text-anchor="middle" font-size="11.5" font-weight="600" fill="#8b949e">2 Wave</text>
<text x="600" y="88" text-anchor="middle" font-size="11.5" font-weight="600" fill="#8b949e">3 Relay</text>
<text x="780" y="88" text-anchor="middle" font-size="11.5" font-weight="600" fill="#8b949e">4 Review</text>
<text x="960" y="88" text-anchor="middle" font-size="11.5" font-weight="600" fill="#8b949e">5 Re-check</text>
<text x="1140" y="88" text-anchor="middle" font-size="11.5" font-weight="600" fill="#8b949e">6 Delivery</text>
<text x="1320" y="88" text-anchor="middle" font-size="11.5" font-weight="600" fill="#8b949e">7 Threshold</text>
<text x="1500" y="88" text-anchor="middle" font-size="11.5" font-weight="600" fill="#8b949e">8 Close</text>
<g id="tour"><rect x="161" y="337" width="158" height="66" rx="8" fill="#0c2d6b" stroke="#58a6ff" stroke-width="1.5"/>
<text x="240" y="358.5" text-anchor="middle" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5">cadence lead tour</text>
<text x="240" y="374.5" text-anchor="middle">one line per project</text>
<text x="240" y="390.5" text-anchor="middle">+ three proposals</text>
</g>
<g id="choose"><rect x="161" y="137" width="158" height="66" rx="8" fill="#3d2e00" stroke="#d29922" stroke-width="1.5"/>
<text x="240" y="158.5" text-anchor="middle" font-weight="600">Picks the lots</text>
<text x="240" y="174.5" text-anchor="middle">and the order</text>
<text x="240" y="190.5" text-anchor="middle">(the priority)</text>
</g>
<g id="launch"><rect x="341" y="337" width="158" height="66" rx="8" fill="#0c2d6b" stroke="#58a6ff" stroke-width="1.5"/>
<text x="420" y="358.5" text-anchor="middle" font-weight="600">Starts the wave</text>
<text x="420" y="374.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5">orchestrate … --wave</text>
<text x="420" y="390.5" text-anchor="middle">in the background</text>
</g>
<g id="implement"><rect x="341" y="537" width="158" height="66" rx="8" fill="#0f2d1a" stroke="#3fb950" stroke-width="1.5"/>
<text x="420" y="558.5" text-anchor="middle" font-weight="600">Implementation</text>
<text x="420" y="574.5" text-anchor="middle">test first, commits</text>
<text x="420" y="590.5" text-anchor="middle">cite the lot</text>
</g>
<g id="relay"><rect x="521" y="337" width="158" height="66" rx="8" fill="#0c2d6b" stroke="#58a6ff" stroke-width="1.5"/>
<text x="600" y="358.5" text-anchor="middle" font-weight="600">Relays the journal</text>
<text x="600" y="374.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5">tail -F journal.log</text>
<text x="600" y="390.5" text-anchor="middle">one sentence per line</text>
</g>
<g id="answer"><rect x="521" y="137" width="158" height="66" rx="8" fill="#3d2e00" stroke="#d29922" stroke-width="1.5"/>
<text x="600" y="158.5" text-anchor="middle" font-weight="600">Answers a question</text>
<text x="600" y="174.5" text-anchor="middle">the lead never</text>
<text x="600" y="190.5" text-anchor="middle">answers for them</text>
</g>
<g id="uxpass"><rect x="521" y="537" width="158" height="66" rx="8" fill="#0f2d1a" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="600" y="558.5" text-anchor="middle" font-weight="600">UX review</text>
<text x="600" y="574.5" text-anchor="middle">only if the lot is</text>
<text x="600" y="590.5" text-anchor="middle">visible and app declared</text>
</g>
<g id="codereview"><rect x="701" y="537" width="158" height="66" rx="8" fill="#0f2d1a" stroke="#3fb950" stroke-width="1.5"/>
<text x="780" y="558.5" text-anchor="middle" font-weight="600">Code review</text>
<text x="780" y="574.5" text-anchor="middle">Opus (Sonnet ≤ 0.25 d)</text>
<text x="780" y="590.5" text-anchor="middle">records raf review</text>
</g>
<g id="fix"><rect x="881" y="537" width="158" height="66" rx="8" fill="#0f2d1a" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="960" y="558.5" text-anchor="middle" font-weight="600">Correction</text>
<text x="960" y="574.5" text-anchor="middle">if not compliant: new</text>
<text x="960" y="590.5" text-anchor="middle">session, 2 passes max</text>
</g>
<g id="table"><rect x="701" y="337" width="158" height="66" rx="8" fill="#0c2d6b" stroke="#58a6ff" stroke-width="1.5"/>
<text x="780" y="358.5" text-anchor="middle" font-weight="600">Final table</text>
<text x="780" y="374.5" text-anchor="middle">ready · handed back</text>
<text x="780" y="390.5" text-anchor="middle">· « livrable jusqu'à »</text>
</g>
<g id="recheck"><rect x="881" y="337" width="158" height="66" rx="8" fill="#0c2d6b" stroke="#58a6ff" stroke-width="1.5"/>
<text x="960" y="358.5" text-anchor="middle" font-weight="600">Re-verifies itself</text>
<text x="960" y="374.5" text-anchor="middle">git log · tests · build</text>
<text x="960" y="390.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5">raf check</text>
</g>
<g id="uxverdict"><rect x="881" y="137" width="158" height="66" rx="8" fill="#3d2e00" stroke="#d29922" stroke-width="1.5"/>
<text x="960" y="158.5" text-anchor="middle" font-weight="600">Looks at the captures</text>
<text x="960" y="174.5" text-anchor="middle">UX verdict →</text>
<text x="960" y="190.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5">raf ux (visible lot)</text>
</g>
<g id="done"><rect x="1061" y="337" width="158" height="66" rx="8" fill="#0c2d6b" stroke="#58a6ff" stroke-width="1.5"/>
<text x="1140" y="358.5" text-anchor="middle" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5">raf done</text>
<text x="1140" y="374.5" text-anchor="middle">then push</text>
<text x="1140" y="390.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5">cadence deliver</text>
</g>
<g id="qa"><rect x="1061" y="537" width="158" height="66" rx="8" fill="#0f2d1a" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="1140" y="558.5" text-anchor="middle" font-weight="600">qa-reviewer</text>
<text x="1140" y="574.5" text-anchor="middle">reads only; blocking</text>
<text x="1140" y="590.5" text-anchor="middle">findings → the human</text>
</g>
<g id="ctx"><rect x="1241" y="337" width="158" height="66" rx="8" fill="#0c2d6b" stroke="#58a6ff" stroke-width="1.5"/>
<text x="1320" y="358.5" text-anchor="middle" font-weight="600">Context under 60 %?</text>
<text x="1320" y="374.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5">session context</text>
<text x="1320" y="390.5" text-anchor="middle">error = at threshold</text>
</g>
<g id="next"><rect x="1241" y="537" width="158" height="66" rx="8" fill="#0f2d1a" stroke="#3fb950" stroke-width="1.5"/>
<text x="1320" y="558.5" text-anchor="middle" font-weight="600">Next wave</text>
<text x="1320" y="574.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5">… --continue</text>
<text x="1320" y="590.5" text-anchor="middle">draws the next ready lot</text>
</g>
<g id="close"><rect x="1421" y="337" width="158" height="66" rx="8" fill="#0c2d6b" stroke="#58a6ff" stroke-width="1.5"/>
<text x="1500" y="358.5" text-anchor="middle" font-weight="600">Close</text>
<text x="1500" y="374.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5">session-close</text>
<text x="1500" y="390.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5">session next ×3</text>
</g>
<g id="report"><rect x="1421" y="137" width="158" height="66" rx="8" fill="#3d2e00" stroke="#d29922" stroke-width="1.5"/>
<text x="1500" y="158.5" text-anchor="middle" font-weight="600">One line per project</text>
<text x="1500" y="174.5" text-anchor="middle">delivered · in progress</text>
<text x="1500" y="190.5" text-anchor="middle">· blocked (and why)</text>
</g>
<polyline points="240,337 240,203" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="248" y="236" text-anchor="start" font-size="11" fill="#8b949e" class="lbl">proposals</text>
<polyline points="319,170 420,170 420,337" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="414" y="164" text-anchor="end" font-size="11" fill="#8b949e" class="lbl">choice</text>
<polyline points="420,403 420,537" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>
<polyline points="499,570 521,570" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>
<polyline points="679,570 701,570" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>
<polyline points="859,570 881,570" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>
<polyline points="960,537 960,519 820,519 820,537" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="826" y="513" text-anchor="start" font-size="11" fill="#8b949e" class="lbl">then review again</text>
<polyline points="740,537 740,403" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="734" y="438" text-anchor="end" font-size="11" fill="#8b949e" class="lbl">wave ends</text>
<polyline points="570,537 570,403" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="564" y="437" text-anchor="end" font-size="11" fill="#8b949e" class="lbl">journal</text>
<polyline points="630,337 630,203" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="636" y="236" text-anchor="start" font-size="11" fill="#8b949e" class="lbl">question</text>
<polyline points="570,203 570,337" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="564" y="236" text-anchor="end" font-size="11" class="lbl" fill="#8b949e">--resume --answer</text>
<polyline points="859,370 881,370" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>
<polyline points="960,203 960,337" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="968" y="236" text-anchor="start" font-size="11" fill="#8b949e" class="lbl">on the human's verdict</text>
<polyline points="1039,370 1061,370" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>
<polyline points="1140,403 1140,537" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>
<polyline points="1320,403 1320,537" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="1326" y="440" text-anchor="start" font-size="11" fill="#8b949e" class="lbl">yes: chain</text>
<polyline points="1399,370 1421,370" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="1410" y="329" text-anchor="middle" font-size="11" fill="#8b949e" class="lbl">≥ 60 %: close</text>
<polyline points="1500,337 1500,203" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>
<polyline points="1320,603 1320,633 420,633 420,603" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="870" y="627" text-anchor="middle" font-size="11" fill="#8b949e" class="lbl">next wave: back to step 2, the limits still apply</text>
<rect x="170" y="648" width="22" height="14" rx="3" fill="none" stroke="#8b949e" stroke-dasharray="5 3"/>
<text x="200" y="659" font-size="11.5" fill="#8b949e">conditional step</text>
<text x="340" y="659" font-size="11.5" fill="#8b949e">The lead never commits where a wave runs, and never delivers two projects at once. At most two sessions or subagents at a time.</text>
</svg>
