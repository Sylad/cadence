sujet:
  id: orchestrate-budget-correction
  titre: "orchestrate : allocation spec relevée et « correction non jouée (budget) » dans le tableau"
  lot: L218
  perimetre:
    modules: [src/orchestrate/command.ts, src/orchestrate/cycle.ts, src/orchestrate/table.ts]
    endpoints: []
    jobs: []
    hors_perimetre:
      - "la forme de la règle fixAffordable (cycle.ts:553 : dépensé + réserve < budget) : inchangée, seule la valeur de la réserve change (R4)"
      - "un champ de plan qui déclarerait « touche la base » (schéma du plan publié : question posée au lead)"
      - "les plafonds de vague (--budget) et le plancher de 750 k d'un lot de plus de 0,5 j (command.ts:71) ; seul le plancher jusqu'à 0,5 j est relevé (R3)"
# Mesure (journaux .cadence/runs, 15-10) :
# Journaux .cadence/runs (523 fichiers lot, 15-10). Lots à étape spec sans écran : warhammer L120 740 k / 800 k
# (précontrôle→accept 388 k, implement 153 k, revue Opus 131 k, fix 69 k) ; cadence L217 652 k / 800 k (avant implement 176 k,
# revues Opus 86 à 92 k, fix 37 à 46 k). Lot S back : maritime B26.1 406 k / 450 k (implement 240 k, revue Opus 140 k).
# Sur tous les journaux : fix Sonnet 497 passes, médiane 45 k, p90 65 k, max 124 k ; revue Opus 492, médiane 63 k, p90 106 k ;
# revue courte Opus 272, médiane 45 k, p90 88 k ; revue Sonnet 87, p90 43 k ; revue courte Sonnet 39, p90 53 k.
# Réserve : p90 fix 65 k + p90 revue courte Opus 88 k = 153 k, arrondi à 155 k (somme des p90 = majorant du p90 de la somme ;
# la somme par lot n'a pas été recalculée, journaux non disponibles à cette session).
# Plancher d'un lot ordinaire : dimensionné pour payer la correction (command.ts:60-69, test:1285 : 14 k + 282 k + 80 k + 65 k = 441 k
# arrondis à 450 k). La réserve passant de 65 k à 155 k, le plancher passe de même : 14 k + 282 k + 80 k + 155 k = 531 k, arrondi à 540 k
# (R3). Le p90 du total d'un lot ≤ 0,5 j (374 k, L194) reste très en dessous. La part des lots dont le fix aurait été refusé n'est pas
# recalculée (journaux non disponibles) : le relèvement la rend nulle par construction pour le pire cas mesuré L62.
# La chaîne avant implement de L120 (388 k) dépasse l'allocation de 350 k de 38 k.

cas:
  - id: C1
    titre: "Le lead lance un lot à étape spec : son budget couvre la chaîne spec, une correction et sa revue"
    acteur: le lead
    declencheur: commande cadence orchestrate (dont --dry-run)
    preconditions:
      - le lot déclare spec (spec true) ou screen
    nominal:
      - Le programme dérive le budget de l'estimate (lotBudget, command.ts:98).
      - "Il y ajoute l'allocation de l'étape spec, relevée à 450 k."
      - "Il affiche « budget du lot : N tokens comptés (base : … plus 450000 pour les étapes spec … ) » (command.ts:371)."
    alternatives:
      - { si: "le lot est à screen", alors: "le total mesuré de 1,3 M reste le plancher, l'allocation ne joue qu'au-delà", regles: [R2] }
      - { si: "le lot n'a ni spec ni screen", alors: "budget ordinaire, plancher relevé à 540 k jusqu'à 0,5 j", regles: [R3] }
    resultat: Un lot spec de 0,5 j dispose de 990 k (540 k + 450 k) au lieu de 800 k.
  - id: C2
    titre: "Le budget ne garantit pas la passe de correction ET la revue courte qui la suit"
    acteur: le planificateur de la vague
    declencheur: étape fix d'un lot (cycle.ts:598)
    preconditions:
      - la revue a rendu des constats bloquants ou majeurs
      - dépensé + 155 k >= budget du lot (réserve d'une passe fix et de la revue courte qui la suit), ou dépensé >= budget
    nominal:
      - "La session fix est refusée avant d'écrire (règle L145 inchangée)."
      - "Le lot est rendu au lead avec ses constats."
      - "La cause du tableau commence par « correction non jouée (budget) »."
    alternatives:
      - { si: "l'étape refusée est implement, spec ou accept", alors: "libellé actuel inchangé, sans « correction »", regles: [R5] }
      - { si: "le budget du lot permet la réserve de 155 k", alors: "la passe est jouée, puis sa revue courte l'est aussi", regles: [R4] }
    resultat: Le lead voit dans le tableau que la correction n'a pas eu lieu faute de budget et la reprend à la main.

regles:
  - id: R1
    cas: [C1]
    enonce: "SPEC_STAGE_ALLOCATION passe de 350 000 à 450 000 : lotBudget(e, 'spec') = budget ordinaire + 450 000 (0,5 j : 990 000 avec le plancher relevé de R3 ; 1 j : 1 200 000)."
    statut: hypothese
    si_faux: "Seule la constante change (command.ts:84, tests de budget) ; aucune donnée en jeu. 450 k = chaîne mesurée la plus chère avant implement (388 k, L120) arrondie à +60 k ; L217 n'en a pris que 176 k, un lot de 0,5 j avec spec reste sous 990 k dans 2 cas sur 2 sans écran."
    tests: ["R1 — lotBudget(0.5, 'spec') vaut 990000 et lotBudget(1, 'spec') 1200000", "R1 — lotBudgetBasis cite 450000 pour les étapes spec"]
  - id: R2
    cas: [C1]
    enonce: "Pour un lot à screen, le budget reste max(1 300 000, ordinaire + 450 000) : inchangé pour une estimate jusqu'à 1,25 j (1,3 M), plus haut au-delà (2 j : 1 590 000)."
    statut: sourcee
    source: "src/orchestrate/command.ts:100 et test/orchestrate-command.test.ts:1294-1301 (le total mesuré L194 est le plancher d'un lot à écran)"
    tests: ["R2 — lotBudget(0.5, 'screen') et lotBudget(1, 'screen') valent toujours 1300000", "R2 — lotBudget(2.5, 'screen') vaut 1425000 + 450000"]
  - id: R3
    cas: [C1]
    enonce: "Le plancher d'un lot ordinaire jusqu'à 0,5 j passe de 450 000 à 540 000 (LOT_BUDGET_FLOOR), pour que la réserve de 155 000 (R4) laisse la même marge qu'avant : le fix d'un lot ordinaire est refusé à partir de 385 k dépensés (540 k − 155 k), comme avant (450 k − 65 k). Les paliers au-delà de 0,5 j (750 k, 570 k par jour) ne bougent pas : leur marge avant refus passe de 685 k à 595 k, recul assumé (le p90 du total de ces lots est 732 k)."
    statut: hypothese
    si_faux: "Seule la constante change (command.ts:69, tests de budget), aucune donnée en jeu. Si le plancher devait rester à 450 k, un lot ordinaire de 0,5 j se verrait refuser le fix dès 295 k dépensés (scénario B26.1 : implement + revue Opus 250 k) ; si le palier de 750 k devait être relevé aussi (840 k), seule la constante LOT_BUDGET_ONE_DAY change. Base : test/orchestrate-command.test.ts:1285 (14 k + 282 k + 80 k + réserve) et CHANGELOG 0.26.0 ; p90 374 k d'un lot ≤ 0,5 j (command.ts:60-69) inchangé."
    tests: ["R3 — lotBudget(0.1) et lotBudget(0.5) valent 540000 sans étape spec", "R3 — le plancher couvre 14 k + 282 k + 80 k + 155 k (la réserve de R4)", "R3 — lotBudget(0.75) vaut toujours 750000 et lotBudget(2) 1140000", "R3 — lotBudgetBasis d'un lot ≤ 0,5 j cite toujours le plancher"]
  - id: R4
    cas: [C2]
    enonce: "La réserve passe de 65 000 (revue seule) à 155 000, p90 mesuré d'une passe fix (65 k) plus d'une revue courte (88 k, Opus) arrondi : une passe fix est jouée seulement si dépensé + 155 000 < budget du lot, de sorte que la correction et la revue courte qui la suit soient payées. Sans budget de lot : toujours jouée (inchangé)."
    statut: sourcee
    source: "réponse du lead à la question du lot : « la réserve doit garantir une passe de correction ET la revue courte qui la suit, dimensionnée sur le p90 mesuré d'une passe fix + revue courte dans les journaux » ; règle actuelle cycle.ts:550-553 (L145) dont seule la valeur change ; mesure 15-10 en tête de fiche"
    tests: ["R4 — dépensé + 155000 juste sous le budget : le fix est joué", "R4 — dépensé + 155000 égal au budget : le fix est refusé", "R4 — lot sans budget : le fix est toujours joué"]
  - id: R5
    cas: [C2]
    enonce: "Quand l'étape refusée est un fix (réserve non tenue ou budget atteint), l'outcome du lot commence par « correction non jouée (budget) : » ; le reste du texte actuel (budget du lot : x / y …, « étape « fix » non jouée », préfixe tests rouges) est conservé, sauf le membre de la réserve reformulé en « il ne reste pas de quoi payer la correction et la revue courte qui la suivrait (155000 réservés) » (formulation : hypothèse de rédaction, la valeur suit R4) ; pour implement, spec et accept il n'y a pas ce préfixe."
    statut: sourcee
    source: "demande du lot : « dire dans le tableau ‹correction non jouée (budget)› pour que le lead reprenne à la main » ; texte actuel cycle.ts:900-906"
    tests: ["R5 — fix refusé par la réserve : outcome commence par « correction non jouée (budget) : »", "R5 — fix refusé budget dépassé : même préfixe", "R5 — tests rouges après l'implémentation : préfixe puis « tests rouges après l'implémentation »", "R5 — implement refusé : pas de « correction non jouée »"]
  - id: R6
    cas: [C2]
    enonce: "La ligne du tableau d'un lot rendu affiche l'outcome tel quel (donc le préfixe), suivi des constats de la revue."
    statut: sourcee
    source: "src/orchestrate/table.ts:117-119"
    tests: ["R6 — tableau d'un lot rendu sur un fix refusé : la ligne contient « correction non jouée (budget) » et les constats"]

contrats:
  - id: A1
    appel: commande cadence orchestrate --dry-run
    entree: "un lot du plan à spec true, ou à screen, ou ordinaire"
    sortie: "la ligne « budget du lot : N tokens comptés (base : …) » : 990 000 pour un lot spec de 0,5 j, 1 300 000 pour un lot à écran, 540 000 pour un lot ordinaire de 0,5 j"
    erreurs: []
    sans_erreur: "le calcul du budget est pur et n'a pas de cas d'échec : le lot inconnu est déjà refusé par la commande (hors lot)"
    regles: [R1, R2, R3]
  - id: A2
    appel: commande cadence orchestrate (vague)
    entree: "un lot dont la revue vient de rendre des constats et dont le reste de budget est inférieur à 155 k"
    sortie: "lot en statut handed-back, outcome « correction non jouée (budget) : budget du lot : x / y tokens comptés (…), il ne reste pas de quoi payer la correction et la revue courte qui la suivrait (155000 réservés) : étape « fix » non jouée, à décider par le lead »"
    erreurs: []
    sans_erreur: "l'absence de budget n'est pas une erreur de la commande mais un statut du lot ; elle ne produit ni code ni journal d'erreur"
    regles: [R4, R5, R6]

donnees:
  - { id: D1, objet: "wave.json et <projet>--<lot>.json : champs budget et outcome du lot", existant: true, modification: aucune, note: "même format ; seul le contenu de budget (spec) et le début du texte d'outcome changent" }
