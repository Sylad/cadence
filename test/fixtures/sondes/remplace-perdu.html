<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Sonde — élément remplacé sans équivalent</title>
<style>body{font:14px sans-serif;margin:0;padding:16px} .ligne{display:flex;gap:8px;padding:6px 0;height:24px}</style></head>
<body>
<!-- Le clic remplace la case par deux cases du même nom : la sonde ne peut pas dire laquelle suivre. -->
<div id="couches"><label class="ligne"><input type="checkbox"> Couche</label></div>
<script>
  document.querySelector('#couches input').addEventListener('change', () => {
    document.getElementById('couches').innerHTML = '<label class="ligne"><input type="checkbox"> Couche</label><label class="ligne"><input type="checkbox"> Couche</label>';
  });
</script>
</body></html>
