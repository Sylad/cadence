<text x="795" y="208" text-anchor="middle" font-weight="600" font-size="13.5" fill="#e6edf3">Implementation</text>
<text x="795" y="223" text-anchor="middle" font-size="11.5" fill="#8b949e">test first</text>
<text x="795" y="238" text-anchor="middle" font-size="11.5" fill="#8b949e">commits citing the lot</text>
<rect x="888" y="193" width="140" height="52" rx="6" fill="#0d1117" stroke="#8b949e" stroke-width="1.5"/>
