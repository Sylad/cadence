<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 250" width="1100" height="250" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1f2328">
<title>A lot done by cadence run, and the role of the lead</title>
<desc>The lead picks a lot and launches cadence run; one Opus session reads the references when the request has some, writes the tests and the code in a worktree; the full gate runs once; the work is integrated by fast-forward; the lead delivers.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
<rect width="1100" height="250" fill="#ffffff"/>
<rect x="20" y="16" width="1060" height="52" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="40" y="38" font-weight="600" font-size="13.5">The lead (you, or the lead skill)</text>
<text x="40" y="57" font-size="12" fill="#57606a">picks the lot · launches cadence run · answers its questions · delivers one project at a time</text>
<rect x="20" y="130" width="180" height="62" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="110" y="157" text-anchor="middle" font-weight="600" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">references</text>
<text x="110" y="176" text-anchor="middle" font-size="11.5" fill="#57606a">complet: read in full</text>
<rect x="240" y="130" width="180" height="62" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
<text x="330" y="157" text-anchor="middle" font-weight="600" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">session</text>
<text x="330" y="176" text-anchor="middle" font-size="11.5" fill="#57606a">one Opus session, code + tests</text>
<line x1="202" y1="161" x2="237" y2="161" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="460" y="130" width="180" height="62" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
<text x="550" y="157" text-anchor="middle" font-weight="600" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">gate</text>
<text x="550" y="176" text-anchor="middle" font-size="11.5" fill="#57606a">full suite, once</text>
<line x1="422" y1="161" x2="457" y2="161" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="680" y="130" width="180" height="62" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
<text x="770" y="157" text-anchor="middle" font-weight="600" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">integrate</text>
<text x="770" y="176" text-anchor="middle" font-size="11.5" fill="#57606a">fast-forward, no push</text>
<line x1="642" y1="161" x2="677" y2="161" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="900" y="130" width="180" height="62" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
<text x="990" y="157" text-anchor="middle" font-weight="600" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">deliver</text>
<text x="990" y="176" text-anchor="middle" font-size="11.5" fill="#57606a">CI + proof</text>
<line x1="862" y1="161" x2="897" y2="161" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="14" y="112" width="852" height="88" rx="8" fill="none" stroke="#0969da" stroke-width="1" stroke-dasharray="2 3"/>
<text x="24" y="106" font-size="11.5" fill="#0969da" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">cadence run --lot L12 --fond · its own worktree, its own context</text>
<line x1="110" y1="68" x2="110" y2="96" stroke="#0969da" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#a)"/>
<line x1="990" y1="127" x2="990" y2="68" stroke="#0969da" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#a)"/>
<text x="20" y="220" font-size="11.5" fill="#57606a">dashed: only when the request has references to read (a --piece, a word of references: in cadence.yaml); otherwise the session works as Claude alone.</text>
<text x="20" y="238" font-size="11.5" fill="#57606a">Every request is kept word for word in .cadence/demandes/; a red gate goes back to the same session once; a delivery counts only when its checks pass.</text>
</svg>
