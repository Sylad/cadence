# Documentation qui suit le code (docs.sync, L143) : un lot dont les commits touchent le code,
# les gabarits, les agents ou les skills doit aussi toucher le README ou une page docs/ (le contenu du README y est parti, L232).
docs:
  sync:
    - paths: [src/**, bin/*.js, templates/**, agents/**, skills/**, '!**/*.test.ts']
      docs: [README.md, 'docs/*.md']
  since: 2026-10-09

# Porte « code modifié sans test » (L287) : le code du paquet sans fichier de test touché part en correction avant la revue.
orchestrate:
  # Porte de tests (L324, 25-10) : la vague lance la suite et le typecheck après chaque écriture ; un rouge part en correction au lieu d'arriver dans main.
  test: npx vitest run
  build: npx tsc --noEmit
  # Mode worktree (L279) : un worktree par lot ; activé par défaut le 25-10 (L320, décision Sylvain après les essais L310 et L316 : −45 % et −22 % de mur, 3 intégrations automatiques).
  worktrees: true
  # Précheck sur Sonnet (L328, 25-10) : le local (claude-local) plantait sur ~1 lot sur 3 et disait « oui » à tort ; Sonnet tranche en ~16 s.
  precheck: true
  testGate:
    code: [src/**, 'bin/*.js', '!**/*.test.ts']
    tests: ['test/**']

# Lecteurs de l'ancien emplacement du plan (l'ancien dossier du plan) que « raf migrate » laisse tels quels (L284) : ils décrivent ou testent le repli sur l'ancien emplacement
# (les autres projets n'ont pas tous migré), ou datent d'avant le déplacement (fiches, conceptions, mesures).
migrate:
  keep:
    - src/**
    - scripts/mise-en-service.mjs
    - templates/**
    - agents/**
    - skills/**
    - README.md
    - docs/raf.md
    - docs/fonctionnement.md
    - docs/stabilite.md
    - docs/orchestrate.md
    - docs/lead.md
    - docs/session.md
    - docs/specs/**
    - docs/superpowers/**
    - docs/mesures/**
    - docs/perf/**
    - test/migrate.test.ts
    - test/plan-dossier-cache.test.ts
    - test/orchestrate-precheck-l322.test.ts
    - test/check.test.ts
    - test/lead-tour-perf.test.ts
    - test/ventilation-plan.test.ts
    - test/mise-en-service.test.ts
    - test/orchestrate-command.test.ts          # le plan d'un autre outil, taches.yaml (plan: path)
    - test/orchestrate-worktree-harness.ts
    - test/orchestrate-worktree-plan-writes.test.ts
